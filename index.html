<head>

<title>Futbol Haber Akışı</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--line:#cfe6d8;--green:#137a43;--greenbg:#e3f4ea;--greentx:#1c7a46;--red:#8e1b2e;--blue:#1b3a63;--mut:#7b8794;--ink:#1d2733}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px}
.wrap{max-width:1840px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:4px 2px 12px}
.top h1{font-size:20px;margin:0;font-weight:700}
.top .upd{color:#46566a;font-size:13.5px}
.top .upd b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:1px solid #cfd6de;background:#fff;color:#2c3a4b;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;line-height:1.2;font-family:inherit}
.chip b{font-weight:600;color:#7a8696;margin-left:5px}
.chip:hover{border-color:#9aa7b6}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on b{color:#f1d3d9}
.info{background:#eef3fb;border:1px solid #d3deef;color:#46566a;border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media(max-width:1250px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.done{opacity:.6;background:#f6faf7}
.hd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:9px 12px;border-bottom:1px solid #e3efe7}
.no{color:#8795a5;font-size:13px;min-width:18px}
.pill{background:var(--greenbg);color:var(--greentx);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.nt{background:#eef0f3;color:#667385}
.src{font-weight:700;font-size:13.5px}
.tag{background:#e2ecfb;color:#1f4f9c;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.tag.ab{background:#efe5fb;color:#5b2e9a}
.paylas{margin-left:auto;display:flex;align-items:center;gap:6px;color:#55657a;font-size:13px;cursor:pointer;user-select:none}
.paylas input{width:16px;height:16px;accent-color:var(--green)}
.body{display:flex;gap:0}
.panel{flex:0 0 150px;background:#f6f8fa;border-right:1px solid #e4eaf0;padding:10px;display:flex;flex-direction:column;gap:9px}
.logos{background:#fff;border:1px solid #e1e7ee;border-radius:8px;padding:8px;display:flex;justify-content:center;align-items:center;gap:8px;min-height:62px}

.logos.one img,.logos.one .ph{width:62px;height:62px}
.ph{background:#e9edf2;color:#5d6b7c;border:1px dashed #b9c4d0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-align:center;line-height:1}
.ph.sq{border-radius:6px;font-size:11px}
.photos{display:flex;flex-direction:column;gap:8px}
.ph1{background:#fff;border:1px solid #e1e7ee;border-radius:8px;overflow:hidden}
.ph1 a{display:block}
.ph1 img{display:block;width:100%;height:112px;object-fit:cover;object-position:50% 25%;background:#dfe5ec}
.ph1 .phn{height:112px;border-radius:0;border:0;border-bottom:1px dashed #b9c4d0;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:#8895a5;font-size:11.5px;text-align:center;padding:6px}
.cap{padding:5px 7px 6px}
.cap .n{color:#4b2fa3;font-weight:700;font-size:12px;line-height:1.25}
.cap .f{font-family:Consolas,"Courier New",monospace;font-size:10.5px;color:#4d5967;background:#f1f4f7;border:1px solid #e1e6ec;border-radius:5px;padding:2px 5px;margin-top:4px;word-break:break-all}
.lg{font-size:11.5px;color:#4b2fa3;font-weight:700;text-align:center;line-height:1.3}
.lg span{display:block;color:#98a3b0;font-weight:400}
.main{flex:1;min-width:0;padding:10px 12px 8px;display:flex;flex-direction:column;gap:10px}
.title{color:#1c7a46;font-size:12.5px;font-weight:600;line-height:1.35}
.lang .lh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;color:#fff;background:#b3261e}
.badge.en{background:#1d4e89}
.txt{font-family:Consolas,"Courier New",ui-monospace,monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;color:#1f2933}
.act{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn{background:var(--green);color:#fff;border:0;border-radius:7px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:#0e6637}
.btn.ok{background:#0b5a2f}
.cnt{color:#97a2af;font-size:12.5px}
.sep{border:0;border-top:1px dashed #dde5ec;margin:0}
.ft{border-top:1px solid #e3efe7;background:#fafcfb;padding:8px 12px;font-size:12.5px;color:#55657a;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.ft a{color:#1b4f9c;text-decoration:underline;font-weight:600}
.ft .oth a{font-weight:400;color:#6a7a8c;margin-left:6px}
.foot{margin-top:22px;color:#8795a5;font-size:12px;text-align:center}
@media(max-width:560px){.body{flex-direction:column}.panel{flex:none;border-right:0;border-bottom:1px solid #e4eaf0}.photos{flex-direction:row}.ph1{flex:1}}
</style>

 beraberlik, 131 yenilgi.","en":"Tonight's trip to Lille will be Galatasaray's 343rd European fixture and their first ever meeting with the French side, who become their 115th different opponent on the continent. Their record from 342 European games reads 121 wins, 90 draws and 131 defeats.","title":"Galatasaray, Lille ile Avrupa kupalarında ilk kez karşılaşacak","sources":["mackolik.com"],"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270810/Lille-ile-ilk-randevu","other_urls":[{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270809/Galatasaray-343-kez-sahne-alacak"}],"datetime":"2026-10-21T00:00:00+03:00","time_known":false,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[],"no":35,"date_text":"21 Ekim","time_text":null,"day_full":"21 Ekim 2026"},{"id":"787ac86e3c","tr":"Slavia Prag'ın 90. dakikadaki beraberlik golünün ardından Kadıköy'de tribünler 'İsmail Kartal istifa' diye bağırdı. Fenerbahçe, 18 yıl sonra döndüğü Şampiyonlar Ligi'nde hâlâ galibiyet alamadı.","en":"Chants of 'Ismail Kartal, resign' rang around Kadikoy after Slavia Prague's 90th-minute equaliser. Fenerbahce are still waiting for a first win on their return to the Champions League after 18 years.","title":"Kadıköy'de dram! Fenerbahçe tribünleri 'İsmail istifa' sesleriyle inledi","sources":["fanatik.com.tr","ntvspor.net","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/kadikoyde-dram-fenerbahce-tribunleri-ismail-istifa-sesleriyle-inledi-2641744","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-son-dakika-fenerbahce-tribunlerinde-ismail-kartal-istifa-tezahuratlari-431625"},{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-tribunle ,{"id":"097e2f4572","tr":"Fenerbahçe, Şampiyonlar Ligi'nde Slavia Prag'la evinde 2-2 berabere kaldı. Oğuz Aydın ve Greenwood'un golleriyle 11 dakikada 2-0 öne geçen sarı-lacivertliler, Provod ve 90. dakikada Kacor'un golleriyle galibiyeti kaçırdı. Fenerbahçe 3 maçta 2 puanda.","en":"Fenerbahce let slip a two-goal lead as they were held 2-2 by Slavia Prague in the Champions League. Oguz Aydin and Mason Greenwood had them 2-0 up inside 11 minutes, but Provod pulled one back and Kacor levelled in the 90th minute. Fenerbahce have two points from three games.","title":"Fenerbahçe, üstünlüğünü koruyamadı: 90'da beraberliğe razı oldu","sources":["fanatik.com.tr","fotomac.com.tr","mackolik.com","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-fenerbahce-ustunlugunu-koruyamadi-90da-beraberlige-razi-oldu-431610","other_urls":[{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270794/Fenerbahce-Slavia-Prag-ile-berabere"},{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-elindeki-galibiyeti-son-anlarda-kacirdi-SXHBQ1179999SXQ"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/live-ozet-fenerbahce-firsati-degerlendiremedi-evinde-1-puana-razi-oldu-fenerbahce-slavia-prag-mac-sonucu-2-2-2641625"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-fenerbahce-galibiyete-hasret-sampiyonlar-liginde-son-puan-durumu-431622"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/fenerbahce/2026/10/20/fenerbahce-slavia-prag-karsisinda-one-gecti-iste-o-goller"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/fenerbahce/2026/10/20/guendouziden-buyuk-hata-cekya-ekibi-farki-1e-indirdi"}],"datetime":"2026-10-20T19:30:48+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavi CE_CORENDON_ALANYASPOR.jpg"}],"no":43,"date_text":"20 Ekim","time_text":"18:13","day_full":"20 Ekim 2026"},{"id":"cfcbf5dbb8","tr":"Kocaelispor hocası Selçuk İnan, Cuma günkü Alanyaspor deplasmanı öncesi sakatlıklarda son durumu açıkladı. Takımla çalışmaya başlayan Maglica'nın ilk 11'de başlama ihtimali var; Zoukrou birkaç hafta daha yok, Petkovic'in 2-3 haftada dönmesi bekleniyor.","en":"Kocaelispor boss Selcuk Inan has given an injury update ahead of Friday's trip to Alanyaspor. Matej Maglica is back in training and could start, Tanguy Zoukrou faces a few more weeks out, and Bruno Petkovic is expected back in two to three weeks.","title":"Selçuk İnan’dan sakatlık raporu: 3 isimde son durum","sources":["beinsports.com.tr","fanatik.com.tr","mackolik.com","ntvspor.net","sporx.com","trtspor.com.tr"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-selcuk-inandan-sakatlik-raporu-3-isimde-son-durum-431613","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/kocaelispor/kocaelisporun-sakatlik-kabusu-selcuk-inan-bizde-klise-oldu-2641736"},{"source":"sporx.com","url":"https://www.sporx.com/selcuk-inan-dan-sakatlik-aciklamasi-SXHBQ1179996SXQ"},{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/selcuk-inandan-alanyaspor-maci-yorumu-33685476"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/selcuk-inandan-sakatlik-aciklamasi"},{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270793/Iyi-mucadele-vermek-istiyoruz"}],"datetime":"2026-10-20T18:08:25+03:00","time_known":true,"tags":["sakatlık","kadro","açıklama"],"clubs":[{"name":"Kocaelispor","logo":"Logolar\\Süper Lig\\Kocaelispor.png","img":"La2d24480","file":"Logolar\\Süper Lig\\Kocaelispor.png"},{"name":"Alanyaspor","logo":"Logolar\\Süper Lig\\Alanyaspor.png","img":"L0fe200e4","file":"Logolar\\Süper Lig\\Alanyaspor.png"}],"players":[{"name":"Selçuk İnan","label":"Kocaelispor - Selçuk İnan","folders":[{"area":"tr","folder" epte bulunmam söz konusu değil' dediği aktarıldı.","en":"Sergen Yalcin did not even discuss wages in his initial talks with the TFF, according to Sabah. 'This is the national team. Making any financial demand is out of the question,' the 53-year-old is reported to have said.","title":"TFF ne kadar maaş istediğini sordu, Sergen Yalçın saniyesinde cevap verdi","sources":["ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-tff-ne-kadar-maas-istedigini-sordu-sergen-yalcin-saniyesinde-cevap-verdi-431581","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/tff-ne-kadar-maas-istedigini-sordu-sergen-yalcin-saniyesinde-cevap-verdi-SXHBQ1179933SXQ"}],"datetime":"2026-10-20T09:32:56+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"A Milli Takım","logo":"Logolar\\Ülke Bayrakları\\Turkey.png","img":"Lfdea17ba","file":"Logolar\\Ülke Bayrakları\\Turkey.png"}],"players":[],"no":65,"date_text":"20 Ekim","time_text":"09:32","day_full":"20 Ekim 2026"},{"id":"167c29ca9f","tr":"Yedi hakemin TFF Başkanı İbrahim Hacıosmanoğlu ve eski MHK Başkanı Ferhat Gündoğdu hakkında İstanbul Cumhuriyet Başsavcılığı'na suç duyurusunda bulunduğu bildirildi.","en":"Seven referees have reportedly filed a criminal complaint with the Istanbul Chief Public Prosecutor's Office against TFF president Ibrahim Haciosmanoglu and former referees' committee chief Ferhat Gundogdu.","title":"Yedi hakemden Hacıosmanoğlu hakkında suç duyurusu","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/yedi-hakemden-haciosmanoglu-hakkinda-suc-duyurusu-SXHBQ1179915SXQ","other_urls":[],"datetime":"2026-10-20T09:26:38+03:00","time_known":true,"tags":["hakem"],"clubs":[],"players":[{"name":"İbrahim Hacıosmanoğlu","label":"İbrahim Hacıosmanoğlu (A Milli Takım)","folders":[{"area":"milli","folder":"İbrahim Hacıosmanoğlu"}],"img":"P6a960a39","file":"AA-20261009-42705129-42705122-TURKIYE_FUTBOL_FEDERASYONU_YONETIM_KURULU_OLAGANUSTU_TOPLANTISI.jpg"}],"no":66,"date_text":"20 Ekim","time_text":"09:26","day_full":"20 Ekim 2026"},{"id":"a4c6509c6b","tr":"NTV Spor'a göre TFF, Sergen Yalçın ile 2027 yazındaki federasyon seçimine kadar geçerli bir sözleşme imzalayacak. Yalçın'ın bugün 15.00'teki toplantının ardından duyurulması bekleniyor; ilk sınavı 12 Kasım'da Belçika maçı.","en":"According to NTV Spor, the TFF will hand Sergen Yalcin a contract running until the federation elections in summer 2027. He is expected to be unveiled after a meeting at 15:00 today, with Belgium in Izmir on 12 November his first test.","title":"TFF'nin Sergen Yalçın'la yapacağı sözleşmenin detayı ortaya çıktı! Kontrat süresi belli oldu","sources":["ntvspor.net","transfermarkt.com.tr"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-tffnin-sergen-yalcinla-yapacagi-sozlesmenin-detayi-ortaya-cikti-kontrat-suresi-belli-oldu-431580","other_urls":[{"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/sergen-yalcinin-sozlesme-suresi-ortaya-cikti-tffde-2027-secimlerine-kadar-gorev-yapacak/view/news/489211"}],"datetime":"2026-10-20T09:12:40+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"A Milli Takım","logo":"Logolar\\Ülke Bayrakları\\Turkey.png","img":"Lfdea17ba","file":"Logolar\\Ülke Bayrakları\\Turkey.png"}],"players":[],"no":67,"date_text":"20 Ekim","time_text":"09:12","day_full":"20 Ekim 2026"},{"id":"ec26847679","tr":"Rafael Leao, Fenerbahçe derbisine yetişmeyi hedefliyor ancak Sözcü'ye göre kasık sakatlığı nedeniyle 26 Ekim'e planlanan derbide forma giyemeyecek. Portekizli yıldız yarın eski takımı Lille'e karşı da oynayamayacak.","en":"Rafael Leao is targeting a return for the Fenerbahce derby, but Sozcu claim his groin strain will rule him out of the derby, currently set for 26 October. The Portugal star will also miss tomorrow's Champions League trip to his old club Lille.","title":"Eyvah! Leao'dan Galatasaraylıların hiç duymak istemeyeceği haber geldi","sources":["fanatik.com.tr","n , Trabzonspor tarihinde ilk üç Süper Lig maçını kazanan ilk yabancı teknik direktör oldu. Galatasaray 4-0, Samsunspor 3-0, Beşiktaş 2-0: 9 gol attı, hiç gol yemedi.","en":"Thomas Reis has become the first foreign manager in Trabzonspor's history to win his first three Super Lig games. Galatasaray 4-0, Samsunspor 3-0, Besiktas 2-0: nine scored, none conceded.","title":"Thomas Reis, Trabzonspor tarihine geçti! Üç maçta üç galibiyet, 9 gol","sources":["fanatik.com.tr","sporx.com","trtspor.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/trabzonspor/thomas-reis-trabzonspor-tarihine-gecti-uc-macta-uc-galibiyet-9-gol-2641614","other_urls":[{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/firtina-thomas-reisle-durdurulamiyor-33673396"},{"source":"sporx.com","url":"https://www.sporx.com/trabzonspor-da-thomas-reis-ile-firtina-SXHBQ1179887SXQ"}],"datetime":"2026-10-19T22:03:00+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Thomas Reis","label":"Trabzonspor - Thomas Reis","folders":[{"area":"tr","folder":"Trabzonspor - Thomas Reis"}],"img":"P7a3a7b0b","file":"AA-20261017-42785580-42785572-TRABZONSPORDA_BESIKTAS_MACININ_HAZIRLIKLARI_SURUYOR.jpg"}],"no":80,"date_text":"19 Ekim","time_text":"22:03","day_full":"19 Ekim 2026"},{"id":"07e962418b","tr":"Mohamed Salah büyük maçlarda durmuyor. Galatasaray'a da gol atan Mısırlı yıldız, Salih'in hatasıyla gelen atakta Beşiktaş ağlarını sarstı ve Trabzonspor'un derbi galibiyetini perçinledi.","en":"Mohamed Salah keeps delivering in the big games. Having already scored against Galatasaray, the Egyptian star pounced after a Salih error to seal Trabzonspor's derby win over Besiktas.","title":"Trabzonspor'un dün "},{"id":"3668d45a05","tr":"Nathan Ake, Slavia Prag karşısında evlerinde 3 puan almaları gerektiğini söyledi. Hollandalı stoper, Ederson'un performansının kendisini şaşırtmadığını ve Skriniar'la uyumlarının her maç arttığını belirtti.","en":"Nathan Ake insists Fenerbahce must take all three points at home to Slavia Prague. The Dutch centre-back says Ederson's form comes as no surprise and that his partnership with Milan Skriniar is growing by the game.","title":"Nathan Ake'den Slavia Prag maçı öncesi Ederson ve Skriniar için açıklama geldi","sources":["beinsports.com.tr","fanatik.com.tr","fotomac.com.tr","ntvspor.net","sporx.com","trtspor.com.tr"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-nathan-akeden-slavia-prag-maci-oncesi-ederson-ve-skriniar-icin-aciklama-geldi-431543","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/nathan-ake-bu-hosuma-gidiyor-fenerbahcenin-stoperinden-fikstur-ve-ederson-sozleri-2641567"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/fenerbahce/2026/10/19/nathan-akeden-basin-toplantisinda-takim-arkadaslarina-ovgu-dolu-sozler"},{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/nathan-ake-ne-yapacagimizi-biliyoruz-33667924"},{"source":"sporx.com","url":"https://www.sporx.com/nathan-ake-den-ederson-icin-itiraf-SXHBQ1179841SXQ"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/nathan-ake-zor-anlarda-taraftarlarimiz-bize-yardimci-oldu"}],"datetime":"2026-10-19T16:36:32+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"}],"players":[],"no":89,"date_text":"19 Ekim","time_text":"16:36","day_full":"19 Ekim 2026"},{"id":"d7b332ac74","tr":"Galatasaray'da 3 Eylül'den bu yana sakat olan Wilfried Singo, antrenmanın tamamında takımla çalıştı. Bu süreçte 7 maç kaçıran Fildişi Sahilli s , who faces surgery, is expected to be out for at least two and a half months.","title":"Fenerbahçe'nin eski oyuncusundan bomba iddia! 'Asensio futbolu bırakabilir'","sources":["fanatik.com.tr","fotomac.com.tr","ntvspor.net"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/galeri-fenerbahcenin-eski-oyuncusundan-bomba-iddia-asensio-futbolu-birakabilir-2641520","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-asensio-icin-cok-vahim-iddia-bizzat-yasamis-biri-olarak-soyluyorum-deyip-duyurdu-431516"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/fenerbahce/2026/10/19/fenerbahcede-marco-asensio-gelismesi-forma-giyemeyecegi-12-karsilasma-belli-oldu"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/galeri-45-gunde-kaderi-degisti-fenerbahcede-marco-asensio-bilmecesi-2641481"}],"datetime":"2026-10-19T11:10:05+03:00","time_known":true,"tags":["sakatlık","açıklama"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"Marco Asensio","label":"Fenerbahçe - Marco Asensio","folders":[{"area":"tr","folder":"Fenerbahçe - Marco Asensio"}],"img":"P4a394b92","file":"Fenerbahce_Genclerbirligi2 (13).JPG"}],"no":107,"date_text":"19 Ekim","time_text":"11:10","day_full":"19 Ekim 2026"},{"id":"e8b3e2e4b7","tr":"Türkiye Gazetesi'ne göre Beşiktaş'ın 20 yaşındaki kanat oyuncusu İlhan Fakılı, Premier Lig kulüplerinin radarında. Gözlemcilerin onu Trabzonspor ve Crystal Palace maçlarında izleyeceği belirtildi. 2,7 milyon euroya alınan Fakılı'nın değeri 7 milyon euroya çıktı.","en":"Besiktas winger Ilhan Fakili, 20, is attracting Premier League interest, according to Turkiye, with scouts set to watch him against Trabzonspor and Crystal Palace. Signed for €2.7m, he is now valued at up to €7m.","title":"Italiano \"Beni şaşırttı\" demişti, Beşiktaş'ta flaş ayrılık gündemde","sources":["ntvspor.net"],"sour const KEY='haber_paylasildi_v1';
let shared={}; try{shared=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let flt='Tümü';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const len=s=>Array.from(s).length;
const ini=n=>n.replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr');
function chipsData(){const m={};DATA.cards.forEach(c=>c.clubs.forEach(l=>{m[l.name]=(m[l.name]||new Set()).add(c.id)}));
  return Object.entries(m).map(([k,v])=>[k,v.size]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'tr'));}
function renderChips(){const cd=chipsData();
  $('#chips').innerHTML=[['Tümü',DATA.cards.length]].concat(cd).map(([k,n])=>`<button class="chip ${k===flt?'on':''}" data-k="${esc(k)}">${esc(k)} <b>${n}</b></button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flt=b.dataset.k;renderChips();renderCards();});}
function logoHtml(l,one){return l.img?`<img src="${esc(l.img)}" alt="${esc(l.name)}" title="${esc(l.name)}">`:`<div class="ph" title="${esc(l.name)} logosu arşivde yok">${esc(ini(l.name))}</div>`;}
function card(c){
  const tags=c.tags.map(t=>`<span class="tag ${t==='yurtdışı'?'ab':''}">${esc(t)}</span>`).join('');
  const pill=`<span class="pill ${c.time_text?'':'nt'}">${esc(c.date_text)}${c.time_text?' · '+esc(c.time_text):''}</span>`;
  const logos=`<div class="logos ${c.clubs.length<2?'one':''}">${c.clubs.map(l=>logoHtml(l)).join('')||'<div class="ph sq">logo yok</div>'}</div>`;
  const photos=c.players.map(p=>`<div class="ph1">${p.img?`<a href="${esc(p.img)}" target="_blank" title="Büyük aç"><img src="${esc(p.img)}" alt="${esc(p.name)}"></a>`:`<div class="phn">Fotoğraf arşivde yok</div>`}<div class="cap"><div class="n">${esc(p.label)}</div>${p.file?`<div class="f">${esc(p.file)}</div>`:''}</div></div>`).join('');
  const lg=`<div class="lg">${esc(c.clubs.map(l=>l.name).join(' – '))}<span>Kulüp logoları</span></div>`;
  const srcs=c.sources.join(', ');
  const when=c.day_full+(c.time_text?' · '+c.time_text:' · saat belirtilmemiş')+' (İstanbul)';
  const oth=c.other_urls.filter(o=>o.url!==c.url).slice(0,5).map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.source)}</a>`).join('');
  const lang=(code,txt,cls)=>`<div class="lang"><div class="lh"><span class="badge ${cls}">${code}</span></div><div class="txt">${esc(txt)}</div><div class="act"><button class="btn" data-copy="${esc(c.id)}|${code}">Metni kopyala</button><span class="cnt">${len(txt)} karakter</span></div></div>`;
  return `<article class="card ${shared[c.id]?'done':''}" id="c_${esc(c.id)}">
  <div class="hd"><span class="no">${c.no}</span>${pill}<span class="src">${esc(c.source)}</span>${tags}
   <label class="paylas"><input type="checkbox" data-id="${esc(c.id)}" ${shared[c.id]?'checked':''}> paylaşıldı</label></div>
  <div class="body"><div class="panel">${logos}<div class="photos">${photos}</div>${lg}</div>
   <div class="main"><div class="title">kaynak başlık: ${esc(c.title)}</div>${lang('TR',c.tr,'tr')}<hr class="sep">${lang('EN',c.en,'en')}</div></div>
  <div class="ft"><span>Kaynak: ${esc(srcs)} · ${esc(when)}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">kaynağı aç</a>${oth?`<span class="oth">diğer: ${oth}</span>`:''}</div>
</article>`;}
function renderCards(){
  const list=DATA.cards.filter(c=>flt==='Tümü'||c.clubs.some(l=>l.name===flt));
  $('#grid').innerHTML=list.map(card).join('');
  document.querySelectorAll('input[data-id]').forEach(i=>i.onchange=()=>{const id=i.dataset.id;if(i.checked)shared[id]=1;else delete shared[id];
    try{localStorage.setItem(KEY,JSON.stringify(shared))}catch(e){}
    document.getElementById('c_'+id).classList.toggle('done',i.checked);info();});
  document.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>{const [id,code]=b.dataset.copy.split('|');const c=DATA.cards.find(x=>x.id===id);copyText(code==='TR'?c.tr:c.en,b);});
  info();}
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='Kopyalandı ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Metni kopyala';btn.classList.remove('ok')},1400)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);done()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb();}
function info(){const n=Object.keys(shared).filter(id=>DATA.cards.some(c=>c.id===id)).length;
  const vis=document.querySelectorAll('.card').length;
  $('#info').innerHTML=`<span>Kulüp çipine tıklayınca yalnızca o kulübün haberleri görünür. Logo ve fotoğraflar yalnızca kendi arşivinden (2026-27 FOTO) alınır; oyuncu fotoğrafı klasöründeki en yeni tarihli görseldir, dosya adı kartın üzerinde yazar.</span><span><b>${vis}</b> kart gösteriliyor · <b>${n}</b> / ${DATA.cards.length} paylaşıldı</span>`;}
