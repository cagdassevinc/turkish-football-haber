.btn.ok{background:#0b5a2f}
.cnt{color:#97a2af;font-size:12.5px}
.sep{border:0;border-top:1px dashed #dde5ec;margin:0}

lary with more performance-related bonuses.","title":"Inter'de Hakan Çalhanoğlu için yeni sözleşme planı: Maaş indirimi gündemde","sources":["sporx.com","transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/interde-hakan-calhanoglu-icin-yeni-sozlesme-plani-maas-indirimi-gundemde/view/news/489395","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/inter-in-hakan-calhanoglu-plani-SXHBQ1180327SXQ"}],"datetime":"2026-10-23T12:29:47+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Inter","logo":"Logolar\\Yabancı Ligler\\Serie A\\Inter.png","img":"L5e480711","file":"Inter.png"}],"players":[{"name":"Hakan Çalhanoğlu","label":"Inter Milan - Hakan Çalhanoğlu","folders":[{"area":"yab","folder":"Inter Milan - Hakan Çalhanoğlu"}],"img":"Pc57d7c7a","file":"InterTakim11.jpg"}],"no":19,"date_text":"23 Ekim","time_text":"12:29","day_full":"23 Ekim 2026"},{"id":"c593681346","tr":"Göztepe'nin Al Jazira'dan satın alma opsiyonuyla kiraladığı 22 yaşındaki Richard Akonnor, takımın tek sol beki olarak vazgeçilmez oldu. BAE milli oyuncusu 7 maçta 520 dakika süre aldı.","en":"Richard Akonnor, on loan at Goztepe from Al Jazira with an option to buy, has become indispensable as the club's only left-back. The 22-year-old UAE international has played 520 minutes across seven matches.","title":"Göztepe'de Akonnor sevinci","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/goztepe/goztepede-akonnor-sevinci-2642079","other_urls":[],"datetime":"2026-10-23T12:27:25+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Göztepe","logo":"Logolar\\Süper Lig\\Goztepe.png","img":"Le49c02f8","file":"Logolar\\Süper Lig\\Goztepe.png"}],"players":[{"name":"Richard Akonnor","label":"Göztepe - Richard Akonnor","folders":[{"area":"tr","folder":"Göztepe - Richard Akonnor"}],"img":"Pc48f279b","file":"AA-20261018-42794448-42794442-KOCAELISPOR_GOZTEPE.jpg"}],"no":20,"date_text":"23 Ekim","time_text":"12:27" year-old Serbian right-back, signed for 6.7 million euros, has yet to play a minute this season and the club are waiting for offers.","title":"Fenerbahçe'de henüz 1 dakikası bile yok! Büyük umutlarla gelmişti bileti kesildi","sources":["fanatik.com.tr","ntvspor.net","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/galeri-fenerbahcede-henuz-1-dakikasi-bile-yok-buyuk-umutlarla-gelmisti-bileti-kesildi-2642058","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-gun-yuzu-goremeden-ayriliyor-ve-fenerbahcede-bileti-kesilen-ilk-futbolcu-artik-netlesti-431772"},{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-den-dakika-alamadan-ayriliyor-SXHBQ1180289SXQ"}],"datetime":"2026-10-23T10:07:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[],"no":32,"date_text":"23 Ekim","time_text":"10:07","day_full":"23 Ekim 2026"},{"id":"636d5222f7","tr":"Galatasaray'da sakatlığı nedeniyle Lille maçında forma giyemeyen Rafael Leao, Fenerbahçe derbisinde süre almak istiyor.","en":"Rafael Leao, who missed Galatasaray's win at Lille through injury, is keen to get minutes in Monday's derby with Fenerbahce.","title":"Rafael Leao'nun gözü derbide - Galatasaray son dakika haberleri","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/rafael-leao-nun-gozu-derbide-SXHBQ1180301SXQ","other_urls":[],"datetime":"2026-10-23T09:49:26+03:00","time_known":true,"tags":["sakatlık"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"Rafael Leao","label":"Galatasaray - Rafael Leao","folders":[{"area":"tr","folder":"Galatasaray - Rafael Lea .png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Romelu Lukaku","label":"Fenerbahçe - Romelu Lukaku","folders":[{"area":"tr","folder":"Fenerbahçe - Romelu Lukaku"}],"img":"Pe17eef04","file":"AA-20261020-42814160-42814156-FENERBAHCE_SLAVIA_PRAG.jpg"},{"name":"İsmail Kartal","label":"Fenerbahçe - İsmail Kartal","folders":[{"area":"tr","folder":"Fenerbahçe - İsmail Kartal"}],"img":"P627f4382","file":"AA-20261020-42813305-42813304-FENERBAHCE_SLAVIA_PRAG.jpg"}],"no":42,"date_text":"23 Ekim","time_text":"06:59","day_full":"23 Ekim 2026"},{"id":"3ee686ce0c","tr":"Beşiktaş'ın ara transferde Nicolas Raskin için Rangers ile anlaşmaya yaklaştığı iddia edildi. Siyah-beyazlıların 25 yaşındaki Belçikalı orta saha için bonuslar hariç yaklaşık 17 milyon euro ödeyeceği, oyuncuyla yıllık 5 milyon euroda el sıkışıldığı öne sürüldü.","en":"Besiktas are reportedly closing in on a January deal with Rangers for Nicolas Raskin. The fee for the 25-year-old Belgian midfielder is said to be around 17 million euros plus bonuses, with personal terms of 5 million euros a year agreed.","title":"Beşiktaş'tan Nicolas Raskin bombası! Ödenecek bonservis belli oldu","sources":["fanatik.com.tr","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/besiktas/besiktastan-nicolas-raskin-bombasi-odenecek-bonservis-belli-oldu-2642039","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/besiktas-raskin-transferini-kafaya-koydu-bonservisi-belli-oldu-SXHBQ1180318SXQ"}],"datetime":"2026-10-23T06:59:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"}],"players":[],"no":43,"date_text":"23 Ekim","time_text":"06:59","day_full":"23 Ekim 2026"},{"id":"dbb8540df4","tr":"Beşiktaş'ta Crystal Palace as means.'","title":"Junior Olaitan: 'Beşiktaş'ın ne demek olduğunu gösterdik!'","sources":["sporx.com","trtspor.com.tr"],"source":"sporx.com","url":"https://www.sporx.com/junior-olaitan-besiktas-in-ne-demek-oldugunu-gosterdik-SXHBQ1180274SXQ","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/olaitan-tan-avrupa-da-6-gole-katki-SXHBQ1180272SXQ"},{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/ndidi-ve-olaitan-trt-spora-konustu-33725075"},{"source":"sporx.com","url":"https://www.sporx.com/ndidi-den-gol-sevinci-itirafi-bravo-diyordum-kendime-SXHBQ1180273SXQ"}],"datetime":"2026-10-23T00:17:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Crystal Palace","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png","img":"Lc78fce2a","file":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png"},{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"}],"players":[{"name":"Junior Olaitan","label":"Beşiktaş - Junior Olaitan","folders":[{"area":"tr","folder":"Beşiktaş - Junior Olaitan"}],"img":"P26ff47e7","file":"AA-20261022-42838365-42838353-BESIKTAS_CRYSTAL_PALACE.jpg"}],"no":46,"date_text":"23 Ekim","time_text":"00:17","day_full":"23 Ekim 2026"},{"id":"df40bc3e42","tr":"Vincenzo Italiano, 10 kişi kalmalarına rağmen 'çok önemli 1 puan' aldıklarını ve Avrupa'da hâlâ namağlup olduklarını söyledi. İtalyan hoca, omzundan sakatlanan Fabio Miretti'nin birkaç hafta yok olabileceğini ve Başakşehir maçında oynamayacağını açıkladı.","en":"Vincenzo Italiano hailed 'a very important point' despite Besiktas finishing with ten men, stressing they remain unbeaten in Europe. He also confirmed that Fabio Miretti, who hurt his shoulder, could be out for a few weeks and will miss the Basaksehir game.","title":"Vincenzo Italiano: Çok önemli 1 puan aldık","sources":["beinsports.com.tr","fanatik.com.tr","mackolik.com","ntvspor.net","sporx.com","trtspor.com.tr"],"source ially confirmed Sergen Yalcin's eight-man backroom staff. Serhat Mert will act as coordinator and Murat Kaytaz as assistant coach, with Niyazi Eniseler and Emre Gurbuz in charge of athletic performance and Erol Aycicek as goalkeeping coach.","title":"Sergen Yalçın'ın teknik ekibi belli oldu - A Millî Takım'da 8 isim görev yapacak","sources":["fotomac.com.tr","ntvspor.net","sporx.com","transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/sergen-yalcinin-teknik-ekibi-belli-oldu-a-milli-takimda-8-isim-gorev-yapacak/view/news/489365","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-son-dakika-a-milli-takimda-yeni-donem-sergen-yalcinin-teknik-ekibi-resmen-aciklandi-431735"},{"source":"sporx.com","url":"https://www.sporx.com/sergen-yalcin-in-milli-takim-daki-teknik-ekibi-belli-oldu-SXHBQ1180209SXQ"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/millitakim/2026/10/22/sergen-yalcinin-teknik-ekibi-aciklandi"}],"datetime":"2026-10-22T16:21:14+03:00","time_known":true,"tags":["açıklama"],"clubs":[],"players":[{"name":"Sergen Yalçın","label":"Sergen Yalçın (A Milli Takım)","folders":[{"area":"milli","folder":"Sergen Yalçın"}],"img":"Pff88c198","file":"AA-20261022-42832181-42832157-TFF_TEKNIK_DIREKTOR_SERGEN_YALCIN_ILE_4_YILLIK_SOZLESME_IMZALADI.jpg"},{"name":"Servet Yardımcı","label":"Servet Yardımcı (A Milli Takım)","folders":[{"area":"milli","folder":"Servet Yardımcı"}],"img":"Pa189078a","file":"AA-20261021-42826069-42826065-REAL_MADRID_RB_LEIPZIG.jpg"}],"no":61,"date_text":"22 Ekim","time_text":"16:21","day_full":"22 Ekim 2026"},{"id":"2fcc753107","tr":"Trabzonspor Başkanı Ertuğrul Doğan, devre arasında Thomas Reis'ten gelecek her transfer talebini değerlendireceklerini söyledi. 'Bizi zirveye taşıyacak isimler kimse onları alacağız; ama kulüplerin de oyuncuyu vermesi lazım, devre arası transfer kolay değil' dedi.","en":"Trabzonspor president Ertugrul Dogan says the club will consider e ","label":"Fenerbahçe - Matteo Guendouzi","folders":[{"area":"tr","folder":"Fenerbahçe - Matteo Guendouzi"}],"img":"Pb079d269","file":"AA-20261020-42813397-42813393-FENERBAHCE_SLAVIA_PRAG.jpg"},{"name":"Nelson Semedo","label":"Fenerbahçe - Nelson Semedo","folders":[{"area":"tr","folder":"Fenerbahçe - Nelson Semedo"}],"img":"P585198db","file":"fenerbahce_12.jpg"}],"no":71,"date_text":"22 Ekim","time_text":"11:43","day_full":"22 Ekim 2026"},{"id":"f079aedb22","tr":"Shakhtar Donetsk'in Inter'e 1-0 yenildiği maçın ardından konuşan Arda Turan, El Clasico'da Barcelona'yı desteklediğini söyledi. 'Arda Güler benim kardeşim ama ben Barcelona tarafındayım. O Fenerbahçe'de oynadı, ben Galatasaray'da' dedi.","en":"Arda Turan admitted he will be rooting for Barcelona in Sunday's Clasico after his Shakhtar Donetsk side lost 1-0 at Inter. 'Arda Guler is my brother, but I'm on Barcelona's side. It's the same as him playing for Fenerbahce and me for Galatasaray,' he said.","title":"Arda Turan, Arda Güler'i tenzih ederek açıkladı: Galatasaray-Fenerbahçe örneği verdi","sources":["fanatik.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-arda-turan-arda-guleri-tenzih-ederek-acikladi-galatasaray-fenerbahce-ornegi-verdi-431719","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/arda-turan-arda-guler-kardesim-ama-barcelona-tarafindayim-SXHBQ1180180SXQ"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/galeri-arda-turandan-arda-guler-sozleri-o-fenerbahceli-ben-galatasarayliyim-2641935"}],"datetime":"2026-10-22T11:04:20+03:00","time_known":true,"tags":["açıklama","yurtdışı"],"clubs":[{"name":"Shakhtar Donetsk","logo":"Logolar\\Şampiyonlar Ligi\\Shakhtar_Donetsk.png","img":"Ldd3c9cdf","file":"Logolar\\Şampiyonlar Ligi\\Shakhtar_Donetsk.png"},{"name":"Inter","logo":"Logolar\\Yabancı Ligler\\Serie A\\Inter.png","img":"L5e480711","file":"Inter.png"}],"players":[{"name":"Arda Turan","label":"Shakhtar Donetsk - Arda Turan","folders":[{"area":"yab","folder":"Shakhtar Donetsk - Arda Turan"}],"img":"P2a94822f","file":"AA-20261014-42757371-42757369-SHAKHTAR_DONETSK_AEK_ATHENS.jpg"},{"name":"Arda Güler","label":"Arda Güler","folders":[{"area":"tr","folder":"Türk Futbolcular - Arda Güler"}],"img":"P6a6390a8","file":"AA-20260826-42314766-42314753-REAL_MADRID_REAL_SOCIEDAD.jpg"}],"no":72,"date_text":"22 Ekim","time_text":"11:04","day_full":"22 Ekim 2026"},{"id":"ac5b6fbf57","tr":"Transfermarkt verilerine göre Trabzonspor'un 184,3 milyon euroluk kadro değeri, 25,4 milyon euro değerindeki Hearts'ın yaklaşık 7 katı. İskoçya'da üçüncü sıradaki Hearts, son lig maçında Celtic'e 7-1 yenilmişti.","en":"Trabzonspor's squad is worth around seven times that of tonight's visitors Hearts, according to Transfermarkt: 184.3 million euros against 25.4 million. The Scottish side sit third in the Premiership but were thrashed 7-1 by Celtic in their last league outing.","title":"Trabzonspor'un kadrosu rakibinden 7 kat daha değerli - Hearts maçının öne çıkanları","sources":["transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/trabzonsporun-kadrosu-rakibinden-7-kat-daha-degerli-hearts-macinin-one-cikanlari/view/news/489333","other_urls":[],"datetime":"2026-10-22T10:25:45+03:00","time_known":true,"tags":["kadro"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Hearts","logo":"Logolar\\Konferans Ligi\\Hearts.png","img":"Ld5e89687","file":"Hearts.png"}],"players":[],"no":73,"date_text":"22 Ekim","time_text":"10:25","day_full":"22 Ekim 2026"},{"id":"ae357e3220","tr":"Gaziantep FK, olağanüstü seçimli genel kurulunu 5 Kasım'da yapma kararı aldı. Çoğunluk sağlanamazsa toplantı 12 Kasım'da çoğunluk aranmaksızın Gaziantep Büyükşehir Stadyumu'nda yapılacak.","en":"Gaziantep FK have called an extraordinary elective general assembly for 5 November. Should it not reac :"Orkun Kökçü","label":"Beşiktaş - Orkun Kökçü","folders":[{"area":"tr","folder":"Beşiktaş - Orkun Kökçü"}],"img":"P5523583a","file":"AA-20261015-42769458-42769454-HOFFENHEIM_BESIKTAS.jpg"}],"no":81,"date_text":"22 Ekim","time_text":"06:59","day_full":"22 Ekim 2026"},{"id":"3cfc8509b3","tr":"Trabzonspor bu akşam 19.45'te Hearts karşısında Avrupa'daki 159. maçına çıkıyor. Fotomaç'a göre Thomas Reis, Beşiktaş derbisinin ardından ilk 11'de en az 5 değişiklik yapacak; bordo-mavililer 29 yıl sonra ilk kez bir İskoç takımıyla karşılaşacak.","en":"Trabzonspor play their 159th European fixture against Hearts tonight, kick-off 19:45. Thomas Reis is expected to make at least five changes after the Besiktas win, according to Fotomac, in the club's first meeting with Scottish opposition for 29 years.","title":"Thomas Reis kararını verdi! İşte Trabzonspor’un Hearts maçı muhtemel 11’i","sources":["fotomac.com.tr"],"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/trabzonspor/2026/10/22/trabzonspor-yoluna-kayipsiz-devam-etmek-istiyor-iste-thomas-reisin-hearts-maci-muhtemel-11i","other_urls":[],"datetime":"2026-10-22T06:50:15+03:00","time_known":true,"tags":["kadro"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Hearts","logo":"Logolar\\Konferans Ligi\\Hearts.png","img":"Ld5e89687","file":"Hearts.png"}],"players":[{"name":"Thomas Reis","label":"Trabzonspor - Thomas Reis","folders":[{"area":"tr","folder":"Trabzonspor - Thomas Reis"}],"img":"P7a3a7b0b","file":"AA-20261021-42821187-42821167-TRABZONSPOR_HEARTS_MACINA_DOGRU.jpg"}],"no":82,"date_text":"22 Ekim","time_text":"06:50","day_full":"22 Ekim 2026"},{"id":"108d0315e5","tr":"Fotomaç'a göre Vincenzo Italiano, bu akşam 22.00'deki Crystal Palace maçında forvette Vlahovic yerine Oh Hyeon-gyu'yu tercih edecek. Beşiktaş'ta Orkun Kökçü'nün yanı sıra Milot Rashica da forma giyemeyecek.","en":"Vincenzo Italiano is set to pick Oh const KEY='haber_paylasildi_v1';
let shared={}; try{shared=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let flt='Tümü';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const len=s=>Array.from(s).length;
const ini=n=>n.replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr');
function chipsData(){const m={};DATA.cards.forEach(c=>c.clubs.forEach(l=>{m[l.name]=(m[l.name]||new Set()).add(c.id)}));
  return Object.entries(m).map(([k,v])=>[k,v.size]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'tr'));}
function renderChips(){const cd=chipsData();
  $('#chips').innerHTML=[['Tümü',DATA.cards.length]].concat(cd).map(([k,n])=>`<button class="chip ${k===flt?'on':''}" data-k="${esc(k)}">${esc(k)} <b>${n}</b></button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flt=b.dataset.k;renderChips();renderCards();});}
function logoHtml(l,one){return l.img?`<img src="${esc(l.img)}" alt="${esc(l.name)}" title="${esc(l.name)}">`:`<div class="ph" title="${esc(l.name)} logosu arşivde yok">${esc(ini(l.name))}</div>`;}
function card(c){
  const tags=c.tags.map(t=>`<span class="tag ${t==='yurtdışı'?'ab':''}">${esc(t)}</span>`).join('');
  const pill=`<span class="pill ${c.time_text?'':'nt'}">${esc(c.date_text)}${c.time_text?' · '+esc(c.time_text):''}</span>`;
  const logos=`<div class="logos ${c.clubs.length<2?'one':''}">${c.clubs.map(l=>logoHtml(l)).join('')||'<div class="ph sq">logo yok</div>'}</div>`;
  const photos=c.players.map(p=>`<div class="ph1">${p.img?`<a href="${esc(p.img)}" target="_blank" title="Büyük aç"><img src="${esc(p.img)}" alt="${esc(p.name)}"></a>`:`<div class="phn">Fotoğraf arşivde yok</div>`}<div class="cap"><div class="n">${esc(p.label)}</div>${p.file?`<div class="f">${esc(p.file)}</div>`:''}</div></div>`).join('');
  const lg=`<div class="lg">${esc(c.clubs.map(l=>l.name).join(' – '))}<span>Kulüp logoları</span></div>`;
  const srcs=c.sources.join(', ');
  const when=c.day_full+(c.time_text?' · '+c.time_text:' · saat belirtilmemiş')+' (İstanbul)';
  const oth=c.other_urls.filter(o=>o.url!==c.url).slice(0,5).map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.source)}</a>`).join('');
  const lang=(code,txt,cls)=>`<div class="lang"><div class="lh"><span class="badge ${cls}">${code}</span></div><div class="txt">${esc(txt)}</div><div class="act"><button class="btn" data-copy="${esc(c.id)}|${code}">Metni kopyala</button><span class="cnt">${len(txt)} karakter</span></div></div>`;
  return `<article class="card ${shared[c.id]?'done':''}" id="c_${esc(c.id)}">
  <div class="hd"><span class="no">${c.no}</span>${pill}<span class="src">${esc(c.source)}</span>${tags}
   <label class="paylas"><input type="checkbox" data-id="${esc(c.id)}" ${shared[c.id]?'checked':''}> paylaşıldı</label></div>
  <div class="body"><div class="panel">${logos}<div class="photos">${photos}</div>${lg}</div>
   <div class="main"><div class="title">kaynak başlık: ${esc(c.title)}</div>${lang('TR',c.tr,'tr')}<hr class="sep">${lang('EN',c.en,'en')}</div></div>
  <div class="ft"><span>Kaynak: ${esc(srcs)} · ${esc(when)}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">kaynağı aç</a>${oth?`<span class="oth">diğer: ${oth}</span>`:''}</div>
</article>`;}
function renderCards(){
  const list=DATA.cards.filter(c=>flt==='Tümü'||c.clubs.some(l=>l.name===flt));
  $('#grid').innerHTML=list.map(card).join('');
  document.querySelectorAll('input[data-id]').forEach(i=>i.onchange=()=>{const id=i.dataset.id;if(i.checked)shared[id]=1;else delete shared[id];
    try{localStorage.setItem(KEY,JSON.stringify(shared))}catch(e){}
    document.getElementById('c_'+id).classList.toggle('done',i.checked);info();});
  document.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>{const [id,code]=b.dataset.copy.split('|');const c=DATA.cards.find(x=>x.id===id);copyText(code==='TR'?c.tr:c.en,b);});
  info();}
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='Kopyalandı ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Metni kopyala';btn.classList.remove('ok')},1400)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);done()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb();}
function info(){const n=Object.keys(shared).filter(id=>DATA.cards.some(c=>c.id===id)).length;
  const vis=document.querySelectorAll('.card').length;
