<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futbol Haber Akışı</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--line:#cfe6d8;--green:#137a43;--greenbg:#e3f4ea;--greentx:#1c7a46;--red:#8e1b2e;--blue:#1b3a63;--mut:#7b8794;--ink:#1d2733}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px}
.wrap{max-width:1840px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:4px 2px 12px}
.top h1{font-size:20px;margin:0;font-weight:700}
.top .upd{color:#46566a;font-size:13.5px}
.top .upd b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:1px solid #cfd6de;background:#fff;color:#2c3a4b;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;line-height:1.2;font-family:inherit}
.chip b{font-weight:600;color:#7a8696;margin-left:5px}
.chip:hover{border-color:#9aa7b6}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on b{color:#f1d3d9}
.info{background:#eef3fb;border:1px solid #d3deef;color:#46566a;border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media(max-width:1250px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.done{opacity:.6;background:#f6faf7}
.hd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:9px 12px;border-bottom:1px solid #e3efe7}
.no{color:#8795a5;font-size:13px;min-width:18px}
.pill{background:var(--greenbg);color:var(--greentx);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.nt{background:#eef0f3;color:#667385}
.src{font-weight:700;font-size:13.5px}
.tag{background:#e2ecfb;color:#1f4f9c;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.tag.ab{background:#efe5fb;color:#5b2e9a}
.paylas{margin-left:auto;display:flex;align-items:center;gap:6px;color:#55657a;font-size:13px;cursor:pointer;user-select:none}
.paylas input{width:16px;height:16px;accent-color:var(--green)}
.body{display:flex;gap:0}
.panel{flex:0 0 150px;background:#f6f8fa;border-right:1px solid #e4eaf0;padding:10px;display:flex;flex-direction:column;gap:9px}
.logos{background:#fff;border:1px solid #e1e7ee;border-radius:8px;padding:8px;display:flex;justify-content:center;align-items:center;gap:8px;min-height:62px}
.logos img,.logos .ph{width:50px;height:50px;object-fit:contain}
.logos.one img,.logos.one .ph{width:62px;height:62px}
.ph{background:#e9edf2;color:#5d6b7c;border:1px dashed #b9c4d0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-align:center;line-height:1}
.ph.sq{border-radius:6px;font-size:11px}
.photos{display:flex;flex-direction:column;gap:8px}
.ph1{background:#fff;border:1px solid #e1e7ee;border-radius:8px;overflow:hidden}
.ph1 a{display:block}
.ph1 img{display:block;width:100%;height:112px;object-fit:cover;object-position:50% 25%;background:#dfe5ec}
.ph1 .phn{height:112px;border-radius:0;border:0;border-bottom:1px dashed #b9c4d0;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:#8895a5;font-size:11.5px;text-align:center;padding:6px}
.cap{padding:5px 7px 6px}
.cap .n{color:#4b2fa3;font-weight:700;font-size:12px;line-height:1.25}
.cap .f{font-family:Consolas,"Courier New",monospace;font-size:10.5px;color:#4d5967;background:#f1f4f7;border:1px solid #e1e6ec;border-radius:5px;padding:2px 5px;margin-top:4px;word-break:break-all}
.lg{font-size:11.5px;color:#4b2fa3;font-weight:700;text-align:center;line-height:1.3}
.lg span{display:block;color:#98a3b0;font-weight:400}
.main{flex:1;min-width:0;padding:10px 12px 8px;display:flex;flex-direction:column;gap:10px}
.title{color:#1c7a46;font-size:12.5px;font-weight:600;line-height:1.35}
.lang .lh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;color:#fff;background:#b3261e}
.badge.en{background:#1d4e89}
.txt{font-family:Consolas,"Courier New",ui-monospace,monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;color:#1f2933}
.act{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn{background:var(--green);color:#fff;border:0;border-radius:7px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:#0e6637}
.btn.ok{background:#0b5a2f}
.cnt{color:#97a2af;font-size:12.5px}
.sep{border:0;border-top:1px dashed #dde5ec;margin:0}
.ft{border-top:1px solid #e3efe7;background:#fafcfb;padding:8px 12px;font-size:12.5px;color:#55657a;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.ft a{color:#1b4f9c;text-decoration:underline;font-weight:600}
.ft .oth a{font-weight:400;color:#6a7a8c;margin-left:6px}
.foot{margin-top:22px;color:#8795a5;font-size:12px;text-align:center}
@media(max-width:560px){.body{flex-direction:column}.panel{flex:none;border-right:0;border-bottom:1px solid #e4eaf0}.photos{flex-direction:row}.ph1{flex:1}}
</style>
</head>

tas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"}],"players":[{"name":"Ozan Tufan","label":"Trabzonspor - Ozan Tufan","folders":[{"area":"tr","folder":"Trabzonspor - Ozan Tufan"}],"img":"Pc841853d","file":"AA-20261017-42785580-42785578-TRABZONSPORDA_BESIKTAS_MACININ_HAZIRLIKLARI_SURUYOR.jpg"}],"no":4,"date_text":"19 Ekim","time_text":"22:26","day_full":"19 Ekim 2026"},{"id":"11494dba6f","tr":"Fabinho, derbinin oyuncusu olarak ilk golde büyük payı olan Ernest Muçi'yi seçti. Stefan Savic ise 'Bu takım doğru yolda, seviyemiz çok daha yüksek' diyerek gol yemeden kazanmanın önemine dikkat çekti.","en":"Fabinho named Ernest Muci as his man of the match, crediting him with a big part in the opener. Stefan Savic added: 'This team is on the right path. Our level is much higher than this,' after another clean sheet.","title":"Trabzonspor’da Fabinho derbideki maçın oyuncusunu açıkladı!","sources":["fotomac.com.tr","ntvspor.net","sporx.com"],"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/trabzonspor/2026/10/19/trabzonsporda-fabinho-derbideki-macin-oyuncusunu-acikladi","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/fabinho-macin-yildizi-muci-SXHBQ1179889SXQ"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-trabzonsporda-3-puan-sevinci-kazanacagimizi-biliyorduk-431559"},{"source":"sporx.com","url":"https://www.sporx.com/stefan-savic-bu-takimin-seviyesi-cok-daha-yuksek-SXHBQ1179891SXQ"}],"datetime":"2026-10-19T22:18:39+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"}],"players":[{"name":"Fabinho","label":"Trabzonspor - Fabinho","folders":[{"area":"tr","folder":"Trabzonspor - Fabinho"}],"img":"P3f5f9fe8","file":"AA-20261017-42785580-42785579-TRABZONSPORDA_BESIK 48","tr":"Trabzonspor, Papara Park'taki derbide Beşiktaş'ı 2-0 yendi. Golleri ilk yarıda Ozan Tufan, ikinci yarıda Mohamed Salah attı; bordo-mavililer puanını 16'ya çıkarırken Beşiktaş 15 puanda kaldı.","en":"Trabzonspor beat Besiktas 2-0 in the derby at Papara Park. Ozan Tufan struck in the first half and Mohamed Salah added a second after the break, taking Trabzonspor to 16 points, one clear of Besiktas.","title":"Trabzonspor, Beşiktaş'ı 2 golle geçti: Salah yine attı","sources":["fanatik.com.tr","fotomac.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-trabzonspor-besiktas-canli-anlatim-431551","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/trabzonspor/live-ozet-trabzonspor-seriye-bagladi-derbide-besiktasi-devirdi-trabzonspor-besiktas-mac-sonucu-2-0-2641484"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/trabzonspor/live-trabzonspor-besiktas-maci-canli-anlatim-ts-bjk-maci-kadrolari-skoru-ve-istatistikleri-super-lig-8-hafta-maci-2641484"},{"source":"sporx.com","url":"https://www.sporx.com/salah-i-olan-kazanir-trabzonspor-istedigini-aldi-SXHBQ1179876SXQ"},{"source":"sporx.com","url":"https://www.sporx.com/trabzonspor-da-penalti-itirazi-SXHBQ1179882SXQ"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/trabzonspor/2026/10/19/trabzonspor-penalti-bekledi-cihan-aydin-devam-ettirdi"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/trabzonspor/2026/10/19/andre-onana-kalede-devlesti"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/trabzonspor/galeri-trabzonspor-besiktas-macinda-nefes-kesen-anlar-1-dakikada-iki-inanilmaz-pozisyon-2641609"}],"datetime":"2026-10-19T19:00:24+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file" const KEY='haber_paylasildi_v1';
let shared={}; try{shared=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let flt='Tümü';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const len=s=>Array.from(s).length;
const ini=n=>n.replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr');
function chipsData(){const m={};DATA.cards.forEach(c=>c.clubs.forEach(l=>{m[l.name]=(m[l.name]||new Set()).add(c.id)}));
  return Object.entries(m).map(([k,v])=>[k,v.size]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'tr'));}
function renderChips(){const cd=chipsData();
  $('#chips').innerHTML=[['Tümü',DATA.cards.length]].concat(cd).map(([k,n])=>`<button class="chip ${k===flt?'on':''}" data-k="${esc(k)}">${esc(k)} <b>${n}</b></button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flt=b.dataset.k;renderChips();renderCards();});}
function logoHtml(l,one){return l.img?`<img src="${esc(l.img)}" alt="${esc(l.name)}" title="${esc(l.name)}">`:`<div class="ph" title="${esc(l.name)} logosu arşivde yok">${esc(ini(l.name))}</div>`;}
function card(c){
  const tags=c.tags.map(t=>`<span class="tag ${t==='yurtdışı'?'ab':''}">${esc(t)}</span>`).join('');
  const pill=`<span class="pill ${c.time_text?'':'nt'}">${esc(c.date_text)}${c.time_text?' · '+esc(c.time_text):''}</span>`;
  const logos=`<div class="logos ${c.clubs.length<2?'one':''}">${c.clubs.map(l=>logoHtml(l)).join('')||'<div class="ph sq">logo yok</div>'}</div>`;
  const photos=c.players.map(p=>`<div class="ph1">${p.img?`<a href="${esc(p.img)}" target="_blank" title="Büyük aç"><img src="${esc(p.img)}" alt="${esc(p.name)}"></a>`:`<div class="phn">Fotoğraf arşivde yok</div>`}<div class="cap"><div class="n">${esc(p.label)}</div>${p.file?`<div class="f">${esc(p.file)}</div>`:''}</div></div>`).join('');
  const lg=`<div class="lg">${esc(c.clubs.map(l=>l.name).join(' – '))}<span>Kulüp logoları</span></div>`;
  const srcs=c.sources.join(', ');
  const when=c.day_full+(c.time_text?' · '+c.time_text:' · saat belirtilmemiş')+' (İstanbul)';
  const oth=c.other_urls.filter(o=>o.url!==c.url).slice(0,5).map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.source)}</a>`).join('');
  const lang=(code,txt,cls)=>`<div class="lang"><div class="lh"><span class="badge ${cls}">${code}</span></div><div class="txt">${esc(txt)}</div><div class="act"><button class="btn" data-copy="${esc(c.id)}|${code}">Metni kopyala</button><span class="cnt">${len(txt)} karakter</span></div></div>`;
  return `<article class="card ${shared[c.id]?'done':''}" id="c_${esc(c.id)}">
  <div class="hd"><span class="no">${c.no}</span>${pill}<span class="src">${esc(c.source)}</span>${tags}
   <label class="paylas"><input type="checkbox" data-id="${esc(c.id)}" ${shared[c.id]?'checked':''}> paylaşıldı</label></div>
  <div class="body"><div class="panel">${logos}<div class="photos">${photos}</div>${lg}</div>
   <div class="main"><div class="title">kaynak başlık: ${esc(c.title)}</div>${lang('TR',c.tr,'tr')}<hr class="sep">${lang('EN',c.en,'en')}</div></div>
  <div class="ft"><span>Kaynak: ${esc(srcs)} · ${esc(when)}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">kaynağı aç</a>${oth?`<span class="oth">diğer: ${oth}</span>`:''}</div>
</article>`;}
function renderCards(){
  const list=DATA.cards.filter(c=>flt==='Tümü'||c.clubs.some(l=>l.name===flt));
  $('#grid').innerHTML=list.map(card).join('');
  document.querySelectorAll('input[data-id]').forEach(i=>i.onchange=()=>{const id=i.dataset.id;if(i.checked)shared[id]=1;else delete shared[id];
    try{localStorage.setItem(KEY,JSON.stringify(shared))}catch(e){}
    document.getElementById('c_'+id).classList.toggle('done',i.checked);info();});
  document.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>{const [id,code]=b.dataset.copy.split('|');const c=DATA.cards.find(x=>x.id===id);copyText(code==='TR'?c.tr:c.en,b);});
  info();}
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='Kopyalandı ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Metni kopyala';btn.classList.remove('ok')},1400)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);done()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb();}
function info(){const n=Object.keys(shared).filter(id=>DATA.cards.some(c=>c.id===id)).length;
  const vis=document.querySelectorAll('.card').length;
  $('#info').innerHTML=`<span>Kulüp çipine tıklayınca yalnızca o kulübün haberleri görünür. Logo ve fotoğraflar yalnızca kendi arşivinden (2026-27 FOTO) alınır; oyuncu fotoğrafı klasöründeki en yeni tarihli görseldir, dosya adı kartın üzerinde yazar.</span><span><b>${vis}</b> kart gösteriliyor · <b>${n}</b> / ${DATA.cards.length} paylaşıldı</span>`;}
$('#upd').textContent=DATA.last_update_text; $('#nday').textContent=DATA.news_day_text;
$('#foot').textContent='Sayfa üretildi: '+DATA.page_generated+' · '+DATA.cards.length+' kart · Web sürümü: her taramadan sonra otomatik güncellenir (bilgisayar gerekmez). Görseller yalnızca kendi arşivinden.';
renderChips(); renderCards();
</script>
