<style>
:root{--bg:#f3f5f7;--card:#fff;--line:#cfe6d8;--green:#137a43;--greenbg:#e3f4ea;--greentx:#1c7a46;--red:#8e1b2e;--blue:#1b3a63;--mut:#7b8794;--ink:#1d2733}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px}
.wrap{max-width:1840px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:4px 2px 12px}
.top h1{font-size:20px;margin:0;font-weight:700}
.top .upd{color:#46566a;font-size:13.5px}
.top .upd b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:1px solid #cfd6de;background:#fff;color:#2c3a4b;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;line-height:1.2;font-family:inherit}
.chip b{font-weight:600;color:#7a8696;margin-left:5px}

.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on b{color:#f1d3d9}
.info{background:#eef3fb;border:1px solid #d3deef;color:#46566a;border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media(max-width:1250px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.done{opacity:.6;background:#f6faf7}
.hd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:9px 12px;border-bottom:1px solid #e3efe7}
.no{color:#8795a5;font-size:13px;min-width:18px}
.pill{background:var(--greenbg);color:var(--greentx);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.nt{background:#eef0f3;color:#667385}
.src{font-weight:700;font-size:13.5px}
.tag{background:#e2ecfb;color:#1f4f9c;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.tag.ab{background:#efe5fb;color:#5b2e9a}

.paylas input{width:16px;height:16px;accent-color:var(--green)}
.body{display:flex;gap:0}
.panel{flex:0 0 150px;background:#f6f8fa;border-right:1px solid #e4eaf0;padding:10px;display:flex;flex-direction:column;gap:9px}

.logos img,.logos .ph{width:50px;height:50px;object-fit:contain}
.logos.one img,.logos.one .ph{width:62px;height:62px}
.ph{background:#e9edf2;color:#5d6b7c;border:1px dashed #b9c4d0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-align:center;line-height:1}
.ph.sq{border-radius:6px;font-size:11px}
.photos{display:flex;flex-direction:column;gap:8px}
.ph1{background:#fff;border:1px solid #e1e7ee;border-radius:8px;overflow:hidden}
.ph1 a{display:block}
.ph1 img{display:block;width:100%;height:112px;object-fit:cover;object-position:50% 25%;background:#dfe5ec}
.ph1 .phn{height:112px;border-radius:0;border:0;border-bottom:1px dashed #b9c4d0;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:#8895a5;font-size:11.5px;text-align:center;padding:6px}
.cap{padding:5px 7px 6px}
.cap .n{color:#4b2fa3;font-weight:700;font-size:12px;line-height:1.25}
.cap .f{font-family:Consolas,"Courier New",monospace;font-size:10.5px;color:#4d5967;background:#f1f4f7;border:1px solid #e1e6ec;border-radius:5px;padding:2px 5px;margin-top:4px;word-break:break-all}
.lg{font-size:11.5px;color:#4b2fa3;font-weight:700;text-align:center;line-height:1.3}
.lg span{display:block;color:#98a3b0;font-weight:400}
.main{flex:1;min-width:0;padding:10px 12px 8px;display:flex;flex-direction:column;gap:10px}
.title{color:#1c7a46;font-size:12.5px;font-weight:600;line-height:1.35}
.lang .lh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;color:#fff;background:#b3261e}
.badge.en{background:#1d4e89}
.txt{font-family:Consolas,"Courier New",ui-monospace,monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;color:#1f2933}
.act{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn{background:var(--green);color:#fff;border:0;border-radius:7px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:#0e6637}
.btn.ok{background:#0b5a2f}
.cnt{color:#97a2af;font-size:12.5px}
.sep{border:0;border-top:1px dashed #dde5ec;margin:0}
.ft{border-top:1px solid #e3efe7;background:#fafcfb;padding:8px 12px;font-size:12.5px;color:#55657a;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.ft a{color:#1b4f9c;text-decoration:underline;font-weight:600}
.ft .oth a{font-weight:400;color:#6a7a8c;margin-left:6px}
.foot{margin-top:22px;color:#8795a5;font-size:12px;text-align:center}
@media(max-width:560px){.body{flex-direction:column}.panel{flex:none;border-right:0;border-bottom:1px solid #e4eaf0}.photos{flex-direction:row}.ph1{flex:1}}
</style>

-5-gundur-rivada-yatip-kalkiyor-2642108","other_urls":[],"datetime":"2026-10-23T16:26:00+03:00","time_known":true,"tags":["haber"],"clubs":[],"players":[{"name":"Sergen Yalçın","label":"Sergen Yalçın (A Milli Takım)","folders":[{"area":"milli","folder":"Sergen Yalçın"}],"img":"Pff88c198","file":"AA-20261022-42832181-42832157-TFF_TEKNIK_DIREKTOR_SERGEN_YALCIN_ILE_4_YILLIK_SOZLESME_IMZALADI.jpg"}],"no":22,"date_text":"23 Ekim","time_text":"16:26","day_full":"23 Ekim 2026"},{"id":"246d32a7b2","tr":"Eintracht Frankfurt'ta Köln maçında 90 dakika yedek kulübesinde kalan Can Uzun'un, cumartesi Dortmund karşısında da yedek kalabileceği belirtildi. Adi Hütter ilk 11'de büyük değişiklik düşünmediğini söyledi; 20 yaşındaki oyuncu nisandan bu yana ilk kez süre almamıştı.","en":"Can Uzun could be left on the bench again for Eintracht Frankfurt's trip to Borussia Dortmund on Saturday. The 20-year-old was an unused substitute in the 1-0 win over Cologne, the first game he has not featured in since April, and Adi Hutter says he is not planning big changes.","title":"Eintracht Frankfurt: İşte bu yüzden Can Uzun yine yedek kulübesine mahkum olabilir","sources":["sporx.com","transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/can-uzunun-ilk-11deki-yeri-tehlikede-teknik-direktor-adi-hutter-eksik-gordugu-noktalari-acikladi/view/news/489415","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/adi-hutter-den-can-uzun-a-elestiri-SXHBQ1180354SXQ"}],"datetime":"2026-10-23T16:18:18+03:00","time_known":true,"tags":["kadro","açıklama"],"clubs":[{"name":"Eintracht Frankfurt","logo":"Logolar\\Yabancı Ligler\\Bundesliga\\Eintracht Frankfurt.png","img":"Lbb2fd760","file":"Eintracht Frankfurt.png"},{"name":"Koln","logo":"Logolar\\Yabancı Ligler\\Bundesliga\\Koln.png","img":"L10cd01e0","file":"Koln.png"}],"players":[{"name":"Can Uzun","label":"Can Uzun (A Milli Takım)","folders":[{"area":"milli","folder":"Can Uzun"}],"img":"Pedfda4bb","file":"CAN UZUN14886.JPG"}],"no":23,"date_text":"23 Ekim","time_text":"16:18","day_full":"23 Ekim 2026"},{"id":"194128fdc5","tr":"Fenerbahçe'de ameliyat sonrası sahalardan uzak kalan Mert Müldür, takımla birlikte çalışmaya başladı. Milli oyuncu, görev verilmesi halinde pazartesi Galatasaray derbisinde forma giyebilecek.","en":"Mert Muldur has returned to training with the Fenerbahce squad after surgery kept him out. The Turkey international could be available for Monday's derby with Galatasaray if called upon.","title":"Fenerbahçe'ye derbi öncesi müjde! Takımla çalışmalara başladı","sources":["fanatik.com.tr","fotomac.com.tr","ntvspor.net","sporx.com","trtspor.com.tr"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-fenerbahceye-derbi-oncesi-mujde-takimla-calismalara-basladi-431794","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-ye-mert-muldur-den-mujdeli-haber-SXHBQ1180349SXQ"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fenerbahce-galatasaray-derbisinin-hazirliklarini-surdurdu-2642106"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/fenerbahce/2026/10/23/fenerbahcenin-derbi-mesaisi-suruyor"},{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/fenerbahcede-derbi-mesaisi-33733080"}],"datetime":"2026-10-23T16:16:51+03:00","time_known":true,"tags":["sakatlık"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Mert Müldür","label":"Fenerbahçe - Mert Müldür","folders":[{"area":"tr","folder":"Fenerbahçe - Mert Müldür"}],"img":"P563fed26","file":"AA-20260914-42470208-42470203-GAZIANTEP_FK_FENERBAHCE.jpg"}],"no":24,"date_text":"23 Ekim","time_text":"16:16","day_full":"23 Ekim 2026"},{"id":"b140f7327c","tr":"Fenerbahçe-Slavia Prag maçınd ayan Arda Güler açıklaması! İspanya'da gündem oldu...","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/real-madrid/galeri-modric-ve-kroosu-yaralayan-arda-guler-aciklamasi-ispanyada-gundem-oldu-2642082","other_urls":[],"datetime":"2026-10-23T14:25:00+03:00","time_known":true,"tags":["açıklama","yurtdışı"],"clubs":[{"name":"Real Madrid","logo":"Logolar\\Yabancı Ligler\\La Liga\\Real Madrid.png","img":"Lf9569545","file":"Logolar\\Yabancı Ligler\\La Liga\\Real Madrid.png"}],"players":[{"name":"Arda Güler","label":"Real Madrid - Arda Güler","folders":[{"area":"yab","folder":"Real Madrid - Arda Güler"}],"img":"Pcd80c14a","file":"AA-20261021-42826069-42826055-REAL_MADRID_RB_LEIPZIG.jpg"}],"no":28,"date_text":"23 Ekim","time_text":"14:25","day_full":"23 Ekim 2026"},{"id":"71b268ddeb","tr":"Trabzonspor kalecisi Andre Onana, Hearts maçının ardından evine dönerken Yomra'da zincirleme trafik kazasına karıştı. Araçta ailesi de bulunan Kamerunlu kaleci ve ailesi kazayı yara almadan atlattı.","en":"Trabzonspor goalkeeper Andre Onana was involved in a multi-car collision in Yomra while driving home after the win over Hearts. The Cameroonian and his family, who were in the car with him, escaped unhurt.","title":"Trabzonsporlu Onana kaza geçirdi!","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/trabzonspor/trabzonsporlu-onana-kaza-gecirdi-2642084","other_urls":[],"datetime":"2026-10-23T13:57:51+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Hearts","logo":"Logolar\\Konferans Ligi\\Hearts.png","img":"Ld5e89687","file":"Hearts.png"}],"players":[{"name":"Andre Onana","label":"Trabzonspor - Andre Onana","folders":[{"area":"tr","folder":"Trabzonspor - Andre Onana"}],"img":"P1ec40fa3","file":"NRGL5902.JPG"}],"no":29,"date_text":"23 Ekim","time_text":"13:57","day_full":"23 Ekim 2026"},{"id":"c8b295b1ec","tr":"Fenerbahçe'de Ederson formunu sürdürüyor. Brezilyalı kaleci, ligde forma giydiği 7 maçın 5'inde kalesini gole kapattı.","en":"Ederson's fine form continues for Fenerbahce. The Brazilian goalkeeper has kept clean sheets in five of his seven Super Lig appearances.","title":"Fenerbahçe'de Ederson performansıyla göz dolduruyor","sources":["trtspor.com.tr"],"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/fenerbahcede-ederson-performansiyla-goz-dolduruyor-33731617","other_urls":[],"datetime":"2026-10-23T13:35:10.763000+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"Ederson Santana de Moraes","label":"Fenerbahçe - Ederson Santana de Moraes","folders":[{"area":"tr","folder":"Fenerbahçe - Ederson Santana de Moraes"}],"img":"Pb502f81f","file":"AA-20261014-42757329-42757326-ASTON_VILLA_FENERBAHCE.jpg"}],"no":30,"date_text":"23 Ekim","time_text":"13:35","day_full":"23 Ekim 2026"},{"id":"6806dd4a22","tr":"Pazartesi RAMS Park'taki derbi öncesi Galatasaray'ın kadro değeri 382, Fenerbahçe'ninki 261 milyon euro; iki takımın toplamı 642,7 milyon euro. Lider Galatasaray 19, üçüncü sıradaki Fenerbahçe 16 puanda.","en":"Galatasaray's squad is valued at 382 million euros against Fenerbahce's 261 million ahead of Monday's derby at RAMS Park, a combined 642.7 million according to Transfermarkt. Leaders Galatasaray have 19 points, three more than third-placed Fenerbahce.","title":"642,7 milyon euroluk derbiye doğru - Galatasaray ve Fenerbahçe'nin en değerli futbolcuları","sources":["transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/643-milyon-euroluk-derbiye-dogru-galatasaray-ve-fenerbahcenin-en-degerli-futbolculari/view/news/489401","other_urls":[],"datetime":"2026-10-23T13:34:11+03:00","time_known":true,"tags":["kadro"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[],"no":31,"date_text":"23 Ekim","time_text":"13:34","day_full":"23 Ekim 2026"},{"id":"c7b57d0e9d","tr":"Güncellenen UEFA gelirlerine göre Galatasaray bu sezon 20,72 milyon euro, Fenerbahçe 20,02 milyon euro garantiledi. Avrupa Ligi'nde Beşiktaş 5,36, Konferans Ligi'nde Trabzonspor 3,97 milyon euroya ulaştı; sıralama ve yayın gelirleri bu rakamlara dahil değil.","en":"Galatasaray have secured 20.72 million euros in UEFA prize money so far this season and Fenerbahce 20.02 million, according to updated figures. Besiktas have banked 5.36 million in the Europa League and Trabzonspor 3.97 million in the Conference League, excluding ranking and broadcast payments.","title":"UEFA gelirleri güncellendi! Beşiktaş, Fenerbahçe, Galatasaray ve Trabzonspor ne kadar kazandı?","sources":["ntvspor.net"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-uefa-gelirleri-guncellendi-besiktas-fenerbahce-galatasaray-ve-trabzonspor-ne-kadar-kazandi-431787","other_urls":[],"datetime":"2026-10-23T13:24:42+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[],"no":32,"date_text":"23 Ekim","time_text":"13:24","day_full":"23 Ekim 2026"},{"id":"3b025ccdfc","tr":"Inter'in, sözleşmesi Haziran 2027'de bitecek Hakan Çalhanoğlu ile ocak ayından önce yeni kontrat imzalamak istediği ileri sürüldü. Gazzetta dello Sport'a göre İtalyan kulübü, 32 yaşındaki milli yıldıza daha düşük sabit maaş ve performansa bağlı primler önerecek.","en":"Inter reportedly want to tie Hakan Calhanoglu down to a new deal before January, with his current contract running until June 2027. According to La Gazzetta dello Sport, the Serie A club will offer the 32-year-old Turkey star a lower basic salary with more performance-related bonuses.","title":"Inter'de Hakan Çalhanoğlu için yeni sözleşme planı: Maaş indirimi gündemde","sources":["sporx.com","transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/interde-hakan-calhanoglu-icin-yeni-sozlesme-plani-maas-indirimi-gundemde/view/news/489395","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/inter-in-hakan-calhanoglu-plani-SXHBQ1180327SXQ"}],"datetime":"2026-10-23T12:29:47+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Inter","logo":"Logolar\\Yabancı Ligler\\Serie A\\Inter.png","img":"L5e480711","file":"Inter.png"}],"players":[{"name":"Hakan Çalhanoğlu","label":"Inter Milan - Hakan Çalhanoğlu","folders":[{"area":"yab","folder":"Inter Milan - Hakan Çalhanoğlu"}],"img":"Pc57d7c7a","file":"InterTakim11.jpg"}],"no":33,"date_text":"23 Ekim","time_text":"12:29","day_full":"23 Ekim 2026"},{"id":"c593681346","tr":"Göztepe'nin Al Jazira'dan satın alma opsiyonuyla kiraladığı 22 yaşındaki Richard Akonnor, takımın tek sol beki olarak vazgeçilmez oldu. BAE milli oyuncusu 7 maçta 520 dakika süre aldı.","en":"Richard Akonnor, on loan at Goztepe from Al Jazira with an option to buy, has become indispensable as the club's only left-back. The 22-year-old UAE international has played 520 minutes across seven matches.","title":"Göztepe'de Akonnor sevinci","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/goztepe/goztepede-akonnor-sevinci-2642079","other_urls":[],"datetime":"2026-10-23T12:27:25+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Göztepe","logo":"Logolar\\Süper Lig\\Goztepe.png","img":"Le49c02f8","file":"Logolar\\Süper Lig\\Goztepe.png"}],"players":[{"name":"Richard Akonnor","label": const KEY='haber_paylasildi_v1';
let shared={}; try{shared=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let flt='Tümü';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const len=s=>Array.from(s).length;
const ini=n=>n.replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr');
function chipsData(){const m={};DATA.cards.forEach(c=>c.clubs.forEach(l=>{m[l.name]=(m[l.name]||new Set()).add(c.id)}));
  return Object.entries(m).map(([k,v])=>[k,v.size]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'tr'));}
function renderChips(){const cd=chipsData();
  $('#chips').innerHTML=[['Tümü',DATA.cards.length]].concat(cd).map(([k,n])=>`<button class="chip ${k===flt?'on':''}" data-k="${esc(k)}">${esc(k)} <b>${n}</b></button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flt=b.dataset.k;renderChips();renderCards();});}
function logoHtml(l,one){return l.img?`<img src="${esc(l.img)}" alt="${esc(l.name)}" title="${esc(l.name)}">`:`<div class="ph" title="${esc(l.name)} logosu arşivde yok">${esc(ini(l.name))}</div>`;}
function card(c){
  const tags=c.tags.map(t=>`<span class="tag ${t==='yurtdışı'?'ab':''}">${esc(t)}</span>`).join('');
  const pill=`<span class="pill ${c.time_text?'':'nt'}">${esc(c.date_text)}${c.time_text?' · '+esc(c.time_text):''}</span>`;
  const logos=`<div class="logos ${c.clubs.length<2?'one':''}">${c.clubs.map(l=>logoHtml(l)).join('')||'<div class="ph sq">logo yok</div>'}</div>`;
  const photos=c.players.map(p=>`<div class="ph1">${p.img?`<a href="${esc(p.img)}" target="_blank" title="Büyük aç"><img src="${esc(p.img)}" alt="${esc(p.name)}"></a>`:`<div class="phn">Fotoğraf arşivde yok</div>`}<div class="cap"><div class="n">${esc(p.label)}</div>${p.file?`<div class="f">${esc(p.file)}</div>`:''}</div></div>`).join('');
  const lg=`<div class="lg">${esc(c.clubs.map(l=>l.name).join(' – '))}<span>Kulüp logoları</span></div>`;
  const srcs=c.sources.join(', ');
  const when=c.day_full+(c.time_text?' · '+c.time_text:' · saat belirtilmemiş')+' (İstanbul)';
  const oth=c.other_urls.filter(o=>o.url!==c.url).slice(0,5).map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.source)}</a>`).join('');
  const lang=(code,txt,cls)=>`<div class="lang"><div class="lh"><span class="badge ${cls}">${code}</span></div><div class="txt">${esc(txt)}</div><div class="act"><button class="btn" data-copy="${esc(c.id)}|${code}">Metni kopyala</button><span class="cnt">${len(txt)} karakter</span></div></div>`;
  return `<article class="card ${shared[c.id]?'done':''}" id="c_${esc(c.id)}">
  <div class="hd"><span class="no">${c.no}</span>${pill}<span class="src">${esc(c.source)}</span>${tags}
   <label class="paylas"><input type="checkbox" data-id="${esc(c.id)}" ${shared[c.id]?'checked':''}> paylaşıldı</label></div>
  <div class="body"><div class="panel">${logos}<div class="photos">${photos}</div>${lg}</div>
   <div class="main"><div class="title">kaynak başlık: ${esc(c.title)}</div>${lang('TR',c.tr,'tr')}<hr class="sep">${lang('EN',c.en,'en')}</div></div>
  <div class="ft"><span>Kaynak: ${esc(srcs)} · ${esc(when)}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">kaynağı aç</a>${oth?`<span class="oth">diğer: ${oth}</span>`:''}</div>
</article>`;}
function renderCards(){
  const list=DATA.cards.filter(c=>flt==='Tümü'||c.clubs.some(l=>l.name===flt));
  $('#grid').innerHTML=list.map(card).join('');
  document.querySelectorAll('input[data-id]').forEach(i=>i.onchange=()=>{const id=i.dataset.id;if(i.checked)shared[id]=1;else delete shared[id];
    try{localStorage.setItem(KEY,JSON.stringify(shared))}catch(e){}
    document.getElementById('c_'+id).classList.toggle('done',i.checked);info();});
  document.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>{const [id,code]=b.dataset.copy.split('|');const c=DATA.cards.find(x=>x.id===id);copyText(code==='TR'?c.tr:c.en,b);});
  info();}
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='Kopyalandı ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Metni kopyala';btn.classList.remove('ok')},1400)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);done()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb();}
function info(){const n=Object.keys(shared).filter(id=>DATA.cards.some(c=>c.id===id)).length;
  const vis=document.querySelectorAll('.card').length;
  $('#info').innerHTML=`<span>Kulüp çipine tıklayınca yalnızca o kulübün haberleri görünür. Logo ve fotoğraflar yalnızca kendi arşivinden (2026-27 FOTO) alınır; oyuncu fotoğrafı klasöründeki en yeni tarihli görseldir, dosya adı kartın üzerinde yazar.</span><span><b>${vis}</b> kart gösteriliyor · <b>${n}</b> / ${DATA.cards.length} paylaşıldı</span>`;}
$('#upd').textContent=DATA.last_update_text; $('#nday').textContent=DATA.news_day_text;
$('#foot').textContent='Sayfa üretildi: '+DATA.page_generated+' · '+DATA.cards.length+' kart · Web sürümü: her taramadan sonra otomatik güncellenir (bilgisayar gerekmez). Görseller yalnızca kendi arşivinden.';
renderChips(); renderCards();
</script>
