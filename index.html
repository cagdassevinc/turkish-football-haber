<style>

.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}

.src{font-weight:700;font-size:13.5px}

.lg span{display:block;color:#98a3b0;font-weight:400}
.main{flex:1;min-width:0;padding:10px 12px 8px;display:flex;flex-direction:column;gap:10px}

.act{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn{background:var(--green);color:#fff;border:0;border-radius:7px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:#0e6637}
.btn.ok{background:#0b5a2f}
.cnt{color:#97a2af;font-size:12.5px}
.sep{border:0;border-top:1px dashed #dde5ec;margin:0}
.ft{border-top:1px solid #e3efe7;background:#fafcfb;padding:8px 12px;font-size:12.5px;color:#55657a;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}

@media(max-width:560px){.body{flex-direction:column}.panel{flex:none;border-right:0;border-bottom:1px solid #e4eaf0}.photos{flex-direction:row}.ph1{flex:1}}
</style>

ource":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fetonun-futbolda-sike-kumpasi-sorusturmasinda-lutfi-aribogana-5-yila-kadar-hapis-istemi-2641968"}],"datetime":"2026-10-22T15:37:12+03:00","time_known":true,"tags":["haber"],"clubs":[],"players":[],"no":4,"date_text":"22 Ekim","time_text":"15:37","day_full":"22 Ekim 2026"},{"id":"c69e3c2eb4","tr":"TRT Spor'a göre Aston Villa, Fenerbahçe'de yükselen performansıyla dikkat çeken Oğuz Aydın'ı radarına aldı. İngiliz kulübü, Şampiyonlar Ligi'nde Fenerbahçe'yi 6-0 yendiği maçın ardından milli oyuncu hakkında bilgi aldı; Oğuz bu sezon 16 maçta 3 gol, 3 asist yaptı.","en":"Aston Villa have reportedly been tracking Fenerbahce winger Oguz Aydin, according to TRT Spor. The Premier League side made enquiries about the Turkey international after their 6-0 Champions League win over Fenerbahce, and he has three goals and three assists in 16 games this season.","title":"Aziz Yıldırım'ın \"Geliştirmek lazım\" dediği futbolcunun talibi çıktı","sources":["ntvspor.net","trtspor.com.tr"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-aziz-yildirimin-gelistirmek-lazim-dedigi-futbolcunun-talibi-cikti-431730","other_urls":[{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/gozler-oguz-aydinda-33714269"}],"datetime":"2026-10-22T15:08:57+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Aston Villa","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Aston Villa.png","img":"L4021ea7f","file":"Aston Villa.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"Oğuz Aydın","label":"Fenerbahçe - Oğuz Aydın","folders":[{"area":"tr","folder":"Fenerbahçe - Oğuz Aydın"}],"img":"P2aac58df","file":"AA-20261020-42813334-42813328-FENERBAHCE_SLAVIA_PRAG.jpg"}],"no":5,"date_text":"22 Ekim","time_text":"15:08","day_full":"22 Ekim 2026"},{"id":"f7aa903ca6","tr":"Sergen Yalçın, Berke Özer'in  players have borne the brunt of supporters' anger after the Slavia Prague draw. Matteo Guendouzi was blamed for gifting the opener and Nelson Semedo for the second, while Turkey internationals Kerem Akturkoglu and Ismail Yuksek were criticised for ineffective displays.","title":"Fenerbahçe'de 4 futbolcu hedefte! 2 milli yıldıza tepki","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fenerbahcede-4-futbolcu-hedefte-2-milli-yildiza-tepki-2641934","other_urls":[],"datetime":"2026-10-22T11:43:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"}],"players":[{"name":"Matteo Guendouzi","label":"Fenerbahçe - Matteo Guendouzi","folders":[{"area":"tr","folder":"Fenerbahçe - Matteo Guendouzi"}],"img":"Pb079d269","file":"AA-20261020-42813397-42813393-FENERBAHCE_SLAVIA_PRAG.jpg"},{"name":"Nelson Semedo","label":"Fenerbahçe - Nelson Semedo","folders":[{"area":"tr","folder":"Fenerbahçe - Nelson Semedo"}],"img":"P585198db","file":"fenerbahce_12.jpg"}],"no":12,"date_text":"22 Ekim","time_text":"11:43","day_full":"22 Ekim 2026"},{"id":"f079aedb22","tr":"Shakhtar Donetsk'in Inter'e 1-0 yenildiği maçın ardından konuşan Arda Turan, El Clasico'da Barcelona'yı desteklediğini söyledi. 'Arda Güler benim kardeşim ama ben Barcelona tarafındayım. O Fenerbahçe'de oynadı, ben Galatasaray'da' dedi.","en":"Arda Turan admitted he will be rooting for Barcelona in Sunday's Clasico after his Shakhtar Donetsk side lost 1-0 at Inter. 'Arda Guler is my brother, but I'm on Barcelona's side. It's the same as him playing for Fenerbahce and me for Galatasaray,' he said.","title":"Arda Turan, Arda Güler'i tenzih ederek açıkladı: Galatasaray-Fenerbahçe örneği verdi","sources":["fanati .jpg"}],"no":16,"date_text":"22 Ekim","time_text":"10:11","day_full":"22 Ekim 2026"},{"id":"1743aa8d28","tr":"Slavia Prag beraberliğinin ardından İsmail Kartal'ın Fenerbahçe'deki geleceği pazartesi oynanacak Galatasaray derbisine bağlandı. Sabah'a göre olası bir ayrılıkta Vincenzo Montella ve Antonio Conte aday olarak öne çıkıyor.","en":"Ismail Kartal's future at Fenerbahce reportedly hinges on Monday's derby with Galatasaray after the Slavia Prague draw. According to Sabah, Vincenzo Montella and Antonio Conte are the leading candidates should he depart.","title":"İsmail Kartal'ın olası ayrılığı halinde Fenerbahçe'nin 2 hoca adayı var","sources":["fanatik.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-iddialar-ayyuka-cikti-ismail-kartal-ile-olasi-veda-halinde-2-aday-konusuluyor-431717","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/galeri-ismail-kartal-icin-kritik-derbi-yerine-gelecek-aday-belirlendi-2641907"},{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-de-derbi-kaderi-belirleyecek-ismail-kartal-icin-kritik-pazartesi-SXHBQ1180172SXQ"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-tumer-metinin-galatasaray-fenerbahce-derbisi-iddiasi-konusuluyor-gerceklesirse-gundem-yanar-431716"}],"datetime":"2026-10-22T09:41:18+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"İsmail Kartal","label":"Fenerbahçe - İsmail Kartal","folders":[{"area":"tr","folder":"Fenerbahçe - İsmail Kartal"}],"img":"P627f4382","file":"AA-20261020-42813305-42813304-FENERBAHCE_SLAVIA_PRAG.jpg"}],"no":17,"date_text":"22 Ekim","time_text":"09:41","day_full":"22 Ekim 2026"},{"id":"6e3921dd02","tr" e":"AA-20261021-42820547-42820536-BESIKTAS_CRYSTAL_PALACE_MACINA_HAZIR.jpg"},{"name":"Dusan Vlahovic","label":"Beşiktaş - Dusan Vlahovic","folders":[{"area":"tr","folder":"Beşiktaş - Dusan Vlahovic"}],"img":"P467343c7","file":"AA-20261021-42820547-42820522-BESIKTAS_CRYSTAL_PALACE_MACINA_HAZIR.jpg"}],"no":24,"date_text":"22 Ekim","time_text":"06:50","day_full":"22 Ekim 2026"},{"id":"36f262b111","tr":"Trabzonspor'da 11 maçta 9 gol, 4 asistlik katkı veren Mohamed Salah, büyük 5 lig dışındaki oyuncuların Elo sıralamasında 1.797 puanla zirveye çıktı. Mısırlı yıldız, ikinci sıradaki Lionel Messi'yi geride bırakırken Victor Osimhen beşinci sırada yer aldı.","en":"Mohamed Salah, with nine goals and four assists in 11 games for Trabzonspor, has gone top of the Elo rankings for players outside Europe's big five leagues on 1,797 points. The Egyptian edged out Lionel Messi in second, with Galatasaray's Victor Osimhen fifth.","title":"Trabzonspor’da Salah fırtınası! İstatistikleriyle Messi’yi solladı","sources":["fotomac.com.tr"],"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/trabzonspor/2026/10/22/trabzonsporda-salah-firtinasi-istatistikleriyle-messiyi-solladi","other_urls":[],"datetime":"2026-10-22T06:50:15+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"}],"players":[{"name":"Mohamed Salah","label":"Trabzonspor - Mohamed Salah","folders":[{"area":"tr","folder":"Trabzonspor - Mohamed Salah"}],"img":"Pc7c85a4e","file":"AA-20261017-42785580-42785579-TRABZONSPORDA_BESIKTAS_MACININ_HAZIRLIKLARI_SURUYOR.jpg"}],"no":25,"date_text":"22 Ekim","time_text":"06:50","day_full":"22 Ekim 2026"},{"id":"c56abc9c98","tr":"Trabzonspor Başkanı Ertuğrul Doğan, Hearts maçının biletleri tükenince taraftarlara teşekkür etti. Doğan, tribünlerdeki coşkunun sahadaki mücadelenin en büyük itici gücü olduğunu söyledi.","en":"Trabzonspor president Ertugrul Dogan has thanked supporters after tonight's Conference League clash with Hearts sold out. He said the passion in the stands is the biggest driving force behind the team's efforts on the pitch.","title":"Doğan’dan taraftara teşekkür","sources":["fotomac.com.tr"],"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/trabzonspor/2026/10/22/dogandan-taraftara-tesekkur","other_urls":[],"datetime":"2026-10-22T06:50:15+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Hearts","logo":"Logolar\\Konferans Ligi\\Hearts.png","img":"Ld5e89687","file":"Hearts.png"}],"players":[{"name":"Ertuğrul Doğan","label":"Trabzonspor - Ertuğrul Doğan","folders":[{"area":"tr","folder":"Trabzonspor - Ertuğrul Doğan"}],"img":"Pc5b57b07","file":"AA-20260905-42392032-42392026-CUMHURBASKANI_RECEP_TAYYIP_ERDOGAN.jpg"}],"no":26,"date_text":"22 Ekim","time_text":"06:50","day_full":"22 Ekim 2026"},{"id":"245634cb6b","tr":"Arda Güler'in Leipzig'e attığı golün ardından Real Madrid resmi hesabından 'Arda, seni seviyorum' paylaşımı yaptı, Arda da 'Ben de seni seviyorum' diye yanıt verdi. Golünü 'çaldığı' Mbappe ise milli futbolcuya 'Küçük kardeşim' diye seslendi.","en":"Real Madrid's official account posted 'Arda, I love you' after Arda Guler's goal against Leipzig, and the midfielder replied 'I love you too'. Kylian Mbappe, whose shot Guler finished off, called him 'my little brother'.","title":"Real Madrid'den olay Arda Güler paylaşımı!","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/real-madrid-den-olay-arda-guler-paylasimi-SXHBQ1180150SXQ","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/mbappe-den-arda-guler-e-kucuk-kardesim-seni-seviyorum-SXHBQ1180177SXQ"}],"datetime":"2026-10-22T00:11:00+03:00","time_known":true,"tags":["açıklama","yurtdışı"],"clubs":[{"name":"Real Madrid","logo":"Logolar\\Yabancı Ligler\\La Liga\\ Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[{"name":"Okan Buruk","label":"Galatasaray - Okan Buruk","folders":[{"area":"tr","folder":"Galatasaray - Okan Buruk"}],"img":"Pe3e43927","file":"AA-20261021-42824776-42824775-LILLE_GALATASARAY.jpg"},{"name":"Aleksey Batrakov","label":"Galatasaray - Aleksey Batrakov","folders":[{"area":"tr","folder":"Galatasaray - Aleksey Batrakov"}],"img":"Pba6c4aa9","file":"AA-20261021-42824995-42824987-LILLE_GALATASARAY.jpg"}],"no":29,"date_text":"22 Ekim","time_text":null,"day_full":"22 Ekim 2026"},{"id":"cda0f1f5bc","tr":"Beşiktaş, Crystal Palace karşısında Avrupa kupalarındaki 267. maçına çıkacak. Siyah-beyazlılar İngiliz takımlarıyla oynadığı 22 maçta 6 galibiyet, 5 beraberlik, 11 yenilgi yaşadı; bu sezon sahasındaki 8 maçın hepsini kazandı.","en":"Tonight's meeting with Crystal Palace will be Besiktas' 267th European fixture and their first ever meeting with the Londoners. They have won six, drawn five and lost 11 of their 22 games against English opposition, but have won all eight of their home matches this season.","title":"Beşiktaş, Avrupa'da 267. kez sahne alacak","sources":["mackolik.com","sporx.com"],"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270839/Besiktas-267-kez-sahne-alacak","other_urls":[{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270840/Ingiliz-ekipleriyle-23-karsilasma"},{"source":"sporx.com","url":"https://www.sporx.com/besiktas-in-avrupa-daki-kalesi-dolmabahce-SXHBQ1180168SXQ"}],"datetime":"2026-10-22T00:00:00+03:00","time_known":false,"tags":["haber"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"},{"name":"Crystal Palace","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png","img":"Lc78fce2a","file":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png"}],"players":[],"no":30,"date_text":"22 Ekim","time_text":null,"day_full":"22 Ekim 2026"},{"id":"b4ecff864a","tr":"Galatasaray, Lille'i deplasmanda yenen ilk Türk takımı oldu; Lille de Avrupa kupalarında ilk kez sahasında 4 gol yedi. Sarı-kırmızılılar, 1999'daki Hertha Berlin maçından bu yana Devler Ligi'nde deplasmanda 4 gol atan ilk Türk kulübü oldu.","en":"Galatasaray became the first Turkish side to win at Lille, who had never conceded four at home in European competition before. It was also the first time a Turkish club had scored four away from home in the Champions League since Galatasaray did so at Hertha Berlin in 1999.","title":"Galatasaray, Türk futbol tarihinde bir ilki başardı","sources":["beinsports.com.tr","mackolik.com","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaray-turk-futbol-tarihinde-bir-ilki-basardi-431686","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/galatasaray-lille-karsisinda-bir-ilki-basardi-SXHBQ1180130SXQ"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/galatasaray-lille-karsisinda-bir-ilki-basardi"},{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270825/Galatasaray-rekorunu-tekrarladi"}],"datetime":"2026-10-21T21:44:13+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[],"no":31,"date_text":"21 Ekim","time_text":"21:44","day_full":"21 Ekim 2026"},{"id":"46f5710801","tr":"Victor Osimhen, eski takımı Lille'e karşı ilk resmi maçında attığı golle farkı ikiye çıkardı ama gol sevinci yaşamadı. Maçın adamı seçilen Nijeryalı golcü, 'Büyük bir maç çıkardık, bu stadı çok seviyorum. Lille'e de başarılar diliyorum' dedi.","en":"Victor Osimhen refused to celebrate after scoring against his former club Lille, his goal stretching Galatasaray's lead to two in his first competitive meeting with them. The player of the match said: 'We put in a big performance. I love this stadium, and I wish Lille all the best.'","title":"Siftahı Fransa'da yaptı! Galatasaray'da Victor Osimhen sesleri","sources":["fanatik.com.tr","fotomac.com.tr","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/siftahi-fransada-yapti-galatasarayda-victor-osimhen-sesleri-2641881","other_urls":[{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/sampiyonlarligi/2026/10/21/osimhen-gol-sonrasi-sevinmedi"},{"source":"sporx.com","url":"https://www.sporx.com/osimhen-eski-takimina-karsi-sahada-SXHBQ1180127SXQ"}],"datetime":"2026-10-21T21:24:00+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[{"name":"Victor Osimhen","label":"Galatasaray - Victor Osimhen","folders":[{"area":"tr","folder":"Galatasaray - Victor Osimhen"}],"img":"P5da8296a","file":"AA-20261021-42824776-42824774-LILLE_GALATASARAY.jpg"}],"no":32,"date_text":"21 Ekim","time_text":"21:24","day_full":"21 Ekim 2026"},{"id":"aee797119d","tr":"Lille'in Türk kalecisi Berke Özer, 542 gün sonra ilk kez resmi bir maçta Galatasaray'a karşı forma giydi. Galatasaray'ın 52. dakikadaki üçüncü golünde Torreira'nın kafa vuruşu Berke'den sekerek ağlara gitti.","en":"Lille's Turkish goalkeeper Berke Ozer faced Galatasaray in a competitive game for the first time in 542 days. It proved a tough night for the stopper, with Torreira's 52nd-minute header deflecting in off him for Galatasaray's third.","title":"Berke Özer, 542 gün sonra Galatasaray'a karşı!","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/berke-ozer-542-gun-sonra-galatasaray-a-karsi-SXHBQ1180128SXQ","other_urls":[],"datetime":"2026-10-21T21:20:55+03:00","time_known":true,"tags":["yurtdışı"],"clubs":[{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Berke Özer","label":"Berke Özer","folders":[{"area":"tr","folder":"Türk Futbolcular - Berke Özer"}],"img":"P0e9efa80","file":"berkelille.jpeg"},{"name":"Lucas Torreira","label":"Galatasaray - Lucas Torreira","folders":[{"area":"tr","folder":"Galatasaray - Lucas Torreira"}],"img":"Pbb80cd86","file":"AA-20261021-42825324-42825318-LILLE_GALATASARAY.jpg"}],"no":33,"date_text":"21 Ekim","time_text":"21:20","day_full":"21 Ekim 2026"},{"id":"6a3108b767","tr":"Wilfried Singo, sakatlığının ardından 7 maç sonra Lille maçıyla Galatasaray kadrosuna döndü ve 'Dönüşüm kademeli olacak' dedi. Abdülkerim Bardakcı da Sporting ve Barcelona maçlarında yedek kaldıktan sonra bu sezonki ilk Şampiyonlar Ligi maçına çıktı.","en":"Wilfried Singo returned to the Galatasaray squad at Lille after missing seven games through injury, saying his comeback 'will be gradual'. Abdulkerim Bardakci also made his first Champions League appearance of the season after sitting on the bench against Sporting and Barcelona.","title":"Galatasaray'da Singo 7 maç sonra kadroda!","sources":["ntvspor.net","sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/galatasaray-da-singo-7-mac-sonra-kadroda-SXHBQ1180126SXQ","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-singodan-lille-maci-oncesinde-sakatligi-hakkinda-aciklama-431684"},{"source":"sporx.com","url":"https://www.sporx.com/wilfried-singo-dan-sakatlik-aciklamasi-kademeli-olacak-SXHBQ1180114SXQ"},{"source":"sporx.com","url"  Ekim","time_text":"20:26","day_full":"21 Ekim 2026"},{"id":"e699cdb5e1","tr":"Yunus Akgün, Lille karşısında 65. saniyede attığı golle Galatasaray'ın Şampiyonlar Ligi tarihindeki en erken golüne imza attı. Önceki rekor, Ekim 2025'te Bodo/Glimt'e 3. dakikada gol atan Victor Osimhen'e aitti.","en":"Yunus Akgun wrote his name into the history books by scoring after just 65 seconds at Lille, the fastest goal in Galatasaray's Champions League history. The previous record belonged to Victor Osimhen, who struck in the third minute against Bodo/Glimt in October 2025.","title":"Yunus Akgün'den 65 saniyede rekor!","sources":["beinsports.com.tr","fanatik.com.tr","ntvspor.net","sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/yunus-akgun-den-65-saniyede-rekor-SXHBQ1180120SXQ","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-yunus-akgun-goluyle-galatasaray-rekorunu-kirdi-431689"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/yunus-akgun-galatasaray-tarihine-gecti"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/yunus-akgunden-tarihi-gol-galatasarayin-sampiyonlar-ligi-rekorunu-kirdi-2641878"}],"datetime":"2026-10-21T19:57:23+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Yunus Akgün","label":"Galatasaray - Yunus Akgün","folders":[{"area":"tr","folder":"Galatasaray - Yunus Akgün"}],"img":"Pc606ad21","file":"AA-20261021-42824629-42824626-LILLEGALATASARAY.jpg"},{"name":"Victor Osimhen","label":"Galatasaray - Victor Osimhen","folders":[{"area":"tr","folder":"Galatasaray - Victor Osimhen"}],"img":"P5da8296a","file":"AA-20261021-42824776-42824774-LILLE_GALATASARAY.jpg"}],"no":38,"date_text":"21 Ekim","time_text":"19:57","day_full":"21 Ekim 2026"},{"id":"e0804bf123","tr":"Galatasaray, Şampiyonlar Ligi'nde Lille'i deplasmanda 4-2 yenerek grubun ilk galibiyetini aldı. Sarı-kırmızılıların gollerini Yunus Akgün, Batrakov, Torreira ve Osimhen kaydetti; Lille'in iki golü de Diaoune'den geldi.","en":"Galatasaray ran out 4-2 winners at Lille to claim their first Champions League victory of the campaign. Yunus Akgun, Batrakov, Torreira and Osimhen were on target for the Turkish champions, with Diaoune scoring both of Lille's goals.","title":"Galatasaray'dan muhteşem zafer: Şampiyonlar Ligi'nde ilk galibiyet 4 golle geldi","sources":["fanatik.com.tr","fotomac.com.tr","mackolik.com","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaraydan-muhtesem-zafer-sampiyonlar-liginde-ilk-galibiyet-4-golle-geldi-431681","other_urls":[{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270823/Galatasaray-Lillei-4-golle-yikti"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/live-galatasaraydan-lillee-dortluk-tarife-sampiyonlar-liginde-ilklerin-aksami-ozet-lille-galatasaray-2641765"},{"source":"sporx.com","url":"https://www.sporx.com/iste-gercek-galatasaray-bu-SXHBQ1180118SXQ"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaray-fransada-4-golle-kazandi-puan-durumu-guncellendi-431696"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/galatasaray/2026/10/21/lille-galatasaray-macinda-goller-pes-pese-macin-gollerini-izleyin"}],"datetime":"2026-10-21T19:36:49+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[{"name":"Yunus Akgün","label":"Galatasaray - Yunus Akgün","folder ","time_text":"18:00","day_full":"21 Ekim 2026"},{"id":"292e2c85e1","tr":"Trabzonspor'un eski orta saha oyuncusu Giorgi Nemsadze 54 yaşında hayatını kaybetti. Bordo-mavili formayla 44 resmi maçta 1 gol ve 4 asist kaydeden Gürcü futbolcu için kulüp başsağlığı mesajı yayımladı.","en":"Former Trabzonspor midfielder Giorgi Nemsadze has died at the age of 54. The Georgia great made 44 competitive appearances for the club, scoring once and providing four assists, and Trabzonspor have paid tribute to him.","title":"Trabzonspor'un eski futbolcusu Giorgi Nemsadze hayatını kaybetti","sources":["beinsports.com.tr","sporx.com","transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/trabzonsporun-eski-futbolcusu-giorgi-nemsadze-hayatini-kaybetti/view/news/489296","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/trabzonspor-un-eski-futbolcusu-nemsadze-hayatini-kaybetti-SXHBQ1180102SXQ"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/trabzonsporlu-eski-futbolcu-giorgi-nemsadze-hayatini-kaybetti"}],"datetime":"2026-10-21T17:53:58+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"}],"players":[],"no":41,"date_text":"21 Ekim","time_text":"17:53","day_full":"21 Ekim 2026"},{"id":"da61a521d5","tr":"Trabzonspor'un genç oyuncusu Wagner Pina, yarınki Hearts maçı öncesi Mohamed Salah'a övgüler yağdırdı: 'Onunla sahada olmak, yaptıklarını görmek çok güzel.' Pina, Salah'ın saha içinde ve dışında çok önemli bir profesyonel olduğunu söyledi.","en":"Trabzonspor youngster Wagner Pina was full of praise for Mohamed Salah ahead of tomorrow's Conference League clash with Hearts: 'Being on the pitch with him and seeing what he does is wonderful.' Pina added that Salah is a true professional on and off the pitch.","title":"Wagner Pina'dan Mohamed Salah övgüsü: \"Onun yaptıklarını görebilmek ç ll":"21 Ekim 2026"},{"id":"7f225cfeca","tr":"Nelson Semedo, Slavia Prag'a karşı yaptığı asistle Fenerbahçe formasıyla Avrupa'daki ilk skor katkısını verdi. Portekizli sağ bek, Avrupa kupalarında 20 maçlık gol ve asist suskunluğunu 21. maçında bitirdi.","en":"Nelson Semedo registered his first goal involvement for Fenerbahce in Europe with an assist against Slavia Prague. The Portuguese right-back had gone 20 European games without a goal or assist before ending the drought in his 21st.","title":"Nelson Semedo, şanssızlığını kırdı","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/nelson-semedo-sanssizligini-kirdi-SXHBQ1180076SXQ","other_urls":[],"datetime":"2026-10-21T12:27:44+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"Nelson Semedo","label":"Fenerbahçe - Nelson Semedo","folders":[{"area":"tr","folder":"Fenerbahçe - Nelson Semedo"}],"img":"P585198db","file":"fenerbahce_12.jpg"}],"no":54,"date_text":"21 Ekim","time_text":"12:27","day_full":"21 Ekim 2026"},{"id":"e53a862ab6","tr":"TFF, çipli top teknolojisi için 18 stadyumda kablolama ve altyapı kurulumu ihalesi açtı. Teklifler 2 Kasım saat 16.00'ya kadar verilebilecek.","en":"The Turkish Football Federation has opened a tender to install cabling and infrastructure for chip-in-ball technology at 18 stadiums. Bids close on 2 November at 16:00.","title":"TFF'den çipli top açıklaması: İhale başladı","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/futbol/tffden-cipli-top-aciklamasi-ihale-basladi-2641814","other_urls":[],"datetime":"2026-10-21T12:24:20+03:00","time_known":true,"tags":["haber"],"clubs":[],"players":[{"name":"İbrahim Hacıosmanoğlu","label":"İ m","time_text":"11:35","day_full":"21 Ekim 2026"},{"id":"cb95d574f2","tr":"Galatasaray, Lille maçına gidecek taraftarlarını uyardı. Stat kapıları yerel saatle 16.45'te açılacak; taraftarların Rihour Metro Durağı'ndan en geç 15.45'te yola çıkması öneriliyor. Bilet ve üst araması yapılacak, misafir tribünü dışına girmek yasak.","en":"Galatasaray have issued guidance to supporters travelling to Lille. Gates open at 16:45 local time, and fans are advised to leave from Rihour metro station by 15:45 at the latest. There will be ticket and body searches, and away fans may only enter the visiting section.","title":"Galatasaray'dan Lille maçına saatler kala 4 maddelik açıklama","sources":["ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaraydan-lille-macina-saatler-kala-4-maddelik-aciklama-431650","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/galatasaray-dan-lille-maci-oncesi-uyari-SXHBQ1180049SXQ"}],"datetime":"2026-10-21T11:16:28+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[],"no":58,"date_text":"21 Ekim","time_text":"11:16","day_full":"21 Ekim 2026"},{"id":"5761c78552","tr":"Transfermarkt'ın Süper Lig'deki yeni transferler listesinde Mohamed Salah, 8 maçta 11 gol katkısıyla (8 gol, 3 asist) zirvede. Trabzonspor'un yıldızı, kariyerindeki en iyi sezon başlangıcı rekorunu egale etti; Kyziridis ve Gift Orban onu izliyor.","en":"Mohamed Salah tops Transfermarkt's chart of the Super Lig's new signings with 11 goal involvements (eight goals, three assists) in eight games. The Trabzonspor star has matched the best start of his career, with Alexandros Kyziridis and Gift Orban next on the list.","title":"Süper Lig'de yeni tran .com.tr","url":"https://www.fanatik.com.tr/besiktas/besiktas-crystal-palace-macinda-yildiz-futbolcu-yok-2641783","other_urls":[{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/crystal-palace-karsisinda-besiktasta-kritik-eksik"},{"source":"sporx.com","url":"https://www.sporx.com/besiktas-ta-orkun-kokcu-yine-yok-SXHBQ1180061SXQ"},{"source":"sporx.com","url":"https://www.sporx.com/besiktas-a-orkun-kokcu-den-kotu-haber-SXHBQ1180062SXQ"}],"datetime":"2026-10-21T10:11:39+03:00","time_known":true,"tags":["sakatlık","hakem"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"},{"name":"Crystal Palace","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png","img":"Lc78fce2a","file":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png"}],"players":[{"name":"Orkun Kökçü","label":"Beşiktaş - Orkun Kökçü","folders":[{"area":"tr","folder":"Beşiktaş - Orkun Kökçü"}],"img":"P5523583a","file":"AA-20261015-42769458-42769454-HOFFENHEIM_BESIKTAS.jpg"}],"no":65,"date_text":"21 Ekim","time_text":"10:11","day_full":"21 Ekim 2026"},{"id":"38c3b2b099","tr":"Galatasaray, bu akşam 19.45'te Lille deplasmanında savunmada ideal kadrosuna dönüyor. Okan Buruk'un Roland Sallai ve Abdülkerim Bardakcı'yı ilk 11'de sahaya sürmesi bekleniyor.","en":"Galatasaray are set to revert to their first-choice defence for tonight's Champions League trip to Lille, which kicks off at 19:45. Okan Buruk is expected to recall Roland Sallai and Abdulkerim Bardakci to the starting XI.","title":"Galatasaray'da ideal savunmaya dönüş","sources":["beinsports.com.tr","fanatik.com.tr","ntvspor.net","sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/galatasaray-da-ideal-savunmaya-donus-SXHBQ1180037SXQ","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/lille-galatasaray-muhtemel-11-ler-SXHBQ1180024SXQ"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-sampiyonlar-li n":"Trabzonspor have now won their last four league games against Galatasaray and Besiktas, a run they last managed in 1989. They have scored 10 and conceded two in that spell, including 4-0 and 2-0 wins in Thomas Reis's two derbies in charge.","title":"Derbilerde Fırtına çıktı! Trabzonspor'dan 37 yıl sonra bir ilk","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/trabzonspor/derbilerde-firtina-cikti-trabzonspordan-37-yil-sonra-bir-ilk-2641768","other_urls":[],"datetime":"2026-10-21T06:59:00+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Thomas Reis","label":"Trabzonspor - Thomas Reis","folders":[{"area":"tr","folder":"Trabzonspor - Thomas Reis"}],"img":"P7a3a7b0b","file":"AA-20261021-42821187-42821167-TRABZONSPOR_HEARTS_MACINA_DOGRU.jpg"}],"no":73,"date_text":"21 Ekim","time_text":"06:59","day_full":"21 Ekim 2026"},{"id":"8dfe6b03c2","tr":"TFF, Süper Lig ve 1. Lig yayın ihalesinin 13 Ocak yerine 30 Kasım'da sonuçlandırılmasına karar verdi.","en":"The TFF have brought forward the Super Lig and TFF 1. Lig broadcasting tender, which will now be concluded on 30 November rather than 13 January.","title":"Yayın ihalesi 30 Kasım’a çekildi","sources":["fotomac.com.tr"],"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/futbol/2026/10/21/yayin-ihalesi-30-kasima-cekildi","other_urls":[],"datetime":"2026-10-21T06:50:17+03:00","time_known":true,"tags":["haber"],"clubs":[],"players":[{"name":"İbrahim Hacıosmanoğlu","label":"İbrahim Hacıosmanoğlu (A Milli Takım)","folders":[{"area":"milli","folder":"İbrahim Hacıosmanoğlu"}],"img":"P6a960a39","file":"AA-20261009-42705129-42705122-TURKIYE_FUTBOL_FEDERASYONU_YONETIM_KURULU_OLAGANUSTU_TOPLANTISI.jp lar\\Yabancı Ligler\\Ligue 1\\Lille.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Victor Osimhen","label":"Galatasaray - Victor Osimhen","folders":[{"area":"tr","folder":"Galatasaray - Victor Osimhen"}],"img":"P5da8296a","file":"AA-20261021-42824776-42824774-LILLE_GALATASARAY.jpg"}],"no":76,"date_text":"21 Ekim","time_text":null,"day_full":"21 Ekim 2026"},{"id":"ff18016ce5","tr":"Galatasaray, Lille deplasmanıyla Avrupa kupalarındaki 343. maçına çıkıyor ve Fransız ekibiyle ilk kez karşılaşıyor. Lille, sarı-kırmızılıların Avrupa'daki 115. farklı rakibi olacak. Galatasaray'ın 342 maçlık Avrupa karnesi: 121 galibiyet, 90 beraberlik, 131 yenilgi.","en":"Tonight's trip to Lille will be Galatasaray's 343rd European fixture and their first ever meeting with the French side, who become their 115th different opponent on the continent. Their record from 342 European games reads 121 wins, 90 draws and 131 defeats.","title":"Galatasaray, Lille ile Avrupa kupalarında ilk kez karşılaşacak","sources":["mackolik.com"],"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270810/Lille-ile-ilk-randevu","other_urls":[{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270809/Galatasaray-343-kez-sahne-alacak"}],"datetime":"2026-10-21T00:00:00+03:00","time_known":false,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[],"no":77,"date_text":"21 Ekim","time_text":null,"day_full":"21 Ekim 2026"},{"id":"787ac86e3c","tr":"Slavia Prag'ın 90. dakikadaki beraberlik golünün ardından Kadıköy'de tribünler 'İsmail Kartal istifa' diye bağırdı. Fenerbahçe, 18 yıl sonra döndüğü Şampiyonlar Ligi'nde hâlâ galibiyet alamadı.","en":"Chants of 'Ismail Kartal, resign' rang around Kadikoy after Slavia Prague's 90th-minute equaliser. Fenerbahce are still waiting for a first win on their return to the Champions League after 18 years.","title":"Kadıköy'de dram! Fenerbahçe tribünleri 'İsmail istifa' sesleriyle inledi","sources":["fanatik.com.tr","ntvspor.net","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/kadikoyde-dram-fenerbahce-tribunleri-ismail-istifa-sesleriyle-inledi-2641744","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-son-dakika-fenerbahce-tribunlerinde-ismail-kartal-istifa-tezahuratlari-431625"},{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-tribunlerinde-ismail-kartal-istifa-tezahuratlari-SXHBQ1180002SXQ"}],"datetime":"2026-10-20T21:41:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"İsmail Kartal","label":"Fenerbahçe - İsmail Kartal","folders":[{"area":"tr","folder":"Fenerbahçe - İsmail Kartal"}],"img":"P627f4382","file":"AA-20261020-42813305-42813304-FENERBAHCE_SLAVIA_PRAG.jpg"}],"no":78,"date_text":"20 Ekim","time_text":"21:41","day_full":"20 Ekim 2026"},{"id":"c1f12c2d16","tr":"Okan Buruk, yarınki Lille maçı öncesi 'Rafael Leao dışında herkes burada' dedi. Tecrübeli hoca, idmanın tamamına katılan Wilfried Singo'nun uygun olursa süre alacağını söyledi ve kalan 5 maçın kritik olduğunu vurguladı.","en":"Okan Buruk says 'everyone apart from Rafael Leao is here' ahead of tomorrow's Champions League trip to Lille. The Galatasaray boss confirmed Wilfried Singo, who completed a full session, will get minutes if fit, and stressed that every point counts in the five games left.","title":"Galatas -isliklandi-tepkilere-verdigi-karsilik-ekrana-yansidi-431624","other_urls":[],"datetime":"2026-10-20T21:35:55+03:00","time_known":true,"tags":["kadro"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"}],"players":[{"name":"Kerem Aktürkoğlu","label":"Fenerbahçe - Kerem Aktürkoğlu","folders":[{"area":"tr","folder":"Fenerbahçe - Kerem Aktürkoğlu"}],"img":"Pb0c60cc1","file":"AA-20261020-42813789-42813788-FENERBAHCE_SLAVIA_PRAG.jpg"}],"no":80,"date_text":"20 Ekim","time_text":"21:35","day_full":"20 Ekim 2026"},{"id":"e09d06bb39","tr":"Fenerbahçe'de Nathan Ake, Slavia Prag maçında 19. dakikada baldırını tutarak yerde kaldı ve 21'de yerini Oppong'a bıraktı. Hollandalı stoperin 26 Ekim'deki Galatasaray derbisinde oynayıp oynayamayacağı yarın netleşecek.","en":"Nathan Ake went down clutching his calf in the 19th minute of Fenerbahce's clash with Slavia Prague and was replaced by Oppong two minutes later. Whether the Dutch defender will be fit for the Galatasaray derby on 26 October should become clearer tomorrow.","title":"Fenerbahçe'de sakatlık! Yıldız oyuncu Slavia Prag maçına devam edemedi","sources":["beinsports.com.tr","fanatik.com.tr","fotomac.com.tr","ntvspor.net","sporx.com","trtspor.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fenerbahcede-sakatlik-yildiz-oyuncu-slavia-prag-macina-devam-edemedi-2641740","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-son-dakika-derbi-oncesi-fenerbahceye-ake-soku-431618"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/fenerbahce/2026/10/20/fenerbahcede-sakatlik-soku-yildiz-futbolcu-oyuna-devam-edemedi"},{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-de-sakatlik-nathan-ake-SXHBQ1180001SXQ"},{"source":"tr umda bildirimleri açık\"","sources":["ntvspor.net"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-besiktasin-transfer-etmek-istedigi-kislyaktan-galatasaray-itirafi-telefonumda-bildirimleri-acik-431615","other_urls":[],"datetime":"2026-10-20T18:48:30+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Aleksey Batrakov","label":"Galatasaray - Aleksey Batrakov","folders":[{"area":"tr","folder":"Galatasaray - Aleksey Batrakov"}],"img":"Pba6c4aa9","file":"AA-20261021-42824995-42824987-LILLE_GALATASARAY.jpg"}],"no":84,"date_text":"20 Ekim","time_text":"18:48","day_full":"20 Ekim 2026"},{"id":"356d071c79","tr":"TFF, 8. haftanın VAR kayıtlarını yayımladı. Fenerbahçe-Alanyaspor maçında İrfan Can Kahveci'nin golü, VAR'ın gösterdiği faulün ardından hakem Çağdaş Altay'ın 'Golü iptal edip faulle başlıyorum' sözleriyle iptal edilmiş.","en":"The TFF have released the VAR audio from Matchweek 8. It reveals referee Cagdas Altay ruling out Irfan Can Kahveci's goal for Fenerbahce against Alanyaspor after being shown a foul in the build-up: 'I'm disallowing the goal and restarting with the foul.'","title":"VAR kayıtları açıklandı: Fenerbahçe'nin iptal edilen golünde neler konuşuldu?","sources":["fanatik.com.tr","fotomac.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-var-kayitlari-aciklandi-fenerbahcenin-iptal-edilen-golunde-neler-konusuldu-431614","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fenerbahce-alanyaspor-macinin-var-kayitlari-aciklandi-iptal-edip-golle-basliyorum-2641722"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/superlig/2026/10/20/super-ligde-8-haftanin-var-kayitalri- .com.tr/haber/tff-yeni-mhk-baskanini-resmen-acikladi"},{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/mhknin-yeni-baskani-anthony-taylor-33684664"},{"source":"sporx.com","url":"https://www.sporx.com/tff-acikladi-mhk-baskani-anthony-taylor-SXHBQ1179988SXQ"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/millitakim/2026/10/20/mhknin-yeni-baskani-belli-oldu"}],"datetime":"2026-10-20T16:54:00+03:00","time_known":true,"tags":["hakem"],"clubs":[],"players":[{"name":"İbrahim Hacıosmanoğlu","label":"İbrahim Hacıosmanoğlu (A Milli Takım)","folders":[{"area":"milli","folder":"İbrahim Hacıosmanoğlu"}],"img":"P6a960a39","file":"AA-20261009-42705129-42705122-TURKIYE_FUTBOL_FEDERASYONU_YONETIM_KURULU_OLAGANUSTU_TOPLANTISI.jpg"}],"no":89,"date_text":"20 Ekim","time_text":"16:54","day_full":"20 Ekim 2026"},{"id":"f692f9ef79","tr":"Fenerbahçe U19, UEFA Gençlik Ligi'nde Slavia Prag'a sahasında 3-1 yenildi. Alaettin Ekici'nin golüyle öne geçen sarı-lacivertliler, üç maçta da puan alamadı.","en":"Fenerbahce's Under-19s were beaten 3-1 at home by Slavia Prague in the UEFA Youth League. Alaettin Ekici put them ahead early, but they have now lost all three of their games.","title":"Fenerbahçe'nin gençleri Slavia Prag'a mağlup","sources":["fanatik.com.tr","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fenerbahcenin-gencleri-slavia-praga-maglup-2641705","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-u19-slavia-prag-u19-a-maglup-SXHBQ1179970SXQ"}],"datetime":"2026-10-20T16:22:11+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"}],"players":[],"no":90,"date_text":"20 Ekim","time_text":"16:22","day_full":"20 Ekim 2026"},{"id":"a28a6404b8","tr":"Sergen Yalçın'ın A Milli Takım'daki ekibi belli oldu. Murat Kaytaz, Ozan Köprülü, Niyazi Eniseler, Erol Ayçiçek, Emre Gürbüz ve Tarık Egeli, Yalçın'ın en son Beşiktaş'ta birlikte çalıştığı isimler.","en":"Sergen Yalcin's Turkey backroom staff has been confirmed. Murat Kaytaz, Ozan Koprulu, Niyazi Eniseler, Erol Aycicek, Emre Gurbuz and Tarik Egeli all worked with him most recently at Besiktas.","title":"Sergen Yalçın'ın A Milli Takım'daki ekibi belli oldu! İsimlerin hepsi Süper Lig'den","sources":["ntvspor.net"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-sergen-yalcinin-a-milli-takimdaki-ekibi-belli-oldu-isimlerin-hepsi-super-ligden-431602","other_urls":[],"datetime":"2026-10-20T16:02:24+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"A Milli Takım","logo":"Logolar\\Ülke Bayrakları\\Turkey.png","img":"Lfdea17ba","file":"Logolar\\Ülke Bayrakları\\Turkey.png"}],"players":[],"no":91,"date_text":"20 Ekim","time_text":"16:02","day_full":"20 Ekim 2026"},{"id":"eb999028e3","tr":"Galatasaray, yarın 19.45'te oynanacak Lille deplasmanının kamp kadrosunu açıkladı. Kasık sakatlığı bulunan Rafael Leao kafilede yok, sakatlığını atlatan Wilfried Singo ise haftalar sonra kadroya döndü.","en":"Galatasaray have named their squad for tomorrow's Champions League trip to Lille, which kicks off at 19:45. Rafael Leao misses out with a groin strain, but Wilfried Singo returns after weeks out injured.","title":"Galatasaray Lille maçı kafilesini duyurdu! Haftalar sonra kadroya geri döndü","sources":["fanatik.com.tr","fotomac.com.tr","mackolik.com","ntvspor.net","sporx.com","trtspor.com.tr"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaray-lille-maci-kafilesini-duyurdu-haftalar-sonra-kadroya-geri-dondu-431601","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/galatasarayin-kamp-kadrosu-belli-oldu-iste-fransaya-giden-kafile-2641693"},{"source":"mackolik.c cı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"},{"name":"Brest","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Brest.png","img":"Lcc0084f9","file":"Brest.png"}],"players":[{"name":"Berke Özer","label":"Berke Özer","folders":[{"area":"tr","folder":"Türk Futbolcular - Berke Özer"}],"img":"P0e9efa80","file":"berkelille.jpeg"}],"no":94,"date_text":"20 Ekim","time_text":"14:43","day_full":"20 Ekim 2026"},{"id":"4bf5b2b93e","tr":"Kaiserslautern'de kiralık forma giyen Erencan Yardımcı, Transfermarkt'a Galatasaray'dan ayrılışını anlattı: 'Oynamam gerektiğini biliyordum.' 24 yaşındaki forvet, 17 yaşında Fatih Terim'le Şampiyonlar Ligi'nde forma giydiğini hatırlattı.","en":"Erencan Yardimci, on loan at Kaiserslautern, has told Transfermarkt why he left Galatasaray: 'I knew I needed to play.' The 24-year-old striker recalled being handed a Champions League appearance by Fatih Terim at 17.","title":"Erencan Yardımcı, Galatasaray’dan neden ayrıldığını açıkladı: “Oynamam gerektiğini biliyordum”","sources":["transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/erencan-yardimci-galatasaraydan-neden-ayrildigini-acikladi-quot-oynamam-gerektigini-biliyordum-quot-/view/news/488976","other_urls":[],"datetime":"2026-10-20T14:00:00+03:00","time_known":true,"tags":["transfer"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[],"no":95,"date_text":"20 Ekim","time_text":"14:00","day_full":"20 Ekim 2026"},{"id":"eb70cc3086","tr":"Sergen Yalçın, Montella döneminde milli takımdan uzak kalan Berke Özer'e kapıyı açtı. 'Berke'yle konuşacağım, neden gelmesin? Özür dilemesi gereken bir şey varsa diler, çözeriz' dedi.","en":"Sergen Yalcin has opened the door to Berke Ozer, who was frozen out of the Turkey squad under Vincenzo Montella. 'I'll speak to Berke. Why shouldn't he come back? If he needs to apologise const KEY='haber_paylasildi_v1';
let shared={}; try{shared=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let flt='Tümü';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const len=s=>Array.from(s).length;
const ini=n=>n.replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr');
function chipsData(){const m={};DATA.cards.forEach(c=>c.clubs.forEach(l=>{m[l.name]=(m[l.name]||new Set()).add(c.id)}));
  return Object.entries(m).map(([k,v])=>[k,v.size]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'tr'));}
function renderChips(){const cd=chipsData();
  $('#chips').innerHTML=[['Tümü',DATA.cards.length]].concat(cd).map(([k,n])=>`<button class="chip ${k===flt?'on':''}" data-k="${esc(k)}">${esc(k)} <b>${n}</b></button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flt=b.dataset.k;renderChips();renderCards();});}
function logoHtml(l,one){return l.img?`<img src="${esc(l.img)}" alt="${esc(l.name)}" title="${esc(l.name)}">`:`<div class="ph" title="${esc(l.name)} logosu arşivde yok">${esc(ini(l.name))}</div>`;}
function card(c){
  const tags=c.tags.map(t=>`<span class="tag ${t==='yurtdışı'?'ab':''}">${esc(t)}</span>`).join('');
  const pill=`<span class="pill ${c.time_text?'':'nt'}">${esc(c.date_text)}${c.time_text?' · '+esc(c.time_text):''}</span>`;
  const logos=`<div class="logos ${c.clubs.length<2?'one':''}">${c.clubs.map(l=>logoHtml(l)).join('')||'<div class="ph sq">logo yok</div>'}</div>`;
  const photos=c.players.map(p=>`<div class="ph1">${p.img?`<a href="${esc(p.img)}" target="_blank" title="Büyük aç"><img src="${esc(p.img)}" alt="${esc(p.name)}"></a>`:`<div class="phn">Fotoğraf arşivde yok</div>`}<div class="cap"><div class="n">${esc(p.label)}</div>${p.file?`<div class="f">${esc(p.file)}</div>`:''}</div></div>`).join('');
  const lg=`<div class="lg">${esc(c.clubs.map(l=>l.name).join(' – '))}<span>Kulüp logoları</span></div>`;
  const srcs=c.sources.join(', ');
  const when=c.day_full+(c.time_text?' · '+c.time_text:' · saat belirtilmemiş')+' (İstanbul)';
  const oth=c.other_urls.filter(o=>o.url!==c.url).slice(0,5).map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.source)}</a>`).join('');
  const lang=(code,txt,cls)=>`<div class="lang"><div class="lh"><span class="badge ${cls}">${code}</span></div><div class="txt">${esc(txt)}</div><div class="act"><button class="btn" data-copy="${esc(c.id)}|${code}">Metni kopyala</button><span class="cnt">${len(txt)} karakter</span></div></div>`;
  return `<article class="card ${shared[c.id]?'done':''}" id="c_${esc(c.id)}">
  <div class="hd"><span class="no">${c.no}</span>${pill}<span class="src">${esc(c.source)}</span>${tags}
   <label class="paylas"><input type="checkbox" data-id="${esc(c.id)}" ${shared[c.id]?'checked':''}> paylaşıldı</label></div>
  <div class="body"><div class="panel">${logos}<div class="photos">${photos}</div>${lg}</div>
   <div class="main"><div class="title">kaynak başlık: ${esc(c.title)}</div>${lang('TR',c.tr,'tr')}<hr class="sep">${lang('EN',c.en,'en')}</div></div>
  <div class="ft"><span>Kaynak: ${esc(srcs)} · ${esc(when)}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">kaynağı aç</a>${oth?`<span class="oth">diğer: ${oth}</span>`:''}</div>
</article>`;}
function renderCards(){
  const list=DATA.cards.filter(c=>flt==='Tümü'||c.clubs.some(l=>l.name===flt));
  $('#grid').innerHTML=list.map(card).join('');
  document.querySelectorAll('input[data-id]').forEach(i=>i.onchange=()=>{const id=i.dataset.id;if(i.checked)shared[id]=1;else delete shared[id];
    try{localStorage.setItem(KEY,JSON.stringify(shared))}catch(e){}
    document.getElementById('c_'+id).classList.toggle('done',i.checked);info();});
  document.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>{const [id,code]=b.dataset.copy.split('|');const c=DATA.cards.find(x=>x.id===id);copyText(code==='TR'?c.tr:c.en,b);});
  info();}
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='Kopyalandı ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Metni kopyala';btn.classList.remove('ok')},1400)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);done()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb();}
