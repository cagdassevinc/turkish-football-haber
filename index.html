<head>

<style>
:root{--bg:#f3f5f7;--card:#fff;--line:#cfe6d8;--green:#137a43;--greenbg:#e3f4ea;--greentx:#1c7a46;--red:#8e1b2e;--blue:#1b3a63;--mut:#7b8794;--ink:#1d2733}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px}
.wrap{max-width:1840px;margin:0 auto;padding:14px 18px 40px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:4px 2px 12px}
.top h1{font-size:20px;margin:0;font-weight:700}
.top .upd{color:#46566a;font-size:13.5px}
.top .upd b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:1px solid #cfd6de;background:#fff;color:#2c3a4b;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;line-height:1.2;font-family:inherit}
.chip b{font-weight:600;color:#7a8696;margin-left:5px}
.chip:hover{border-color:#9aa7b6}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on b{color:#f1d3d9}
.info{background:#eef3fb;border:1px solid #d3deef;color:#46566a;border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media(max-width:1250px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.done{opacity:.6;background:#f6faf7}
.hd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:9px 12px;border-bottom:1px solid #e3efe7}
.no{color:#8795a5;font-size:13px;min-width:18px}
.pill{background:var(--greenbg);color:var(--greentx);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.nt{background:#eef0f3;color:#667385}
.src{font-weight:700;font-size:13.5px}
.tag{background:#e2ecfb;color:#1f4f9c;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}

.paylas input{width:16px;height:16px;accent-color:var(--green)}
.body{display:flex;gap:0}
.panel{flex:0 0 150px;background:#f6f8fa;border-right:1px solid #e4eaf0;padding:10px;display:flex;flex-direction:column;gap:9px}

.logos img,.logos .ph{width:50px;height:50px;object-fit:contain}
.logos.one img,.logos.one .ph{width:62px;height:62px}
.ph{background:#e9edf2;color:#5d6b7c;border:1px dashed #b9c4d0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-align:center;line-height:1}
.ph.sq{border-radius:6px;font-size:11px}
.photos{display:flex;flex-direction:column;gap:8px}
.ph1{background:#fff;border:1px solid #e1e7ee;border-radius:8px;overflow:hidden}
.ph1 a{display:block}
.ph1 img{display:block;width:100%;height:112px;object-fit:cover;object-position:50% 25%;background:#dfe5ec}
.ph1 .phn{height:112px;border-radius:0;border:0;border-bottom:1px dashed #b9c4d0;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:#8895a5;font-size:11.5px;text-align:center;padding:6px}
.cap{padding:5px 7px 6px}
.cap .n{color:#4b2fa3;font-weight:700;font-size:12px;line-height:1.25}
.cap .f{font-family:Consolas,"Courier New",monospace;font-size:10.5px;color:#4d5967;background:#f1f4f7;border:1px solid #e1e6ec;border-radius:5px;padding:2px 5px;margin-top:4px;word-break:break-all}
.lg{font-size:11.5px;color:#4b2fa3;font-weight:700;text-align:center;line-height:1.3}
.lg span{display:block;color:#98a3b0;font-weight:400}
.main{flex:1;min-width:0;padding:10px 12px 8px;display:flex;flex-direction:column;gap:10px}
.title{color:#1c7a46;font-size:12.5px;font-weight:600;line-height:1.35}
.lang .lh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;color:#fff;background:#b3261e}
.badge.en{background:#1d4e89}
.txt{font-family:Consolas,"Courier New",ui-monospace,monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;color:#1f2933}
.act{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn{background:var(--green);color:#fff;border:0;border-radius:7px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:#0e6637}
.btn.ok{background:#0b5a2f}
.cnt{color:#97a2af;font-size:12.5px}
.sep{border:0;border-top:1px dashed #dde5ec;margin:0}
.ft{border-top:1px solid #e3efe7;background:#fafcfb;padding:8px 12px;font-size:12.5px;color:#55657a;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.ft a{color:#1b4f9c;text-decoration:underline;font-weight:600}
.ft .oth a{font-weight:400;color:#6a7a8c;margin-left:6px}
.foot{margin-top:22px;color:#8795a5;font-size:12px;text-align:center}
@media(max-width:560px){.body{flex-direction:column}.panel{flex:none;border-right:0;border-bottom:1px solid #e4eaf0}.photos{flex-direction:row}.ph1{flex:1}}
</style>

eyet, Milli Takım'daki idari ve fiziki eksikleri tespit edip bir yol haritası çizecek.","en":"Sergen Yalcin and his staff have been living at the Riva complex for five days, having got to work before he even signed, according to Fanatik. The new Turkey set-up is identifying administrative and physical shortcomings to draw up a road map.","title":"ÖZEL-Sergen Yalçın imzası kurumadan kolları sıvadı! 5 gündür Riva’da yatıp, kalkıyor","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/turkiye/ozel-sergen-yalcin-imzasi-kurumadan-kollari-sivadi-5-gundur-rivada-yatip-kalkiyor-2642108","other_urls":[],"datetime":"2026-10-23T16:26:00+03:00","time_known":true,"tags":["haber"],"clubs":[],"players":[{"name":"Sergen Yalçın","label":"Sergen Yalçın (A Milli Takım)","folders":[{"area":"milli","folder":"Sergen Yalçın"}],"img":"Pff88c198","file":"AA-20261022-42832181-42832157-TFF_TEKNIK_DIREKTOR_SERGEN_YALCIN_ILE_4_YILLIK_SOZLESME_IMZALADI.jpg"}],"no":3,"date_text":"23 Ekim","time_text":"16:26","day_full":"23 Ekim 2026"},{"id":"246d32a7b2","tr":"Eintracht Frankfurt'ta Köln maçında 90 dakika yedek kulübesinde kalan Can Uzun'un, cumartesi Dortmund karşısında da yedek kalabileceği belirtildi. Adi Hütter ilk 11'de büyük değişiklik düşünmediğini söyledi; 20 yaşındaki oyuncu nisandan bu yana ilk kez süre almamıştı.","en":"Can Uzun could be left on the bench again for Eintracht Frankfurt's trip to Borussia Dortmund on Saturday. The 20-year-old was an unused substitute in the 1-0 win over Cologne, the first game he has not featured in since April, and Adi Hutter says he is not planning big changes.","title":"Eintracht Frankfurt: İşte bu yüzden Can Uzun yine yedek kulübesine mahkum olabilir","sources":["sporx.com","transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/can-uzunun-ilk-11deki-yeri-tehlikede-teknik-direktor-adi-hutter-eksik-gordugu-noktalari-acikladi/view/news/489415","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/adi-hutter-den-can-uzun-a-elestiri-SXHBQ1180354SXQ"}],"datetime":"2026-10-23T16:18:18+03:00","time_known":true,"tags":["kadro","açıklama"],"clubs":[{"name":"Eintracht Frankfurt","logo":"Logolar\\Yabancı Ligler\\Bundesliga\\Eintracht Frankfurt.png","img":"Lbb2fd760","file":"Eintracht Frankfurt.png"},{"name":"Koln","logo":"Logolar\\Yabancı Ligler\\Bundesliga\\Koln.png","img":"L10cd01e0","file":"Koln.png"}],"players":[{"name":"Can Uzun","label":"Can Uzun (A Milli Takım)","folders":[{"area":"milli","folder":"Can Uzun"}],"img":"Pedfda4bb","file":"CAN UZUN14886.JPG"}],"no":4,"date_text":"23 Ekim","time_text":"16:18","day_full":"23 Ekim 2026"},{"id":"194128fdc5","tr":"Fenerbahçe'de ameliyat sonrası sahalardan uzak kalan Mert Müldür, takımla birlikte çalışmaya başladı. Milli oyuncu, görev verilmesi halinde pazartesi Galatasaray derbisinde forma giyebilecek.","en":"Mert Muldur has returned to training with the Fenerbahce squad after surgery kept him out. The Turkey international could be available for Monday's derby with Galatasaray if called upon.","title":"Fenerbahçe'ye derbi öncesi müjde! Takımla çalışmalara başladı","sources":["fanatik.com.tr","fotomac.com.tr","ntvspor.net","sporx.com","trtspor.com.tr"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-fenerbahceye-derbi-oncesi-mujde-takimla-calismalara-basladi-431794","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-ye-mert-muldur-den-mujdeli-haber-SXHBQ1180349SXQ"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fenerbahce-galatasaray-derbisinin-hazirliklarini-surdurdu-2642106"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/fenerbahce/2026/10/23/fenerbahcenin-derbi-mesaisi-suruyor"},{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/fenerbahcede-derbi-mesaisi-33733080"}],"datetime":"2026-10-23T16:16:51+03:00","time_known":true,"tags":["sakatlık"],"clubs":[{"name":"Fenerbahçe","logo": rbahce, has broken his silence on his future. The Italian denied reports he is heading to Manchester United, saying: 'My name is linked with many clubs, but there are no talks at an advanced stage right now.'","title":"Fenerbahçe'yle adı anılmıştı! Conte'den açıklama","sources":["beinsports.com.tr","fanatik.com.tr","fotomac.com.tr","ntvspor.net","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/futbol/galeri-fenerbahceyle-adi-anilmisti-conteden-aciklama-2642089","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/antonio-conte-den-gelecegi-icin-aciklama-SXHBQ1180346SXQ"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/fenerbahce/2026/10/23/antonio-conteden-acik-kapi-sosyal-medya-hesabindan-duyurdu"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-ve-antonio-conte-gelecegiyle-ilgili-karari-bizzat-duyurdu-431792"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/antonio-conteden-yeni-takimi-icin-aciklama"}],"datetime":"2026-10-23T15:35:00+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Manchester United","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Manchester United.png","img":"Lfc9091db","file":"Manchester United.png"}],"players":[],"no":7,"date_text":"23 Ekim","time_text":"15:35","day_full":"23 Ekim 2026"},{"id":"c04705aadc","tr":"Beşiktaş, Crystal Palace maçında omzunun üzerine düşen Fabio Miretti'nin sağ omuz-köprücük kemiği ekleminde ayrışma tespit edildiğini açıkladı. 4-6 hafta sahalardan uzak kalması beklenen İtalyan orta saha, Başakşehir, Kasımpaşa ve Celtic maçlarını kaçıracak.","en":"Besiktas have confirmed Fabio Miretti suffered an acromioclavicular joint separation in his right shoulder after landing on it against Crystal Palace. The Italian midfielder is expected to be out for four to six weeks, ruling him out of games ag 4af2e9","tr":"İspanyol gazeteci Santi Segurola, Arda Güler'i Luka Modric ve Toni Kroos ile kıyasladı: 'Ne Modric ne Kroos olacak ama çok daha iyi olacak.' Segurola, 21 yaşındaki yıldızın son derece çalışkan olduğunu ve Real Madrid'de büyük işler başarmasının beklendiğini söyledi.","en":"Spanish journalist Santi Segurola has compared Arda Guler with Luka Modric and Toni Kroos: 'He won't be either of them, but he will get much better.' He called the 21-year-old incredibly hard-working and tipped him to achieve great things at Real Madrid.","title":"Modric ve Kroos'u yaralayan Arda Güler açıklaması! İspanya'da gündem oldu...","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/real-madrid/galeri-modric-ve-kroosu-yaralayan-arda-guler-aciklamasi-ispanyada-gundem-oldu-2642082","other_urls":[],"datetime":"2026-10-23T14:25:00+03:00","time_known":true,"tags":["açıklama","yurtdışı"],"clubs":[{"name":"Real Madrid","logo":"Logolar\\Yabancı Ligler\\La Liga\\Real Madrid.png","img":"Lf9569545","file":"Logolar\\Yabancı Ligler\\La Liga\\Real Madrid.png"}],"players":[{"name":"Arda Güler","label":"Real Madrid - Arda Güler","folders":[{"area":"yab","folder":"Real Madrid - Arda Güler"}],"img":"Pcd80c14a","file":"AA-20261021-42826069-42826055-REAL_MADRID_RB_LEIPZIG.jpg"}],"no":9,"date_text":"23 Ekim","time_text":"14:25","day_full":"23 Ekim 2026"},{"id":"71b268ddeb","tr":"Trabzonspor kalecisi Andre Onana, Hearts maçının ardından evine dönerken Yomra'da zincirleme trafik kazasına karıştı. Araçta ailesi de bulunan Kamerunlu kaleci ve ailesi kazayı yara almadan atlattı.","en":"Trabzonspor goalkeeper Andre Onana was involved in a multi-car collision in Yomra while driving home after the win over Hearts. The Cameroonian and his family, who were in the car with him, escaped unhurt.","title":"Trabzonsporlu Onana kaza geçirdi!","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/trabzonspor/trabzonsporlu-onana-kaza-gecirdi- d of Monday's derby at RAMS Park, a combined 642.7 million according to Transfermarkt. Leaders Galatasaray have 19 points, three more than third-placed Fenerbahce.","title":"642,7 milyon euroluk derbiye doğru - Galatasaray ve Fenerbahçe'nin en değerli futbolcuları","sources":["transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/643-milyon-euroluk-derbiye-dogru-galatasaray-ve-fenerbahcenin-en-degerli-futbolculari/view/news/489401","other_urls":[],"datetime":"2026-10-23T13:34:11+03:00","time_known":true,"tags":["kadro"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[],"no":12,"date_text":"23 Ekim","time_text":"13:34","day_full":"23 Ekim 2026"},{"id":"c7b57d0e9d","tr":"Güncellenen UEFA gelirlerine göre Galatasaray bu sezon 20,72 milyon euro, Fenerbahçe 20,02 milyon euro garantiledi. Avrupa Ligi'nde Beşiktaş 5,36, Konferans Ligi'nde Trabzonspor 3,97 milyon euroya ulaştı; sıralama ve yayın gelirleri bu rakamlara dahil değil.","en":"Galatasaray have secured 20.72 million euros in UEFA prize money so far this season and Fenerbahce 20.02 million, according to updated figures. Besiktas have banked 5.36 million in the Europa League and Trabzonspor 3.97 million in the Conference League, excluding ranking and broadcast payments.","title":"UEFA gelirleri güncellendi! Beşiktaş, Fenerbahçe, Galatasaray ve Trabzonspor ne kadar kazandı?","sources":["ntvspor.net"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-uefa-gelirleri-guncellendi-besiktas-fenerbahce-galatasaray-ve-trabzonspor-ne-kadar-kazandi-431787","other_urls":[],"datetime":"2026-10-23T13:24:42+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","fil o buy, has become indispensable as the club's only left-back. The 22-year-old UAE international has played 520 minutes across seven matches.","title":"Göztepe'de Akonnor sevinci","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/goztepe/goztepede-akonnor-sevinci-2642079","other_urls":[],"datetime":"2026-10-23T12:27:25+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Göztepe","logo":"Logolar\\Süper Lig\\Goztepe.png","img":"Le49c02f8","file":"Logolar\\Süper Lig\\Goztepe.png"}],"players":[{"name":"Richard Akonnor","label":"Göztepe - Richard Akonnor","folders":[{"area":"tr","folder":"Göztepe - Richard Akonnor"}],"img":"Pc48f279b","file":"AA-20261018-42794448-42794442-KOCAELISPOR_GOZTEPE.jpg"}],"no":15,"date_text":"23 Ekim","time_text":"12:27","day_full":"23 Ekim 2026"},{"id":"263068215e","tr":"Milliyet'e göre Fenerbahçe Başkanı Aziz Yıldırım ve yöneticiler, Galatasaray derbisi öncesi Samandıra'ya giderek takıma moral verecek. Yönetimin derbi için ekstra prim kararı aldığı, miktarın daha sonra açıklanacağı belirtildi.","en":"Fenerbahce president Aziz Yildirim and his board will visit the Samandira training ground before Monday's derby with Galatasaray, according to Milliyet. The club have reportedly agreed an extra bonus for the game, with the amount to be revealed to the players later.","title":"Aziz Yıldırım'dan derbi öncesi Samandıra operasyonu","sources":["fanatik.com.tr","ntvspor.net"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-aziz-yildirimdan-derbi-oncesi-samandira-operasyonu-431783","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/galeri-son-dakika-baskan-aziz-yildirimdan-dev-prim-galatasaray-fenerbahce-derbisi-oncesi-kesenin-agzi-acildi-2642074"}],"datetime":"2026-10-23T12:08:58+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png 33 yaşındaki forvetin Osimhen'e meydan okuması bekleniyor; Vedat Muriç kulübede olacak.","en":"Ismail Kartal is preparing Romelu Lukaku to lead the line for Fenerbahce in the Galatasaray derby. The 33-year-old, who set up a goal at Rizespor, scored against Alanyaspor and impressed off the bench against Slavia, will go head to head with Osimhen, with Vedat Muric on the bench.","title":"Fenerbahçe'de derbide gözler Romelu Lukaku'da: Osimhen'e meydan okuyacak","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fenerbahcede-derbide-gozler-romelu-lukakuda-osimhene-meydan-okuyacak-2642020","other_urls":[],"datetime":"2026-10-23T06:59:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Romelu Lukaku","label":"Fenerbahçe - Romelu Lukaku","folders":[{"area":"tr","folder":"Fenerbahçe - Romelu Lukaku"}],"img":"Pe17eef04","file":"AA-20261020-42814160-42814156-FENERBAHCE_SLAVIA_PRAG.jpg"},{"name":"İsmail Kartal","label":"Fenerbahçe - İsmail Kartal","folders":[{"area":"tr","folder":"Fenerbahçe - İsmail Kartal"}],"img":"P627f4382","file":"AA-20261020-42813305-42813304-FENERBAHCE_SLAVIA_PRAG.jpg"}],"no":37,"date_text":"23 Ekim","time_text":"06:59","day_full":"23 Ekim 2026"},{"id":"3ee686ce0c","tr":"Beşiktaş'ın ara transferde Nicolas Raskin için Rangers ile anlaşmaya yaklaştığı iddia edildi. Siyah-beyazlıların 25 yaşındaki Belçikalı orta saha için bonuslar hariç yaklaşık 17 milyon euro ödeyeceği, oyuncuyla yıllık 5 milyon euroda el sıkışıldığı öne sürüldü.","en":"Besiktas are reportedly closing in on a January deal with Rangers for Nicolas Raskin. The fee for the 25-year-old Belgian midfielder is said to be around 17 million euros plus bonuses, with personal terms of 5 million euros a year agreed.","title":"Beşiktaş'tan Nicolas Raskin bombası! Ödenecek bonservis belli oldu","sources":["fanatik.com.tr","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/besiktas/besiktastan-nicolas-raskin-bombasi-odenecek-bonservis-belli-oldu-2642039","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/besiktas-raskin-transferini-kafaya-koydu-bonservisi-belli-oldu-SXHBQ1180318SXQ"}],"datetime":"2026-10-23T06:59:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"}],"players":[],"no":38,"date_text":"23 Ekim","time_text":"06:59","day_full":"23 Ekim 2026"},{"id":"dbb8540df4","tr":"Beşiktaş'ta Crystal Palace maçına ilk 11'de başlayan Ümit Akdağ, 78. dakikada direkt kırmızı kart gördü. 23 yaşındaki futbolcu maçın ardından kırmızı kart için özür diledi.","en":"Umit Akdag, who started for Besiktas against Crystal Palace, was shown a straight red card in the 78th minute. The 23-year-old apologised for the dismissal after the match.","title":"Ümit Akdağ'dan kırmızı kart sonrası özür","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/umit-akdag-dan-kirmizi-kart-sonrasi-ozur-SXHBQ1180265SXQ","other_urls":[],"datetime":"2026-10-23T01:15:12+03:00","time_known":true,"tags":["kadro"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"},{"name":"Crystal Palace","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png","img":"Lc78fce2a","file":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png"}],"players":[{"name":"Ümit Akdağ","label":"Beşiktaş - Ümit Akdağ","folders":[{"area":"tr","folder":"Beşiktaş - Ümit Akdağ"}],"img":"Pcac241f9","file":"AA-20261022-42838327-42838324-BESIKTAS_CRYSTAL_PALACE.jpg"}],"no":39,"date_text":"23 Ekim","time_text":"01:15","day_full":"23 Ekim 2026"},{"id":"c295d22977","tr":"Beşiktaş, Avrupa Ligi'nde Crystal Palace ile 2-2 berabere kaldı. Ndidi'nin 45+2'deki golüne Palace ikinci yarıda 5 dakikada iki golle karşılık verdi, Olaitan 73'te eşitledi. 7 puana ulaşan siyah-beyazlılar, Tüpraş Stadı'nda bu sezon ilk kez puan kaybetti.","en":"Besiktas were held to a 2-2 draw by Crystal Palace in the Europa League. Wilfred Ndidi struck in first-half stoppage time, Palace hit back with two goals in five minutes after the break and Junior Olaitan levelled on 73 minutes. The point takes Besiktas to seven, though they dropped points at the Tupras Stadium for the first time this season.","title":"Beşiktaş namağlup yoluna devam ediyor. İşte Avrupa Ligi’nde puan durumu","sources":["fotomac.com.tr","sporx.com","trtspor.com.tr"],"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/avrupaligi/2026/10/22/besiktas-namaglup-yoluna-devam-ediyor-iste-avrupa-liginde-puan-durumu","other_urls":[{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/besiktas-evinde-ilk-kez-takildi-33725072"},{"source":"sporx.com","url":"https://www.sporx.com/besiktas-tupras-stadi-nda-bu-sezon-ilk-kez-takildi-SXHBQ1180276SXQ"},{"source":"sporx.com","url":"https://www.sporx.com/besiktas-tan-avrupa-da-son-yillarin-en-iyi-baslangici-SXHBQ1180275SXQ"},{"source":"sporx.com","url":"https://www.sporx.com/besiktas-in-kalesi-dustu-ust-uste-6-macta-gol-yedi-SXHBQ1180277SXQ"}],"datetime":"2026-10-23T00:23:52+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"},{"name":"Crystal Palace","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png","img":"Lc78fce2a","file":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png"}],"players":[{"name":"Wilfred Ndidi","label":"Beşiktaş - Wilfred Ndidi","folders":[{"area":"tr","folder":"Beşiktaş - Wilfred Ndidi"}],"img":"P9e75307b","file":"AA-20261022-42838202-42838195-BESIKTAS_C jpg"}],"no":41,"date_text":"23 Ekim","time_text":"00:17","day_full":"23 Ekim 2026"},{"id":"df40bc3e42","tr":"Vincenzo Italiano, 10 kişi kalmalarına rağmen 'çok önemli 1 puan' aldıklarını ve Avrupa'da hâlâ namağlup olduklarını söyledi. İtalyan hoca, omzundan sakatlanan Fabio Miretti'nin birkaç hafta yok olabileceğini ve Başakşehir maçında oynamayacağını açıkladı.","en":"Vincenzo Italiano hailed 'a very important point' despite Besiktas finishing with ten men, stressing they remain unbeaten in Europe. He also confirmed that Fabio Miretti, who hurt his shoulder, could be out for a few weeks and will miss the Basaksehir game.","title":"Vincenzo Italiano: Çok önemli 1 puan aldık","sources":["beinsports.com.tr","fanatik.com.tr","mackolik.com","ntvspor.net","sporx.com","trtspor.com.tr"],"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270863/Cok-onemli-1-puan-aldik","other_urls":[{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/cok-onemli-bir-puan-aldik-33725076"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-vincenzo-italianodan-kadro-ve-mac-yorumu-bunlar-normal-431758"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/vincenzo-italiano-burada-onemli-olan-kaybetmemekti"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/besiktas/besiktasta-fabio-miretti-3-hafta-yok-italianodan-sakatlik-aciklamasi-2642032"},{"source":"sporx.com","url":"https://www.sporx.com/italiano-dan-miretti-icin-sakatlik-aciklamasi-SXHBQ1180283SXQ"}],"datetime":"2026-10-23T00:00:00+03:00","time_known":false,"tags":["sakatlık","açıklama"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"},{"name":"Crystal Palace","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png","img":"Lc78fce2a","file":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png"}],"players":[{"name":"Vincenzo Italiano","label":"Beşiktaş - Vincenzo Italiano","folders":[{"area":"tr","folder":"Beşiktaş - Vincenzo Italiano"}],"img":"P966e6513","file":"AA-20261021-42820547-42820525-BESIKTAS_CRYSTAL_PALACE_MACINA_HAZIR.jpg"},{"name":"Fabio Miretti","label":"Beşiktaş - Fabio Miretti","folders":[{"area":"tr","folder":"Beşiktaş - Fabio Miretti"}],"img":"Pa21c3e4b","file":"Crystal_Palace_vs_Besiktas_05.jpg"}],"no":42,"date_text":"23 Ekim","time_text":null,"day_full":"23 Ekim 2026"},{"id":"8247e84832","tr":"Trabzonspor'da Sidny Lopes Cabral, Hearts maçında bu sezon Avrupa'da ikinci kez kırmızı kart gördü. Portekizli futbolcu, iki maçta da ikinci sarı kartla oyundan atıldı.","en":"Sidny Lopes Cabral was sent off for the second time in Europe this season in Trabzonspor's win over Hearts. On both occasions the Portuguese defender saw a second yellow card.","title":"Trabzonspor'da Cabral, Avrupa'da yine kırmızı gördü","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/trabzonspor-da-cabral-avrupa-da-yine-kirmizi-gordu-SXHBQ1180252SXQ","other_urls":[],"datetime":"2026-10-22T21:59:19+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Hearts","logo":"Logolar\\Konferans Ligi\\Hearts.png","img":"Ld5e89687","file":"Hearts.png"}],"players":[{"name":"Sidny Lopes Cabral","label":"Trabzonspor - Sidny Lopes Cabral","folders":[{"area":"tr","folder":"Trabzonspor - Sidny Lopes Cabral"}],"img":"P4e3db41d","file":"AA-20261016-42778088-42778087-TRABZONSPOR_BESIKTAS_MACININ_HAZIRLIKLARINA_BASLADI.jpg"}],"no":43,"date_text":"22 Ekim","time_text":"21:59","day_full":"22 Ekim 2026"},{"id":"ded8a6d072","tr":"Thomas Reis, Trabzonspor'un başında ilk 5 maçını da kazanan ilk teknik direktör olarak tarihe geçti. Bordo-mavililer de Avrupa kupaları tarihinde ilk kez bir sezonun grup aşamasına 2'de 2 ile başladı.","en":"Thomas Reis has become the first Trabzonspor manager to win each of his first five matches in charge. The club have also opened a European group phase with two straight wins for the first time in their history.","title":"Thomas Reis'ten Trabzonspor'da tarihi başarı!","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/thomas-reis-ten-trabzonspor-da-tarihi-basari-SXHBQ1180251SXQ","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/trabzonspor-dan-avrupa-da-ilk-SXHBQ1180250SXQ"}],"datetime":"2026-10-22T21:54:06+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"}],"players":[{"name":"Thomas Reis","label":"Trabzonspor - Thomas Reis","folders":[{"area":"tr","folder":"Trabzonspor - Thomas Reis"}],"img":"P7a3a7b0b","file":"AA-20261021-42821187-42821167-TRABZONSPOR_HEARTS_MACINA_DOGRU.jpg"}],"no":44,"date_text":"22 Ekim","time_text":"21:54","day_full":"22 Ekim 2026"},{"id":"980b5966b0","tr":"Mohamed Salah, Hearts karşısında 1 gol 1 asistle yine sahneye çıktı ve Trabzonspor formasıyla 10. golüne ulaştı. Mısırlı yıldız, 12 sezon üst üste çift haneli gol sayısına ulaşırken bordo-mavililerin 2013'ten beri Avrupa'da penaltıdan gol atan ilk oyuncusu oldu.","en":"Mohamed Salah starred again with a goal and an assist against Hearts, taking his Trabzonspor tally to ten. The Egyptian has now hit double figures for 12 successive seasons and became the club's first player to score a European penalty since 2013.","title":"Mohamed Salah'tan Avrupa'da resital! Trabzonspor doludizgin","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/trabzonspor/mohamed-salahtan-avrupada-resital-trabzonspor-doludizgin-2641997","other_urls":[],"datetime":"2026-10-22T21:18:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Hearts","logo":"Logolar\\Konferans Ligi\\Hearts.png","img":"Ld5e89687","file":"Hearts.png"},{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzo ik","label":"Juventus - Zeki Çelik","folders":[{"area":"yab","folder":"Juventus - Zeki Celik"},{"area":"yab","folder":"Juventus - Zeki Çelik"}],"img":"Pd8ff5787","file":"JuventusTakim6.jpg"},{"name":"Kenan Yıldız","label":"Juventus - Kenan Yıldız","folders":[{"area":"yab","folder":"Juventus - Kenan Yıldız"}],"img":"P3bde69cb","file":"AA-20260824-42290666-42290663-FROSINONE_CALCIO_JUVENTUS.jpg"}],"no":46,"date_text":"22 Ekim","time_text":"21:09","day_full":"22 Ekim 2026"},{"id":"70d4171312","tr":"Galatasaray'ın eski başkanı Adnan Polat, 2008'deki Gençlerbirliği maçı öncesini ilk kez anlattı: Feldkamp'ın ayrılığıyla teknik direktörsüz uçan takımda 'içerisi cenaze evi gibiydi'. Polat'ın konuşmasıyla futbolcular ağladı, Galatasaray o maçı 88'de Cassio'nun golüyle 1-0 kazandı.","en":"Former Galatasaray president Adnan Polat has revealed for the first time what happened before the April 2008 trip to Genclerbirligi. With Karl-Heinz Feldkamp gone and no manager on the plane, it 'felt like a funeral', but his team talk left players in tears and Cassio's 88th-minute goal won it 1-0.","title":"'Bugüne kadar hiç bahsetmedim' Adnan Polat'tan yıllar sonra gelen Galatasaray itirafı: İçerisi cenaze evi gibiydi","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/bugune-kadar-hic-bahsetmedim-adnan-polattan-yillar-sonra-gelen-galatasaray-itirafi-icerisi-cenaze-evi-2641996","other_urls":[],"datetime":"2026-10-22T20:31:00+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Gençlerbirliği","logo":"Logolar\\Süper Lig\\Genclerbirligi.png","img":"L50d15159","file":"Logolar\\Süper Lig\\Genclerbirligi.png"}],"players":[],"no":47,"date_text":"22 Ekim","time_text":"20:31","day_full":"22 Ekim 2026"},{"id":"35973a5910","tr":"Galatasaray'da Lille maçında ağrısına rağmen oynayan Barış Alper Yılmaz'ın ağrıları arttı. Milli futbolcunun durumu yapılacak tetkiklerin ardından netleşecek.","en":"Galatasaray's Baris Alper Yilmaz, who played through the pain against Lille, has seen his discomfort worsen. The Turkey international's condition will become clear after further tests.","title":"Galatasaray'da Barış Alper gelişmesi!","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/galatasaray-da-baris-alper-gelismesi-SXHBQ1180241SXQ","other_urls":[],"datetime":"2026-10-22T20:29:31+03:00","time_known":true,"tags":["sakatlık"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[{"name":"Barış Alper Yılmaz","label":"Galatasaray - Barış Alper Yılmaz","folders":[{"area":"tr","folder":"Galatasaray - Barış Alper Yılmaz"}],"img":"P7756dc7c","file":"AA-20261021-42824743-42824741-LILLEGALATASARAY.jpg"}],"no":48,"date_text":"22 Ekim","time_text":"20:29","day_full":"22 Ekim 2026"},{"id":"55d54b35d5","tr":"Fabrizio Romano'ya göre Arda Güler, Real Madrid ile 5 yıllık yeni sözleşmeye imza attı. Eylül'de varılan prensip anlaşmasının ardından evrak işleri tamamlandı; kulübün resmi açıklaması bekleniyor.","en":"Arda Guler has signed a new five-year contract with Real Madrid, according to Fabrizio Romano. The paperwork follows an agreement in principle reached in September, with an official announcement from the club expected.","title":"Arda Güler'de son dakika gelişmesi: Performansından sonra kaçınılmazdı","sources":["beinsports.com.tr","fanatik.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-arda-gulerde-son-dakika-gelismesi-performansindan-sonra-kacinilmazdi-431747","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/romano-duyurdu-arda-guler-imzayi-atti-SXHBQ1180236SXQ" ng the opener and Nelson Semedo for the second, while Turkey internationals Kerem Akturkoglu and Ismail Yuksek were criticised for ineffective displays.","title":"Fenerbahçe'de 4 futbolcu hedefte! 2 milli yıldıza tepki","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/fenerbahcede-4-futbolcu-hedefte-2-milli-yildiza-tepki-2641934","other_urls":[],"datetime":"2026-10-22T11:43:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"}],"players":[{"name":"Matteo Guendouzi","label":"Fenerbahçe - Matteo Guendouzi","folders":[{"area":"tr","folder":"Fenerbahçe - Matteo Guendouzi"}],"img":"Pb079d269","file":"AA-20261020-42813397-42813393-FENERBAHCE_SLAVIA_PRAG.jpg"},{"name":"Nelson Semedo","label":"Fenerbahçe - Nelson Semedo","folders":[{"area":"tr","folder":"Fenerbahçe - Nelson Semedo"}],"img":"P585198db","file":"fenerbahce_12.jpg"}],"no":66,"date_text":"22 Ekim","time_text":"11:43","day_full":"22 Ekim 2026"},{"id":"f079aedb22","tr":"Shakhtar Donetsk'in Inter'e 1-0 yenildiği maçın ardından konuşan Arda Turan, El Clasico'da Barcelona'yı desteklediğini söyledi. 'Arda Güler benim kardeşim ama ben Barcelona tarafındayım. O Fenerbahçe'de oynadı, ben Galatasaray'da' dedi.","en":"Arda Turan admitted he will be rooting for Barcelona in Sunday's Clasico after his Shakhtar Donetsk side lost 1-0 at Inter. 'Arda Guler is my brother, but I'm on Barcelona's side. It's the same as him playing for Fenerbahce and me for Galatasaray,' he said.","title":"Arda Turan, Arda Güler'i tenzih ederek açıkladı: Galatasaray-Fenerbahçe örneği verdi","sources":["fanatik.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-arda-turan-ar rag beraberliğinin ardından İsmail Kartal'ın Fenerbahçe'deki geleceği pazartesi oynanacak Galatasaray derbisine bağlandı. Sabah'a göre olası bir ayrılıkta Vincenzo Montella ve Antonio Conte aday olarak öne çıkıyor.","en":"Ismail Kartal's future at Fenerbahce reportedly hinges on Monday's derby with Galatasaray after the Slavia Prague draw. According to Sabah, Vincenzo Montella and Antonio Conte are the leading candidates should he depart.","title":"İsmail Kartal'ın olası ayrılığı halinde Fenerbahçe'nin 2 hoca adayı var","sources":["fanatik.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-iddialar-ayyuka-cikti-ismail-kartal-ile-olasi-veda-halinde-2-aday-konusuluyor-431717","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/fenerbahce/galeri-ismail-kartal-icin-kritik-derbi-yerine-gelecek-aday-belirlendi-2641907"},{"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-de-derbi-kaderi-belirleyecek-ismail-kartal-icin-kritik-pazartesi-SXHBQ1180172SXQ"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-tumer-metinin-galatasaray-fenerbahce-derbisi-iddiasi-konusuluyor-gerceklesirse-gundem-yanar-431716"}],"datetime":"2026-10-22T09:41:18+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"İsmail Kartal","label":"Fenerbahçe - İsmail Kartal","folders":[{"area":"tr","folder":"Fenerbahçe - İsmail Kartal"}],"img":"P627f4382","file":"AA-20261020-42813305-42813304-FENERBAHCE_SLAVIA_PRAG.jpg"}],"no":71,"date_text":"22 Ekim","time_text":"09:41","day_full":"22 Ekim 2026"},{"id":"6e3921dd02","tr":"Galatasaray'ın Lille'i 4-2 yenmesi Avrupa basınında geniş yer buldu. L'Equipe 'Lille ezildi' yazarken Africa Foot, gol sevinci yaşamayan Osimhen'i 'Lille'in nazik celladı' olarak tanımladı; Rus basını da Batrakov'un yeniden gol atmasını öne çıkardı.","en":"Galatasaray's 4-2 win at Lille made waves across the European press. L'Equipe said Lille had been 'crushed', Africa Foot dubbed Victor Osimhen 'Lille's gentle executioner' after his muted celebration, while the Russian media hailed another goal for Aleksey Batrakov.","title":"Dünya basını Galatasaray'ın Lille zaferini konuşuyor! 'Lille'in nazik celladı Osimhen'","sources":["fanatik.com.tr","ntvspor.net"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/galeri-dunya-basini-galatasarayin-lille-zaferini-konusuyor-lillein-nazik-celladi-osimhen-2641917","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaray-fransiz-basinini-yerle-bir-etti-kullandiklari-iki-ifade-var-ki-gorulmeye-deger-431715"}],"datetime":"2026-10-22T09:31:00+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[{"name":"Victor Osimhen","label":"Galatasaray - Victor Osimhen","folders":[{"area":"tr","folder":"Galatasaray - Victor Osimhen"}],"img":"P5da8296a","file":"AA-20261021-42824776-42824774-LILLE_GALATASARAY.jpg"},{"name":"Aleksey Batrakov","label":"Galatasaray - Aleksey Batrakov","folders":[{"area":"tr","folder":"Galatasaray - Aleksey Batrakov"}],"img":"Pba6c4aa9","file":"AA-20261021-42824995-42824987-LILLE_GALATASARAY.jpg"}],"no":72,"date_text":"22 Ekim","time_text":"09:31","day_full":"22 Ekim 2026"},{"id":"29f947a88f","tr":"Lille zaferi Galatasaray'ın kasasını da doldurdu. UEFA'nın lig aşamasında her galibiyete verdiği 2,1 milyon euroluk primi kazanan sarı-kırmızılılar, Sporting ve Barcelona yenilgilerinin ardından bu sezon ilk kez maç sonucu primi aldı.","en":"The win at Lille also boosted Galatasaray's coffers. The Turkish champions pocketed UEFA's 2.1 million euro bonus for a league-phase victory, their first result-based payment of the campaign after defeats by Sporting and Barcelona.","title":"Galatasaray'ın Lille zaferi kasaya para yağdırdı! Şampiyonlar Ligi'nden yine dev gelir...","sources":["fanatik.com.tr","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/galeri-galatasarayin-lille-zaferi-kasaya-para-yagdirdi-sampiyonlar-liginden-yine-dev-gelir-2641910","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/galatasaray-in-lille-zaferi-kasaya-para-yagdirdi-SXHBQ1180175SXQ"}],"datetime":"2026-10-22T08:41:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[],"no":73,"date_text":"22 Ekim","time_text":"08:41","day_full":"22 Ekim 2026"},{"id":"9f8f7edc8e","tr":"Fenerbahçe'nin Slavia Prag ile berabere kaldığı gecede N'Golo Kante enerjisiyle alkış aldı. 35 yaşındaki yıldız, son iki maçta toplam 24,44 kilometre koşarak savunmada ve hücumda öne çıktı.","en":"N'Golo Kante was one of the few Fenerbahce players to earn plaudits on the night of the Slavia Prague draw. The 35-year-old has covered a combined 24.44km in his last two games, contributing at both ends of the pitch.","title":"Fenerbahçe’de bitmeyen enerji: Kante!","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/fenerbahce-de-bitmeyen-enerji-kante-SXHBQ1180167SXQ","other_urls":[],"datetime":"2026-10-22T08:24:26+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fen  team's efforts on the pitch.","title":"Doğan’dan taraftara teşekkür","sources":["fotomac.com.tr"],"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/trabzonspor/2026/10/22/dogandan-taraftara-tesekkur","other_urls":[],"datetime":"2026-10-22T06:50:15+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"},{"name":"Hearts","logo":"Logolar\\Konferans Ligi\\Hearts.png","img":"Ld5e89687","file":"Hearts.png"}],"players":[{"name":"Ertuğrul Doğan","label":"Trabzonspor - Ertuğrul Doğan","folders":[{"area":"tr","folder":"Trabzonspor - Ertuğrul Doğan"}],"img":"Pc5b57b07","file":"AA-20260905-42392032-42392026-CUMHURBASKANI_RECEP_TAYYIP_ERDOGAN.jpg"}],"no":80,"date_text":"22 Ekim","time_text":"06:50","day_full":"22 Ekim 2026"},{"id":"245634cb6b","tr":"Arda Güler'in Leipzig'e attığı golün ardından Real Madrid resmi hesabından 'Arda, seni seviyorum' paylaşımı yaptı, Arda da 'Ben de seni seviyorum' diye yanıt verdi. Golünü 'çaldığı' Mbappe ise milli futbolcuya 'Küçük kardeşim' diye seslendi.","en":"Real Madrid's official account posted 'Arda, I love you' after Arda Guler's goal against Leipzig, and the midfielder replied 'I love you too'. Kylian Mbappe, whose shot Guler finished off, called him 'my little brother'.","title":"Real Madrid'den olay Arda Güler paylaşımı!","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/real-madrid-den-olay-arda-guler-paylasimi-SXHBQ1180150SXQ","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/mbappe-den-arda-guler-e-kucuk-kardesim-seni-seviyorum-SXHBQ1180177SXQ"}],"datetime":"2026-10-22T00:11:00+03:00","time_known":true,"tags":["açıklama","yurtdışı"],"clubs":[{"name":"Real Madrid","logo":"Logolar\\Yabancı Ligler\\La Liga\\Real Madrid.png","img":"Lf9569545","file":"Logolar\\Yabancı Ligler\\La Liga\\Real Madrid.png"}],"players":[{"name":"Arda Güler","label":"Real Madrid - Arda Güler","folders":[{"area":"yab","folder":"Real Madrid - Arda Güler"}],"img":"Pcd80c14a","file":"AA-20261021-42826069-42826055-REAL_MADRID_RB_LEIPZIG.jpg"},{"name":"Mbappe","label":"Real Madrid - Mbappe","folders":[{"area":"yab","folder":"Real Madrid - Mbappe"}],"img":"Pad2ad652","file":"AA-20261021-42826885-42826874-REAL_MADRID_RB_LEIPZIG.jpg"}],"no":81,"date_text":"22 Ekim","time_text":"00:11","day_full":"22 Ekim 2026"},{"id":"c75d7e5a3f","tr":"Victor Osimhen, Lille zaferinin ardından Fenerbahçe derbisi için 'Dört gözle bekliyoruz, evimizde oynayacağız ve avantajımız olacak' dedi. Eleştirilere de yanıt veren Nijeryalı golcü, 'Bana kimse nasıl gol atacağımı öğretemez, dünyanın en iyi santrforlarından biriyim' diye konuştu.","en":"Victor Osimhen says Galatasaray are 'counting down the days' to Monday's derby with Fenerbahce, adding that home advantage will count. The Nigeria striker also hit back at his critics after the Lille win: 'Nobody can teach me how to score. I'm one of the best strikers in the world.'","title":"Victor Osimhen'den Fenerbahçe'ye olay mesaj: \"Dört gözle bekliyoruz\"","sources":["fanatik.com.tr","fotomac.com.tr","mackolik.com","ntvspor.net"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-victor-osimhenden-fenerbahceye-olay-mesaj-dort-gozle-bekliyoruz-431706","other_urls":[{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/lille-galatasaray-macinin-ardindan-osimhenden-fenerbahce-mesaji-2641918"},{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270836/Harika-bir-galibiyet-aldik"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-osimhenden-lille-maci-sonrasi-flas-sozler-bana-kimse-ogretemez-431713"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/sampiyonlarligi/2026/10/21/victor-osimhendunyanin-en-iyi-santrforlarindan-biriyim"}],"datetime":"2026-10-22T00:03:35+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper \Lille.png"}],"players":[{"name":"Okan Buruk","label":"Galatasaray - Okan Buruk","folders":[{"area":"tr","folder":"Galatasaray - Okan Buruk"}],"img":"Pe3e43927","file":"AA-20261021-42824776-42824775-LILLE_GALATASARAY.jpg"},{"name":"Aleksey Batrakov","label":"Galatasaray - Aleksey Batrakov","folders":[{"area":"tr","folder":"Galatasaray - Aleksey Batrakov"}],"img":"Pba6c4aa9","file":"AA-20261021-42824995-42824987-LILLE_GALATASARAY.jpg"}],"no":83,"date_text":"22 Ekim","time_text":null,"day_full":"22 Ekim 2026"},{"id":"cda0f1f5bc","tr":"Beşiktaş, Crystal Palace karşısında Avrupa kupalarındaki 267. maçına çıkacak. Siyah-beyazlılar İngiliz takımlarıyla oynadığı 22 maçta 6 galibiyet, 5 beraberlik, 11 yenilgi yaşadı; bu sezon sahasındaki 8 maçın hepsini kazandı.","en":"Tonight's meeting with Crystal Palace will be Besiktas' 267th European fixture and their first ever meeting with the Londoners. They have won six, drawn five and lost 11 of their 22 games against English opposition, but have won all eight of their home matches this season.","title":"Beşiktaş, Avrupa'da 267. kez sahne alacak","sources":["mackolik.com","sporx.com"],"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270839/Besiktas-267-kez-sahne-alacak","other_urls":[{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270840/Ingiliz-ekipleriyle-23-karsilasma"},{"source":"sporx.com","url":"https://www.sporx.com/besiktas-in-avrupa-daki-kalesi-dolmabahce-SXHBQ1180168SXQ"}],"datetime":"2026-10-22T00:00:00+03:00","time_known":false,"tags":["haber"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"},{"name":"Crystal Palace","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png","img":"Lc78fce2a","file":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png"}],"players":[],"no":84,"date_text":"22 Ekim","time_text":null,"day_full":"22 Ekim 2026"},{"id":"b4ecff864a","tr":"Galatasaray, Lille'i deplasmanda yenen ilk Türk takımı oldu; Lille de Avrupa kupalarında ilk kez sahasında 4 gol yedi. Sarı-kırmızılılar, 1999'daki Hertha Berlin maçından bu yana Devler Ligi'nde deplasmanda 4 gol atan ilk Türk kulübü oldu.","en":"Galatasaray became the first Turkish side to win at Lille, who had never conceded four at home in European competition before. It was also the first time a Turkish club had scored four away from home in the Champions League since Galatasaray did so at Hertha Berlin in 1999.","title":"Galatasaray, Türk futbol tarihinde bir ilki başardı","sources":["beinsports.com.tr","mackolik.com","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaray-turk-futbol-tarihinde-bir-ilki-basardi-431686","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/galatasaray-lille-karsisinda-bir-ilki-basardi-SXHBQ1180130SXQ"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/galatasaray-lille-karsisinda-bir-ilki-basardi"},{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270825/Galatasaray-rekorunu-tekrarladi"}],"datetime":"2026-10-21T21:44:13+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[],"no":85,"date_text":"21 Ekim","time_text":"21:44","day_full":"21 Ekim 2026"},{"id":"46f5710801","tr":"Victor Osimhen, eski takımı Lille'e karşı ilk resmi maçında attığı golle farkı ikiye çıkardı ama gol sevinci yaşamadı. Maçın adamı seçilen Nijeryalı golcü, 'Büyük bir maç çıkardık, bu stadı çok seviyorum. Lille'e de başarılar diliyorum' dedi.","en":"Victor Osimhen refused to celebrate after scoring against his former club Lille, his goal stretching Galatasaray's lead to two in his first competitive meeting with them. The player of the match said: 'We put in a big performance. I love this stadium, and I wish Lille all the best.'","title":"Siftahı Fransa'da yaptı! Galatasaray'da Victor Osimhen sesleri","sources":["fanatik.com.tr","fotomac.com.tr","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/siftahi-fransada-yapti-galatasarayda-victor-osimhen-sesleri-2641881","other_urls":[{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/sampiyonlarligi/2026/10/21/osimhen-gol-sonrasi-sevinmedi"},{"source":"sporx.com","url":"https://www.sporx.com/osimhen-eski-takimina-karsi-sahada-SXHBQ1180127SXQ"}],"datetime":"2026-10-21T21:24:00+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[{"name":"Victor Osimhen","label":"Galatasaray - Victor Osimhen","folders":[{"area":"tr","folder":"Galatasaray - Victor Osimhen"}],"img":"P5da8296a","file":"AA-20261021-42824776-42824774-LILLE_GALATASARAY.jpg"}],"no":86,"date_text":"21 Ekim","time_text":"21:24","day_full":"21 Ekim 2026"},{"id":"aee797119d","tr":"Lille'in Türk kalecisi Berke Özer, 542 gün sonra ilk kez resmi bir maçta Galatasaray'a karşı forma giydi. Galatasaray'ın 52. dakikadaki üçüncü golünde Torreira'nın kafa vuruşu Berke'den sekerek ağlara gitti.","en":"Lille's Turkish goalkeeper Berke Ozer faced Galatasaray in a competitive game for the first time in 542 days. It proved a tough night for the stopper, with Torreira's 52nd-minute header deflecting in off him for Galatasaray's third.","title":"Berke Özer, 542 gün sonra Galatasaray'a karşı!","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/berke-ozer-542-gun-sonra-galatasaray-a-karsi-SXHBQ1180128SXQ","other_urls":[],"datetime":"2026-10-21T21:20:55+03:00","time_known":true,"tags":["yurtdışı"],"clubs":[{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Berke Özer","label":"Berke Özer","folders":[{"area":"tr","folder":"Türk Futbolcular - Berke Özer"}],"img":"P0e9efa80","file":"berkelille.jpeg"},{"name":"Lucas Torreira","label":"Galatasaray - Lucas Torreira","folders":[{"area":"tr","folder":"Galatasaray - Lucas Torreira"}],"img":"Pbb80cd86","file":"AA-20261021-42825324-42825318-LILLE_GALATASARAY.jpg"}],"no":87,"date_text":"21 Ekim","time_text":"21:20","day_full":"21 Ekim 2026"},{"id":"6a3108b767","tr":"Wilfried Singo, sakatlığının ardından 7 maç sonra Lille maçıyla Galatasaray kadrosuna döndü ve 'Dönüşüm kademeli olacak' dedi. Abdülkerim Bardakcı da Sporting ve Barcelona maçlarında yedek kaldıktan sonra bu sezonki ilk Şampiyonlar Ligi maçına çıktı.","en":"Wilfried Singo returned to the Galatasaray squad at Lille after missing seven games through injury, saying his comeback 'will be gradual'. Abdulkerim Bardakci also made his first Champions League appearance of the season after sitting on the bench against Sporting and Barcelona.","title":"Galatasaray'da Singo 7 maç sonra kadroda!","sources":["ntvspor.net","sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/galatasaray-da-singo-7-mac-sonra-kadroda-SXHBQ1180126SXQ","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-singodan-lille-maci-oncesinde-sakatligi-hakkinda-aciklama-431684"},{"source":"sporx.com","url":"https://www.sporx.com/wilfried-singo-dan-sakatlik-aciklamasi-kademeli-olacak-SXHBQ1180114SXQ"},{"source":"sporx.com","url":"https://www.sporx.com/abdulkerim-bardakci-nin-sampiyonlar-ligi-hasreti-bitti-SXHBQ1180124SXQ"}],"datetime":"2026-10-21T21:10:32+03:00","time_known":true,"tags":["sakatlık","kadro","açıklama"],"clubs":[{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Wilfried Singo","label":"Galatasaray - Wilfried Singo","folders":[{"area":"tr","folder":"Galatasaray - Wilfried Singo"}],"img":"P227d12e3","file":"AA-20260913-42460171-42460166-GALATASARAY_KOCAELISPOR.jpg"},{"name":"Abdülkerim Bardakçı","label":"Galatasaray - Abdülkerim Bardakçı","folders":[{"area":"tr","folder":"Galatasaray - Abdülkerim Bardakçı"}],"img":"Pd70f23ef","file":"AA-20261021-42824762-42824760-LILLE_GALATASARAY.jpg"}],"no":88,"date_text":"21 Ekim","time_text":"21:10","day_full":"21 Ekim 2026"},{"id":"019a28f495","tr":"Yaklaşık 3 ay sahalardan uzak kalacak Marco Asensio sessizliğini bozdu. Fenerbahçe'nin İspanyol yıldızı, ileride sağlığını riske atacağını bilse de takımına erken dönmek için her yolu denediğini söyledi ve süreci 'sinir bozucu' diye tanımladı.","en":"Marco Asensio has broken his silence after being ruled out for around three months. The Fenerbahce star admitted he tried everything to return early and help his side, even knowing it could pose risks to his long-term health, and described the process as 'frustrating'.","title":"Marco Asensio'dan merakla beklenen açıklama geldi: \"Sinir bozucu\"","sources":["beinsports.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-marco-asensiodan-merakla-beklenen-aciklama-geldi-sinir-bozucu-431691","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/asensio-dan-sakatlik-aciklamasi-daha-erken-donmek-icin-her-yolu-denedim-SXHBQ1180125SXQ"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/marco-asensiodan-sakatlik-aciklamasi-her-yolu-denedim"}],"datetime":"2026-10-21T21:02:16+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"Marco Asensio","label":"Fenerbahçe - Marco Asensio","folders":[{"area":"tr","folder":"Fenerbahçe - Marco Asensio"}],"img":"P4a394b92","file":"Fenerbahce_Genclerbirligi2 (13).JPG"}],"no":89,"date_text":"21 Ekim","time_text":"21:02","day_full":"21 Ekim 2026"},{"id":"9d10e2fd71","tr":"Aleksey Batrakov, Lille karşısında 44. dakikada Sallai'nin ortasına kafayla vurup skoru 2-2'ye getirdi. Barcelona maçından sonra üst üste ikinci kez gol atan 21 yaşındaki Rus, ilk üç Devler Ligi maçının ikisinde gol atan Ümit Karan, Icardi, Jardel ve Osimhen'li listeye girdi.","en":"Aleksey Batrakov headed home Sallai's cross in the 44th minute to make it 2-2 at Lille, scoring in a second straight Champions League game after Barcelona. The 21-year-old Russian joins Umit Karan, Icardi, Jardel and Osimhen as Galatasaray players to score in two of their first three games in the competition.","title":"Galatasaray'ın yıldızı Aleksey Batrakov bir açıldı pir açıldı! Üst üste 2. kez sahneye çıktı","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/galatasarayin-yildizi-aleksey-batrakov-bir-acildi-pir-acildi-ust-uste-2-kez-sahneye-cikti-2641880","other_urls":[],"datetime":"2026-10-21T20:45:21+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[{"name":"Aleksey Batrakov","label":"Galatasaray - Aleksey Batrakov","folders":[{"area":"tr","folder":"Galatasaray - Aleksey Batrakov"}],"img":"Pba6c4aa9","file":"AA-20261021-42824995-42824987-LILLE_GALATASARAY.jpg"}],"no":90,"date_text":"21 Ekim","time_text":"20:45","day_full":"21 Ekim 2026"},{"id":"7cf646f420","tr":"Lille-Galatasaray maçında skor 1-1'ken 27. dakikada Osimhen'in kaleci Berke Özer'le temasında verilen penaltı VAR'dan döndü. Hakem Obrenovic, VAR Matej Jug'un uyarısıyla pozisyonu monitörde izledi ve faul görmeyerek kararını iptal etti.","en":"Galatasaray had a penalty overturned at Lille with the score at 1-1. Referee Obrenovic pointed to the spot after Osimhen went down under a challenge from goalkeeper Berke Ozer in the 27th minute, but reversed his decision after a VAR review prompted by Matej Jug.","title":"Galatasaray'ın penaltısına VAR engeli","sources":["fotomac.com.tr","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasarayin-penaltisina-var-engeli-431690","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/galatasaray-in-penaltisi-var-dan-dondu-SXHBQ1180122SXQ"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/sampiyonlarligi/2026/10/21/lille-galatasaray-macinda-penalti-vardan-dondu-iste-pozisyon"}],"datetime":"2026-10-21T20:26:44+03:00","time_known":true,"tags":["hakem","yurtdışı"],"clubs":[{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Victor Osimhen","label":"Galatasaray - Victor Osimhen","folders":[{"area":"tr","folder":"Galatasaray - Victor Osimhen"}],"img":"P5da8296a","file":"AA-20261021-42824776-42824774-LILLE_GALATASARAY.jpg"},{"name":"Berke Özer","label":"Berke Özer","folders":[{"area":"tr","folder":"Türk Futbolcular - Berke Özer"}],"img":"P0e9efa80","file":"berkelille.jpeg"}],"no":91,"date_text":"21 Ekim","time_text":"20:26","day_full":"21 Ekim 2026"},{"id":"e699cdb5e1","tr":"Yunus Akgün, Lille karşısında 65. saniyede attığı golle Galatasaray'ın Şampiyonlar Ligi tarihindeki en erken golüne imza attı. Önceki rekor, Ekim 2025'te Bodo/Glimt'e 3. dakikada gol atan Victor Osimhen'e aitti.","en":"Yunus Akgun wrote his name into the history books by scoring after just 65 seconds at Lille, the fastest goal in Galatasaray's Champions League history. The previous record belonged to Victor Osimhen, who struck in the third minute against Bodo/Glimt in October 2025.","title":"Yunus Akgün'den 65 saniyede rekor!","sources":["beinsports.com.tr","fanatik.com.tr","ntvspor.net","sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/yunus-akgun-den-65-saniyede-rekor-SXHBQ1180120SXQ","other_urls":[{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-yunus-akgun-goluyle-galatasaray-rekorunu-kirdi-431689"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/yunus-akgun-galatasaray-tarihine-gecti"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/yunus-akgunden-tarihi-gol-galatasarayin-sampiyonlar-ligi-rekorunu-kirdi-2641878"}],"datetime":"2026-10-21T19:57:23+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"},{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Yunus Akgün","label":"Galatasaray - Yunus Akgün","folders":[{"area":"tr","folder":"Galatasaray - Yunus Akgün"}],"img":"Pc606ad21","file":"AA-20261021-42824629-42824626-LILLEGALATASARAY.jpg"},{"name":"Victor Osimhen","label":"Galatasaray - Victor Osimhen","folders":[{"area":"tr","folder":"Galatasaray - Victor Osimhen"}],"img":"P5da8296a","file":"AA-20261021-42824776-42824774-LILLE_GALATASARAY.jpg"}],"no":92,"date_text":"21 Ekim","time_text":"19:57","day_full":"21 Ekim 2026"},{"id":"e0804bf123","tr":"Galatasaray, Şampiyonlar Ligi'nde Lille'i deplasmanda 4-2 yenerek grubun ilk galibiyetini aldı. Sarı-kırmızılıların gollerini Yunus Akgün, Batrakov, Torreira ve Osimhen kaydetti; Lille'in iki golü de Diaoune'den geldi.","en":"Galatasaray ran out 4-2 winners at Lille to claim their first Champions League victory of the campaign. Yunus Akgun, Batrakov, Torreira and Osimhen were on target for the Turkish champions, with Diaoune scoring both of Lille's goals.","title":"Galatasaray'dan muhteşem zafer: Şampiyonlar Ligi'nde ilk galibiyet 4 golle geldi","sources":["fanatik.com.tr","fotomac.com.tr","mackolik.com","ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaraydan-muhtesem-zafer-sampiyonlar-liginde-ilk-galibiyet-4-golle-geldi-431681","other_urls":[{"source":"mackolik.com","url":"https://arsiv.mackolik.com/Haber/270823/Galatasaray-Lillei-4-golle-yikti"},{"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/galatasaray/live-galatasaraydan-lillee-dortluk-tarife-sampiyonlar-liginde-ilklerin-aksami-ozet-lille-galatasaray-2641765"},{"source":"sporx.com","url":"https://www.sporx.com/iste-gercek-galatasaray-bu-SXHBQ1180118SXQ"},{"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaray-fransada-4-golle-kazandi-puan-durumu-guncellendi-431696"},{"source":"fotomac.com.tr","url":"https://www.fotomac.com.tr/galatasaray/2026/10/21/lille-galatasaray-macinda-goller-pes-pese-macin-gollerini-izleyin"}],"datetime":"2026-10-21T19:36:49+03:00","time_known":true,"tags":["maç sonucu"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[{"name":"Yunus Akgün","label":"Galatasaray - Yunus Akgün","folders":[{"area":"tr","folder":"Galatasaray - Yunus Akgün"}],"img":"Pc606ad21","file":"AA-20261021-42824629-42824626-LILLEGALATASARAY.jpg"},{"name":"Aleksey Batrakov","label":"Galatasaray - Aleksey Batrakov","folders":[{"area":"tr","folder":"Galatasaray - Aleksey Batrakov"}],"img":"Pba6c4aa9","file":"AA-20261021-42824995-42824987-LILLE_GALATASARAY.jpg"}],"no":93,"date_text":"21 Ekim","time_text":"19:36","day_full":"21 Ekim 2026"},{"id":"b481d303c6","tr":"Amedspor teknik direktörü Besnik Hasi, 'Samsunspor ve Eyüpspor şu anda benim için Galatasaray maçından çok daha önemli' dedi. Hasi, bu iki takımdan puan alma ihtimallerinin daha yüksek olduğunu ve maç maç düşündüklerini vurguladı.","en":"Amedspor boss Besnik Hasi says the upcoming fixtures against Samsunspor and Eyupspor matter 'far more than the Galatasaray game' right now. He explained that his side have a better chance of picking up points in those matches and are taking things one game at a time.","title":"Besnik Hasi açık açık söyledi: \"Galatasaray maçından daha önemli\"","sources":["beinsports.com.tr","ntvspor.net","sporx.com","trtspor.com.tr"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-besnik-hasi-acik-acik-soyledi-galatasaray-macindan-daha-onemli-431678","other_urls":[{"source":"trtspor.com.tr","url":"https://www.trtspor.com.tr/haber/futbol/besnik-hasi-galatasaray-macindan-daha-onemli-33701647"},{"source":"sporx.com","url":"https://www.sporx.com/besnik-hasi-galatasaray-dan-daha-onemliler-SXHBQ1180097SXQ"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/besnik-hasi-su-anda-galatasaray-macindan-cok-daha-onemli"}],"datetime":"2026-10-21T18:00:44+03:00","time_known":true,"tags":["açıklama"],"clubs":[{"name":"Amedspor","logo":"Logolar\\Süper Lig\\Amed_SFK.png","img":"L532a4673","file":"Amed_SFK.png"},{"name":"Samsunspor","logo":"Logolar\\Süper Lig\\Samsunspor.png","img":"L8fd460d7","file":"Logolar\\Süper Lig\\Samsunspor.png"}],"players":[],"no":94,"date_text":"21 Ekim","time_text":"18:00","day_full":"21 Ekim 2026"},{"id":"292e2c85e1","tr":"Trabzonspor'un eski orta saha oyuncusu Giorgi Nemsadze 54 yaşında hayatını kaybetti. Bordo-mavili formayla 44 resmi maçta 1 gol ve 4 asist kaydeden Gürcü futbolcu için kulüp başsağlığı mesajı yayımladı.","en":"Former Trabzonspor midfielder Giorgi Nemsadze has died at the age of 54. The Georgia great made 44 competitive appearances for the club, scoring once and providing four assists, and Trabzonspor have paid tribute to him.","title":"Trabzonspor'un eski futbolcusu Giorgi Nemsadze hayatını kaybetti","sources":["beinsports.com.tr","sporx.com","transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/trabzonsporun-eski-futbolcusu-giorgi-nemsadze-hayatini-kaybetti/view/news/489296","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/trabzonspor-un-eski-futbolcusu-nemsadze-hayatini-kaybetti-SXHBQ1180102SXQ"},{"source":"beinsports.com.tr","url":"https://www.beinsports.com.tr/haber/trabzonsporlu-eski-futbolcu-giorgi-nemsadze-hayatini-kaybetti"}],"datetime":"2026-10-21T17:53:58+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Trabzonspor","logo":"Logolar\\Süper Lig\\Trabzonspor.png","img":"L417bfb39","file":"Logolar\\Süper Lig\\Trabzonspor.png"}],"players":[],"no":95,"date_text":"21 Ekim","time_text":"17:53","day_full":"21 Ekim 2026"},{"id":"da61a521d5","tr":"Trabzonspor'un genç oyuncusu Wagner Pina, yarınki Hearts maçı öncesi Mohamed Salah'a övgüler yağdırdı: 'Onunla sahada olmak, yaptıklarını görmek çok güzel.' Pina, Salah'ın saha içinde ve dışında çok önemli bir profesyonel olduğunu söyledi.","en":"Trabzonspor youngster Wagner Pina was full of praise for Mohamed Salah ahead of tomorrow's Conference League clash with Hearts: 'Being on the pitch with him and seeing what he does is wonderful.' Pina added that Salah is a true professional on and off the pitch.","title":"Wagner Pina'dan Mohamed Salah övgüsü: \"Onun yaptıklarını görebilmek çok güzel\"","sources":["ntvspor.net"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-wagner-pinadan-mohamed-salah-ovgusu-onun-yaptiklari ],"players":[],"no":103,"date_text":"21 Ekim","time_text":"14:46","day_full":"21 Ekim 2026"},{"id":"eb9f76162e","tr":"Slavia Prag maçında ıslıklanan Kerem Aktürkoğlu'nun rakamları dikkat çekiyor. Fenerbahçe'de 58 maçta 31 gol katkısıyla maç başı 0,53 ortalama yakalayan milli oyuncu, bu oranla Galatasaray (0,49) ve Benfica (0,52) dönemlerini geride bıraktı.","en":"The numbers tell a different story for Kerem Akturkoglu, who was jeered against Slavia Prague. The Turkey winger has 31 goal involvements in 58 Fenerbahce games, 0.53 per match, a better rate than he managed at Galatasaray (0.49) or Benfica (0.52).","title":"Kerem Aktürkoğlu, Fenerbahçe'de ne kadar başarılı? Galatasaray ve Benfica ile karşılaştırma","sources":["transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url":"https://www.transfermarkt.com.tr/kerem-akturkoglu-fenerbahcede-ne-kadar-basarili-galatasaray-ve-benfica-ile-karsilastirma/view/news/489288","other_urls":[],"datetime":"2026-10-21T14:38:32+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"Kerem Aktürkoğlu","label":"Fenerbahçe - Kerem Aktürkoğlu","folders":[{"area":"tr","folder":"Fenerbahçe - Kerem Aktürkoğlu"}],"img":"Pb0c60cc1","file":"AA-20261020-42813789-42813788-FENERBAHCE_SLAVIA_PRAG.jpg"}],"no":104,"date_text":"21 Ekim","time_text":"14:38","day_full":"21 Ekim 2026"},{"id":"ac440256e0","tr":"Vincenzo Italiano, yarın 22.00'deki Crystal Palace maçının ilk 11'ini son ana kadar bekleyip belirleyeceğini ve yorgunluk nedeniyle rotasyon yapacağını söyledi. Forvette Oh da Vlahovic de oynayabilir. Sakat Orkun Kökçü ve Milot Rashica son antrenmanda yoktu.","en":"Vincenzo Italiano says he will wait until the last minute to pick his side for tomorrow's kizli sağ bek, Avrupa kupalarında 20 maçlık gol ve asist suskunluğunu 21. maçında bitirdi.","en":"Nelson Semedo registered his first goal involvement for Fenerbahce in Europe with an assist against Slavia Prague. The Portuguese right-back had gone 20 European games without a goal or assist before ending the drought in his 21st.","title":"Nelson Semedo, şanssızlığını kırdı","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/nelson-semedo-sanssizligini-kirdi-SXHBQ1180076SXQ","other_urls":[],"datetime":"2026-10-21T12:27:44+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Slavia Prague","logo":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png","img":"L12c49a13","file":"Logolar\\Şampiyonlar Ligi\\Slavia_Prague.png"},{"name":"Fenerbahçe","logo":"Logolar\\Süper Lig\\Fenerbahce.png","img":"L4b975d1e","file":"Logolar\\Süper Lig\\Fenerbahce.png"}],"players":[{"name":"Nelson Semedo","label":"Fenerbahçe - Nelson Semedo","folders":[{"area":"tr","folder":"Fenerbahçe - Nelson Semedo"}],"img":"P585198db","file":"fenerbahce_12.jpg"}],"no":108,"date_text":"21 Ekim","time_text":"12:27","day_full":"21 Ekim 2026"},{"id":"e53a862ab6","tr":"TFF, çipli top teknolojisi için 18 stadyumda kablolama ve altyapı kurulumu ihalesi açtı. Teklifler 2 Kasım saat 16.00'ya kadar verilebilecek.","en":"The Turkish Football Federation has opened a tender to install cabling and infrastructure for chip-in-ball technology at 18 stadiums. Bids close on 2 November at 16:00.","title":"TFF'den çipli top açıklaması: İhale başladı","sources":["fanatik.com.tr"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/futbol/tffden-cipli-top-aciklamasi-ihale-basladi-2641814","other_urls":[],"datetime":"2026-10-21T12:24:20+03:00","time_known":true,"tags":["haber"],"clubs":[],"players":[{"name":"İbrahim Hacıosmanoğlu","label":"İbrahim Hacıosmanoğlu (A Milli Takım)","folders":[{"area":"milli","folder":"İbrahim Hacıosmanoğlu"}],"img":"P6a960a39","file":"AA-20261022-42832181-42832161-TFF_ lia","folders":[{"area":"yab","folder":"PSG - Khvicha Kvaratskhelia"}],"img":"P00f39689","file":"PSG_22_kvara_csgito.jpg"}],"no":110,"date_text":"21 Ekim","time_text":"12:15","day_full":"21 Ekim 2026"},{"id":"1a214d1a96","tr":"Son 5 maçta 9 gol yiyen Beşiktaş'ta Vincenzo Italiano, Crystal Palace karşısında savunmada değişikliğe gidebilir. İtalyan hocanın stoperde Ümit Akdağ'a şans vermesi bekleniyor.","en":"Having shipped nine goals in their last five games, Besiktas could see changes at the back against Crystal Palace. Vincenzo Italiano is expected to hand Umit Akdag a start at centre-back.","title":"Beşiktaş-Crystal Palace maçında sürpriz isim! Italiano'dan değişiklik","sources":["fanatik.com.tr","sporx.com"],"source":"fanatik.com.tr","url":"https://www.fanatik.com.tr/besiktas/besiktas-crystal-palace-macinda-surpriz-isim-italianodan-degisiklik-2641800","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/italiano-dan-savunmada-degisiklik-surpriz-isim-ilk-11-e-girebilir-SXHBQ1180028SXQ"}],"datetime":"2026-10-21T11:35:00+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Beşiktaş","logo":"Logolar\\Süper Lig\\Besiktas.png","img":"Lff608098","file":"Logolar\\Süper Lig\\Besiktas.png"},{"name":"Crystal Palace","logo":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png","img":"Lc78fce2a","file":"Logolar\\Yabancı Ligler\\Premier Lig\\Crystal Palace.png"}],"players":[{"name":"Vincenzo Italiano","label":"Beşiktaş - Vincenzo Italiano","folders":[{"area":"tr","folder":"Beşiktaş - Vincenzo Italiano"}],"img":"P966e6513","file":"AA-20261021-42820547-42820525-BESIKTAS_CRYSTAL_PALACE_MACINA_HAZIR.jpg"},{"name":"Ümit Akdağ","label":"Beşiktaş - Ümit Akdağ","folders":[{"area":"tr","folder":"Beşiktaş - Ümit Akdağ"}],"img":"Pcac241f9","file":"AA-20261022-42838327-42838324-BESIKTAS_CRYSTAL_PALACE.jpg"}],"no":111,"date_text":"21 Ekim","time_text":"11:35","day_full":"21 Ekim 2026"},{"id":"cb95d574f2","tr":"Galatasaray, Lille maçına gidecek taraftarlarını uyardı. Stat kapıları yerel saatle 16.45'te açılacak; taraftarların Rihour Metro Durağı'ndan en geç 15.45'te yola çıkması öneriliyor. Bilet ve üst araması yapılacak, misafir tribünü dışına girmek yasak.","en":"Galatasaray have issued guidance to supporters travelling to Lille. Gates open at 16:45 local time, and fans are advised to leave from Rihour metro station by 15:45 at the latest. There will be ticket and body searches, and away fans may only enter the visiting section.","title":"Galatasaray'dan Lille maçına saatler kala 4 maddelik açıklama","sources":["ntvspor.net","sporx.com"],"source":"ntvspor.net","url":"https://www.ntvspor.net/futbol/galeri-galatasaraydan-lille-macina-saatler-kala-4-maddelik-aciklama-431650","other_urls":[{"source":"sporx.com","url":"https://www.sporx.com/galatasaray-dan-lille-maci-oncesi-uyari-SXHBQ1180049SXQ"}],"datetime":"2026-10-21T11:16:28+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"},{"name":"Lille","logo":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png","img":"L517c2260","file":"Logolar\\Yabancı Ligler\\Ligue 1\\Lille.png"}],"players":[],"no":112,"date_text":"21 Ekim","time_text":"11:16","day_full":"21 Ekim 2026"},{"id":"5761c78552","tr":"Transfermarkt'ın Süper Lig'deki yeni transferler listesinde Mohamed Salah, 8 maçta 11 gol katkısıyla (8 gol, 3 asist) zirvede. Trabzonspor'un yıldızı, kariyerindeki en iyi sezon başlangıcı rekorunu egale etti; Kyziridis ve Gift Orban onu izliyor.","en":"Mohamed Salah tops Transfermarkt's chart of the Super Lig's new signings with 11 goal involvements (eight goals, three assists) in eight games. The Trabzonspor star has matched the best start of his career, with Alexandros Kyziridis and Gift Orban next on the list.","title":"Süper Lig'de yeni transferlerin skor katkısı: Mohamed Salah zirvede","sources":["sporx.com","transfermarkt.com.tr"],"source":"transfermarkt.com.tr","url  Özer","label":"Berke Özer","folders":[{"area":"tr","folder":"Türk Futbolcular - Berke Özer"}],"img":"P0e9efa80","file":"berkelille.jpeg"}],"no":114,"date_text":"21 Ekim","time_text":"11:09","day_full":"21 Ekim 2026"},{"id":"3b4e98636e","tr":"Galatasaray'ın, sözleşmesi sezon sonunda bitecek 22 yaşındaki kalecisi Jankat Yılmaz'a yeni kontrat ve 1,1 milyon euro maaş teklif edeceği belirtildi.","en":"Galatasaray are reportedly set to offer 22-year-old goalkeeper Jankat Yilmaz, whose contract expires at the end of the season, a new deal worth 1.1 million euros a year.","title":"Galatasaray'dan Jankat Yılmaz'a teklif","sources":["sporx.com"],"source":"sporx.com","url":"https://www.sporx.com/galatasaray-dan-jankat-yilmaz-a-teklif-SXHBQ1180048SXQ","other_urls":[],"datetime":"2026-10-21T10:59:24+03:00","time_known":true,"tags":["haber"],"clubs":[{"name":"Galatasaray","logo":"Logolar\\Süper Lig\\Galatasaray.png","img":"L0f012775","file":"Logolar\\Süper Lig\\Galatasaray.png"}],"players":[{"name":"Jankat Yılmaz","label":"Galatasaray - Jankat Yılmaz","folders":[{"area":"tr","folder":"Galatasaray - Jankat Yılmaz"}],"img":"P08b62e31","file":"galatasaray-goztepe3 (10).JPG"}],"no":115,"date_text":"21 Ekim","time_text":"10:59","day_full":"21 Ekim 2026"},{"id":"76c5266315","tr":"Sky Sports'a göre Arda Güler ile Real Madrid arasında yeni sözleşme için henüz anlaşma sağlanmadı, ancak görüşmeler olumlu ilerliyor. 2031'e kadar sürecek yeni kontratla maaşının bonuslarla net 5 milyon euroyu geçmesi bekleniyor. Mevcut sözleşmesi 2029'da bitiyor.","en":"Arda Guler and Real Madrid have yet to agree a new contract, according to Sky Sports, though talks are progressing well. The proposed deal would run until 2031 and more than double his wages to over 5 million euros net with bonuses. His current contract expires in 2029.","title":"İspanyolların 'FLAŞ' diyerek geçtiği Arda Güler haberinde büyük ters köşe! Meğer gerçek bambaşkaymış","sources":["ntvspor.net"],"source":"ntvspor.net","url":"https:/
